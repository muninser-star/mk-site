const byId = Object.fromEntries(recipes.map(r=>[r.id,r]));

const norm = s=>String(s).trim().toLowerCase().replaceAll("ё","е");
const aliases = new Map(Object.entries(foods).flatMap(([id, row])=>[id,row[0],...row[6]].map(s=>[norm(s),id])));
const foodKey = name=>aliases.get(norm(name)) || norm(name);
const date = iso=>new Date(iso+"T12:00:00");
const iso = d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
function shift(start,n){const d=date(start);d.setDate(d.getDate()+n);return iso(d)}
function monday(start){return shift(start,-((date(start).getDay()+6)%7))}
const today = iso(new Date());
const current = monday(today);
const dateText = (day,options)=>new Intl.DateTimeFormat("ru-RU",options).format(date(day));
const counts = r=>Object.entries(r.items).reduce((sum,[id,g])=>sum.map((n,i)=>n+foods[id][i+2]*g/100),[0,0,0,0]);
recipes.forEach(r=>r.macros=counts(r));
const nameOf = id=>foods[id]?.[0] || id;

  "орехи": ["walnuts"], "грецкие орехи": ["walnuts"],

};
function eligible(recipe,profile,excluded=[],people=[0,1,2,3]){
  if(!recipe || (recipe.items.coffee && people.some(i=>i>=2))) return false;
  return ![...profile.excluded,...excluded].some(name=>{
    const keys=foodGroups[norm(name)]||[foodKey(name)];
    return keys.some(id=>Object.hasOwn(recipe.items,id));
  });
}
const isCurd=r=>Object.hasOwn(r.items,"curd");
const total = rows=>Object.values(rows||{}).reduce((sum,id)=>byId[id]?sum.map((v,i)=>v+byId[id].macros[i]):sum,[0,0,0,0]);
const usage = rows=>Object.values(rows||{}).reduce((sum,id)=>(id&&(sum[id]=(sum[id]||0)+1),sum),{});
const fit = (numbers,goals)=>numbers.reduce((cost,x,i)=>goals[i]>0?cost+[4,3,2,2][i]*Math.abs(x-goals[i])/goals[i]:cost,0);
const plannedGoals = (profile,people)=>[0,1,2,3].map(i=>{
  const values=people.map(j=>profile.goals[j][i]/profile.factors[j]).filter(x=>x>0);
  return values.length?values.reduce((sum,v)=>sum+v,0)/values.length:0;
});
function generate(week, prefs, profile, stock, favorites, variant=0) {
  const rows={}, repeats={}, remaining={...stock};
  const servings=prefs.people.reduce((n,i)=>n+profile.factors[i],0);
  const goals=plannedGoals(profile,prefs.people);
  const candidates=recipes.filter(r=>eligible(r,profile,prefs.exclude,prefs.people));
  const requested=new Set((prefs.products||[]).map(foodKey));
  const stockBonus=r=>Object.entries(r.items).reduce((bonus,[id,g])=>
    bonus+Math.min(1,(remaining[id]||0)/(g*servings))*(requested.has(id)?1.25:.72),0);
  const preferred=r=>Object.keys(r.items).some(id=>requested.has(id));
  const variation=id=>Array.from(id).reduce((hash,c)=>Math.imul(hash^c.charCodeAt(0),16777619),2166136261)>>>0;
  let curdCount=0;
  for(let dayIndex=0;dayIndex<7;dayIndex++){
    const key=shift(week,dayIndex);
    const limit=prefs.fast.includes(dayIndex)?Math.min(20,prefs.max):prefs.max;
    let options=[{ids:{}, totals:[0,0,0,0], score:0, curd:0}];
    for(const [slot] of slots){
      const pool=candidates.filter(r=>r.time<=limit&&r.slots.includes(slot));
      const next=[];
      for(const option of options){
        next.push({...option,score:option.score+22});
        for(const recipe of pool){
          const curd=option.curd+Number(isCurd(recipe));
          if(Object.values(option.ids).includes(recipe.id)||profile.maxCurd&&curdCount+curd>profile.maxCurd)continue;
          const repeated=repeats[recipe.id]||0;
          let score=option.score+repeated*1.35-stockBonus(recipe);
          if(profile.soft&&!recipe.soft)score+=1.45;
          score+=feedback(recipe,prefs.people);
          if(prefs.people.some(i=>i>=2)&&(slot==="lunch"||slot==="dinner")&&hasIronSource(recipe))score-=1.1;
          if(recipe.id==="buck-sausage")score+=3.5;
          if(prefs.useFavorites&&favorites.includes(recipe.id))score-=1.25;
          if(prefs.priorities.includes(recipe.id)&&!repeated)score-=9;
          if(preferred(recipe))score-=repeated?0.8:2.7;
          if(variant===1)score-=stockBonus(recipe)*.72;
          if(variant===2)score+=recipe.time*.048;
          if(variant)score+=variation(key+recipe.id+variant)%97/100;
          next.push({ids:{...option.ids,[slot]:recipe.id},totals:option.totals.map((v,i)=>v+recipe.macros[i]),score,curd});
        }
      }
      next.sort((a,b)=>a.score+fit(a.totals,goals)-(b.score+fit(b.totals,goals)));
      options=next.slice(0,slot==="dinner"?1:160);
    }
    rows[key]=options[0].ids;
    curdCount+=options[0].curd;
    for(const id of Object.values(rows[key])){
      repeats[id]=(repeats[id]||0)+1;
      for(const [item,g] of Object.entries(byId[id].items))remaining[item]=Math.max(0,(remaining[item]||0)-g*servings);
    }
  }
  return rows;
}
function groceries(plan, profile, stock) {
  const servings=plan.prefs.people.reduce((n,i)=>n+profile.factors[i],0);
  const need=Object.create(null);
  for(const row of Object.values(plan.rows)) for(const id of Object.values(row)){
    for(const [item,g] of Object.entries(byId[id]?.items||{})) need[item]=(need[item]||0)+g*servings;
  }
  return Object.entries(need).map(([id,g])=>({id,need:Math.round(g),buy:Math.max(0,Math.round(g-(stock[id]||0)))})).sort((a,b)=>nameOf(a.id).localeCompare(nameOf(b.id),"ru"));
}

  const servings=plan.prefs.people.reduce((n,i)=>n+state.profile.factors[i],0);
  for(const [dateValue,row] of Object.entries(plan.rows).sort(([a],[b])=>a.localeCompare(b))){
   if(dateValue<todayAtZone||dateValue>shift(todayAtZone,30))continue;
   const needs={};
   const meals=slots.flatMap(([slot,label])=>{
    const r=byId[row[slot]];if(!r)return [];
    for(const [id,g] of Object.entries(r.items))needs[id]=(needs[id]||0)+g*servings;
    return [label+" — "+r.title];
   });
   const buy=Object.entries(needs).flatMap(([id,amount])=>{
    const grams=Math.max(0,Math.round(amount-(left[id]||0)));
    left[id]=Math.max(0,(left[id]||0)-amount);
    if(!grams||plan.checked[id]||(cfg.mode==="marked"&&!plan.toBuy?.[id]))return [];
    return [nameOf(id)+" — "+grams+" г"];
   });
   summaries[dateValue]={meals,buy};
  }
 }
 return {menu:state,notifications:cfg,summaries};
}

function stashCloudMarker(){

}
function saveCloud(){
 if(!cloud.initialized||!menuKey)return;
 cloud.dirty=true;stashCloudMarker();
 if(cloud.status==="conflict")return;
 cloud.pending=true;
 if(!cloud.busy)void flushCloud();
}
async function flushCloud(){
 cloud.busy=true;
 while(cloud.pending){
  cloud.pending=false;cloud.status="saving";updateCloudBadge();
  try{
   const data=await cloudCall("save",{revision:cloud.revision,payload:statePayload()});
   cloud.revision=data.revision;cloud.dirty=cloud.pending;cloud.status="ready";stashCloudMarker();
  }catch(err){
   cloud.pending=false;cloud.status=err.message==="conflict"?"conflict":"error";
  }
  updateCloudBadge();
 }
 cloud.busy=false;
}
async function connectCloud(force=false){
 if(!menuKey||cloud.busy)return;
 cloud.busy=true;
 try{
  const data=await cloudCall("read");
  cloud.vision=data.vision;cloud.telegram=data.telegram;
  const remote=data.state;
  let previous={};
  try{previous=JSON.parse(localStorage.getItem("family-menu-cloud")||"{}");}catch{}
  cloud.revision=remote?.revision||0;cloud.initialized=true;
  if(remote&&!force&&previous.dirty&&previous.revision!==remote.revision){
   cloud.dirty=true;cloud.status="conflict";updateCloudBadge();return;
  }
  if(remote&&(force||!previous.dirty)){
   state=hydrate(remote.payload.menu);
  }else if(!remote&&state.profile.names.join("|")===generic.names.join("|")&&data.seed){
   applySeed(data.seed);
  }
  const generated=!state.weeks[week];
  if(generated)state.weeks[week]=makeWeek(week,basicPrefs());
  try{localStorage.setItem(storageKey,JSON.stringify(state));sessionStorage.setItem("family-menu-key",menuKey);}catch{}
  cloud.status="ready";cloud.dirty=generated||!remote||(!force&&!!previous.dirty);
  stashCloudMarker();render();
 }catch(err){
  cloud.status="error";
  if(err.message==="auth")menuKey="";
  updateCloudBadge();throw err;
 }finally{cloud.busy=false;}
 if(cloud.dirty)saveCloud();
}

 state.profile=cleanProfile(seed);
 state.favorites=[...new Set([...state.favorites,...state.profile.favorites])];
 state.queued=[...new Set([...state.queued,...historicalQueue])];
 for(const plan of Object.values(state.weeks)){
  for(const row of Object.values(plan.rows))for(const [slot,id] of Object.entries(row)){
   if(!eligible(byId[id],state.profile,plan.prefs.exclude,plan.prefs.people))delete row[slot];
  }
 }
 if(wasGeneric&&state.weeks[current]&&!state.weeks[current].touched){
  const plan=state.weeks[current];
  state.weeks[current]=makeWeek(current,plan.prefs);
 }
}

async function compressPhoto(file){
 const bitmap=await createImageBitmap(file);
 const factor=Math.min(1,1500/Math.max(bitmap.width,bitmap.height));
 const canvas=document.createElement("canvas");
 canvas.width=Math.max(1,Math.round(bitmap.width*factor));canvas.height=Math.max(1,Math.round(bitmap.height*factor));
 canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height);
 bitmap.close();
 return canvas.toDataURL("image/jpeg",.78);
}

 modal={kind:"replace",day:d,slot};
 const pool=recipes.filter(r=>r.slots.includes(slot)&&currentRecipeOK(r)).sort((a,b)=>matchStock(b).length-matchStock(a).length||a.time-b.time);
 show('<h2>'+slots.find(s=>s[0]===slot)[1]+' · '+dateText(d,{weekday:"short",day:"numeric",month:"short"})+'</h2><div class="replacement">'+pool.map(r=>btn("place",img(r)+'<span><strong>'+e(r.title)+'</strong><small>'+r.time+' мин · ≈ '+Math.round(r.macros[0])+' ккал</small></span>',"pick",attr("id",r.id))).join("")+'</div>'+btn("place","Оставить свободным","quiet",attr("id","")),true);
}
function pickDay(id){
 const r=byId[id]; modal={kind:"pick-day",id};
 show('<h2>Добавить в меню</h2><p>'+e(r.title)+'</p><form id="add-dish"><label>День<select name="day">'+Object.keys(active().rows).map(d=>'<option value="'+d+'" '+(d===day?"selected":"")+'>'+dateText(d,{weekday:"long",day:"numeric",month:"short"})+'</option>').join("")+'</select></label><label>Приём пищи<select name="slot">'+slots.filter(([s])=>r.slots.includes(s)).map(([s,n])=>'<option value="'+s+'">'+n+'</option>').join("")+'</select></label><div class="formend"><button class="btn primary">Поставить в меню</button></div></form>');
}

function closeDialog(){if(dialog.open)dialog.close();modal=null;draft=null;}
function announce(message){notice=message;render();}
function setDish(d,slot,id){
 if(id&&(!currentRecipeOK(byId[id])||!byId[id].slots.includes(slot)))return false;
 const row=active().rows[d];
 if(id)row[slot]=id;else delete row[slot];
 active().touched=true;save();return true;
}
function swap(a,b){
 if(a.slot!==b.slot||a.day===b.day)return false;
 const ra=active().rows[a.day],rb=active().rows[b.day];
 const one=ra[a.slot],two=rb[b.slot];
 if(two)ra[a.slot]=two;else delete ra[a.slot];
 if(one)rb[b.slot]=one;else delete rb[b.slot];
 swapFrom=null;active().touched=true;save();return true;
}
function favorite(id){
 const f=state.favorites;
 state.favorites=f.includes(id)?f.filter(x=>x!==id):[...f,id];
 save();
}
function newDate(value,people){
 week=value; day=week===current?today:week; swapFrom=null;
 if(!state.weeks[week]){state.weeks[week]=makeWeek(week,{...basicPrefs(),people:[...people]});save();}
}

function route(){
 const hash=location.hash.slice(1);
 screen=nav.some(x=>x[0]===hash)?hash:"plan";notice="";swapFrom=null;
 render();
}
window.addEventListener("hashchange",route);
const cleanProfile=p=>{
 if(!p||![p.names,p.goals,p.factors].every(a=>Array.isArray(a)&&a.length===4))throw Error();
 if(!p.names.every(x=>typeof x==="string"&&x.trim()&&x.length<=36))throw Error();
 if(!p.goals.every(a=>Array.isArray(a)&&a.length===4&&a.every((x,i)=>Number.isFinite(x)&&x>=0&&x<=(i?1500:9000))))throw Error();
 if(!p.factors.every(x=>Number.isFinite(x)&&x>=0.1&&x<=3))throw Error();
 const strings=(x,max,len)=>Array.isArray(x)?x.filter(v=>typeof v==="string").slice(0,max).map(v=>v.slice(0,len)):[];
 return {names:p.names,goals:p.goals,factors:p.factors,excluded:strings(p.excluded,100,80),soft:!!p.soft,maxCurd:Math.max(0,Math.min(28,Math.floor(Number(p.maxCurd)||0))),favorites:strings(p.favorites,50,40).filter(id=>Object.hasOwn(byId,id)),tips:strings(p.tips,20,320)};
};
function applyProfile(profile,merge=false){
 state.profile=cleanProfile(profile);
 if(merge)state.favorites=[...new Set([...state.favorites,...state.profile.favorites])];
 for(const p of Object.values(state.weeks))for(const row of Object.values(p.rows))for(const [slot,id] of Object.entries(row)){
   if(!eligible(byId[id],state.profile,p.prefs.exclude,p.prefs.people))delete row[slot];
 }
 save();
}
const stockForm=()=>document.querySelector("#stock-form");
document.addEventListener("click",async event=>{
 const target=event.target.closest("[data-act]");
 if(!target)return;
 const {act,id,value,day:when,slot}=target.dataset;
 notice="";
 switch(act){
  case "close": closeDialog();break;
  case "survey": surveyModal();break;
  case "profile": profileModal();break;
  case "cloud": cloudModal();break;
  case "scan": scanModal();break;
  case "cloud-reload":
   try{await connectCloud(true);closeDialog();announce("Загружены данные семьи.");}catch{cloudModal();}break;
  case "cloud-overwrite":
   cloud.status="ready";saveCloud();closeDialog();announce("Сохраняю данные этого браузера.");break;
  case "detail": recipeDetail(id);break;
  case "pick-day": pickDay(id);break;
  case "fav": favorite(id);render();break;
  case "fav-detail": {const mode=modal?.mode;favorite(id);render();recipeDetail(id,mode);break;}
  case "scope": scope=value;render();break;
  case "day": day=value;if(target.dataset.open)scope="day";render();break;
  case "prev":
  case "next": newDate(shift(week,act==="prev"?-7:7),active().prefs.people);render();break;
  case "filter": recipeFilter=value;render();break;
  case "meal-filter": mealFilter=value;render();break;
  case "view": state.views[target.dataset.area]=value;save();render();break;
  case "tip": tipOffset+=Number(value);render();break;
  case "queue":
   state.queued=state.queued.includes(id)?state.queued.filter(x=>x!==id):[...state.queued,id];
   save();render();break;
  case "draft-select": if(draft){draft.selected=Number(value);previewDraft();}break;
  case "draft-save": if(draft)commitDraft();break;
  case "draft-back": if(draft)surveyModal(draft.week,draft.prefs);break;
  case "replace": replaceModal(when,slot);break;
  case "place":
   if(modal?.kind==="replace"&&setDish(modal.day,modal.slot,id)){closeDialog();announce("Меню и покупки обновлены.");}
   break;
  case "swap":
   if(swapFrom?.day===when&&swapFrom.slot===slot)swapFrom=null;
   else if(!swapFrom||!swap(swapFrom,{day:when,slot})){swapFrom={day:when,slot};scope="week";}
   render();break;
  case "cancel-swap": swapFrom=null;render();break;
  case "edit-stock": stockForm().elements.name.value=nameOf(id);stockForm().elements.grams.value=state.stock[id]||"";stockForm().elements.grams.focus();break;
  case "remove-stock": delete state.stock[id];delete state.unknownStock[id];save();render();break;
  case "copy": {
   const rows=groceries(active(),state.profile,state.stock).filter(x=>x.buy&&active().checked[x.id]!==x.buy);
   const text=rows.map(x=>nameOf(x.id)+" — "+x.buy+" г").join("\n");
   if(!text){announce("Все покупки отмечены.");break;}
   try{await navigator.clipboard.writeText(text);announce("Список скопирован.");}
   catch{modal={kind:"copy"};show('<h2>Список для копирования</h2><textarea readonly rows="11" aria-label="Список покупок">'+e(text)+'</textarea>');dialog.querySelector("textarea").select();}
   break;
  }
  case "export-profile": {
    const url=URL.createObjectURL(new Blob([JSON.stringify({...state.profile,favorites:state.favorites},null,2)],{type:"application/json"}));
    const link=document.createElement("a");link.href=url;link.download="family-profile.json";link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    break;
  }
 }
});
dialog.addEventListener("close",()=>{if(!dialog.open)modal=null;});
document.addEventListener("input",event=>{
 if(event.target.id!=="recipe-search")return;
 recipeQuery=event.target.value;
 const temp=document.createElement("template");temp.innerHTML=recipePage();
 document.querySelector("#recipe-results").replaceChildren(...temp.content.querySelector("#recipe-results").childNodes);
});
document.addEventListener("change",async event=>{
 const input=event.target;
 if(input.id==="person"){person=Number(input.value);render();}
 if(input.id==="portion"&&modal?.kind==="detail")recipeDetail(modal.id,input.selectedIndex===0?"base":"family");
 if(input.dataset.tobuy){
  const plan=active();plan.toBuy??={};
  if(input.checked)plan.toBuy[input.dataset.tobuy]=true;else delete plan.toBuy[input.dataset.tobuy];
  save();
 }
 if(input.dataset.check){
  const id=input.dataset.check;
  if(input.checked)active().checked[id]=groceries(active(),state.profile,state.stock).find(x=>x.id===id).buy;
  else delete active().checked[id];
  save();
 }
 if(input.id==="import-profile"&&input.files[0]){
  try{
   if(input.files[0].size>50000)throw Error();
   const p=JSON.parse(await input.files[0].text());applyProfile(p,true);
   closeDialog();announce("Семейный профиль загружен. Пожелания можно применить при сборке недели.");
  }catch{input.value="";const old=dialog.querySelector("[role=alert]");if(!old)dialog.querySelector("form").insertAdjacentHTML("afterbegin",'<p class="banner" role="alert">Выберите файл профиля семейного меню.</p>');}
 }
});
document.addEventListener("submit",async event=>{
 event.preventDefault();
 const form=event.target,data=new FormData(form);
 if(form.id==="cloud-login"){
  menuKey=String(data.get("key")).trim();
  const button=form.querySelector("button");button.disabled=true;
  try{await connectCloud();cloudModal();}catch{showFormError(form,"Не удалось подключиться. Проверьте код доступа медкнижки.");button.disabled=false;}
  return;
 }
 if(form.id==="notify-form"){
  state.notifications={enabled:data.has("enabled"),time:String(data.get("time")),zone:String(data.get("zone")),mode:String(data.get("mode"))};
  save();closeDialog();announce("Настройки уведомлений сохранены.");return;
 }
 if(form.id==="scan-form"){
  const button=form.querySelector("button");button.disabled=true;button.textContent="Распознаю…";
  try{const result=await cloudCall("scan",{image:await compressPhoto(data.get("image"))});if(modal?.kind==="scan")scanResults(result.items);}
  catch(err){showFormError(form,err.message==="vision_limit"?"Лимит распознавания на сегодня исчерпан.":"Не удалось распознать фото. Попробуйте другое изображение.");button.disabled=false;button.textContent="Распознать продукты";}
  return;
 }
 if(form.id==="scan-confirm"){
  for(const i of data.getAll("take")){
   const key=foodKey(data.get("item-"+i)), grams=Number(data.get("grams-"+i));
   if(!key||Object.hasOwn(Object.prototype,key))continue;
   if(grams){state.stock[key]=grams;delete state.unknownStock[key];}
   else if(!state.stock[key])state.unknownStock[key]=true;
  }
  save();closeDialog();announce("Запасы обновлены.");return;
 }
 if(form.id==="rate-form"){
  const id=form.dataset.id,mode=modal?.mode;
  state.ratings[id]=Object.fromEntries(state.profile.names.flatMap((_,i)=>{
   const value=data.get("vote-"+i),note=String(data.get("note-"+i)).trim();
   return value||note?[[i,{value,note}]]:[];
  }));
  save();recipeDetail(id,mode);showFormError(dialog.querySelector("#rate-form"),"Оценки сохранены.");return;
 }
 if(form.id==="stock-form"){
  const key=foodKey(data.get("name"));
  if(!key||Object.hasOwn(Object.prototype,key)){announce("Введите название продукта.");return;}
  state.stock[key]=Number(data.get("grams"));delete state.unknownStock[key];save();announce("Запасы и список покупок обновлены.");
 }
 if(form.id==="profile-form"){
  applyProfile({...state.profile,names:family.map((_,i)=>data.get("name"+i).trim()),factors:family.map((_,i)=>Number(data.get("factor"+i))),goals:family.map((_,i)=>[0,1,2,3].map(j=>Number(data.get("macro"+i+"-"+j)))),excluded:list(data.get("exclude")),soft:data.has("soft"),maxCurd:Number(data.get("curd"))});
  closeDialog();announce("Семейный профиль сохранён.");
 }
 if(form.id==="survey"){
  const people=data.getAll("people").map(Number);
  if(!people.length){if(!form.querySelector("[role=alert]"))form.insertAdjacentHTML("afterbegin",'<p role="alert" class="banner">Выберите хотя бы одного человека.</p>');return;}
  const target=monday(data.get("date"));
  const prefs={people,max:Number(data.get("max")),fast:data.getAll("fast").map(Number),
    priorities:[...new Set([...data.getAll("priorities")])],exclude:list(data.get("exclude")),
    products:list(data.get("products")),useFavorites:data.has("favorites")};
  draft={week:target,prefs,selected:0,variants:[0,1,2].map(variant=>generate(target,prefs,state.profile,state.stock,state.favorites,variant))};
  previewDraft();
 }
 if(form.id==="add-dish"&&modal?.kind==="pick-day"){
  if(setDish(data.get("day"),data.get("slot"),modal.id)){closeDialog();announce("Блюдо добавлено в меню.");}
 }
});
let dragged=null;
app.addEventListener("dragstart",event=>{
 const card=event.target.closest("[draggable=true][data-day]");
 if(!card)return;
 dragged={day:card.dataset.day,slot:card.dataset.slot};event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain","meal");
});
app.addEventListener("dragover",event=>{
 const card=event.target.closest("[data-drop][data-day]");
 if(card&&dragged?.slot===card.dataset.slot)event.preventDefault();
});
app.addEventListener("drop",event=>{
 const card=event.target.closest("[data-drop][data-day]");
 if(card&&dragged){event.preventDefault();if(swap(dragged,{day:card.dataset.day,slot:card.dataset.slot}))render();}
 dragged=null;
});
app.addEventListener("dragend",()=>{dragged=null;});
route();
if(menuKey)void connectCloud().catch(()=>{});

</script>
</body>
</html>
