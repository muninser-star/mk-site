function shift(start,n){const d=date(start);d.setDate(d.getDate()+n);return iso(d)}
function monday(start){return shift(start,-((date(start).getDay()+6)%7))}

const fit = (numbers,goals)=>numbers.reduce((cost,x,i)=>goals[i]>0?cost+[4,3,2,2][i]*Math.abs(x-goals[i])/goals[i]:cost,0);
const plannedGoals = (profile,people)=>[0,1,2,3].map(i=>{
  const values=people.map(j=>profile.goals[j][i]/profile.factors[j]).filter(x=>x>0);
  return values.length?values.reduce((sum,v)=>sum+v,0)/values.length:0;
});
function generate(week, prefs, profile, stock, favorites) {
  const rows={};
  const repeats={};
  const left={...stock};
  const servings=prefs.people.reduce((n,i)=>n+profile.factors[i],0);
  const goals=plannedGoals(profile,prefs.people);
  const candidates = recipes.filter(r=>eligible(r,profile,prefs.exclude));
  const stockBonus = r=>Object.entries(r.items).reduce((bonus,[id,g])=>bonus+Math.min(1,(left[id]||0)/(g*servings))*0.38,0);
  for(let day=0;day<7;day++){
    const key=shift(week,day);
    const limit=prefs.fast.includes(day)?Math.min(20,prefs.max):prefs.max;
    let options=[{ids:{}, totals:[0,0,0,0], score:0}];
    for(const [slot] of slots) {
      const pool=candidates.filter(r=>r.time<=limit && r.slots.includes(slot) && !(r.id==="curd"&&profile.maxCurd&&repeats.curd>=profile.maxCurd));
      if(!pool.length) continue;
      options=options.flatMap(o=>pool.filter(r=>!Object.values(o.ids).includes(r.id)).map(r=>{
        let score=o.score+(repeats[r.id]||0)*0.42-stockBonus(r);
        if(profile.soft&&!r.soft) score+=2.2;
        if(prefs.useFavorites&&favorites.includes(r.id)) score-=0.65;
        if(prefs.priorities.includes(r.id)&&!repeats[r.id]) score-=4;
        return {ids:{...o.ids,[slot]:r.id},totals:o.totals.map((v,i)=>v+r.macros[i]),score};
      })).concat(options.map(o=>({...o, score:o.score+9})));
    }
    options.sort((a,b)=>(a.score+fit(a.totals,goals))-(b.score+fit(b.totals,goals)));
    rows[key]=options[0].ids;
    for(const id of Object.values(rows[key])){
      repeats[id]=(repeats[id]||0)+1;
      for(const [item,g] of Object.entries(byId[id].items)) left[item]=Math.max(0,(left[item]||0)-g*servings);
    }
  }
  return rows;
}
function groceries(plan, profile, stock) {
  const servings=plan.prefs.people.reduce((n,i)=>n+profile.factors[i],0);
  const need={};
  for(const row of Object.values(plan.rows)) for(const id of Object.values(row)){
    for(const [item,g] of Object.entries(byId[id]?.items||{})) need[item]=(need[item]||0)+g*servings;
  }
  return Object.entries(need).map(([id,g])=>({id,need:Math.round(g),buy:Math.max(0,Math.round(g-(stock[id]||0)))})).sort((a,b)=>nameOf(a.id).localeCompare(nameOf(b.id),"ru"));
}

 show('<div class="recipehero">'+img(r)+'</div><h2>'+e(r.title)+'</h2><p class="muted">'+r.time+' мин · БЖУ ≈ '+r.macros.slice(1).map(v=>Math.round(v)).join(" / ")+' г и '+Math.round(r.macros[0])+' ккал на базовую порцию</p>'+
 '<p class="banner">'+e(r.tip)+'</p><label>Масштаб продуктов <select id="portion"><option value="1" '+(serving===1?"selected":"")+'>Базовая порция</option><option value="'+servingsOf()+'" '+(serving!==1?"selected":"")+'>На выбранный состав семьи</option></select></label><ul class="ingredients">'+Object.entries(r.items).map(([id,g])=>'<li><span>'+nameOf(id)+'</span><b>'+Math.round(g*serving)+' г</b></li>').join("")+'</ul>'+
 '<h3>Как приготовить</h3><ol class="steps">'+r.steps.map(s=>'<li>'+e(s)+'</li>').join("")+'</ol><p class="credit">Фото для подачи · <a href="'+photo.source+'" target="_blank" rel="noreferrer">'+e(photo.author)+', Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/'+photo.license+'/" target="_blank" rel="noreferrer">CC '+photo.license.replace("/"," ").toUpperCase()+'</a></p>'+
 '<div class="formend">'+btn("fav-detail",icon("heart")+(state.favorites.includes(id)?" В избранном":" Сохранить"),"secondary",attr("id",id))+btn("pick-day","В меню", "primary",attr("id",id))+'</div>',true);
}
function profileModal(){
 const p=state.profile;
 modal={kind:"profile"};
 show('<h2>Семейный профиль</h2><p class="muted">Цели и размер порций можно настроить для каждого. Оставьте цель пустой, если её нет.</p><form id="profile-form"><div class="profiles">'+p.names.map((name,i)=>'<fieldset><legend>'+e(name)+'</legend><div class="profile-row"><label>Имя<input name="name'+i+'" maxlength="36" required value="'+e(name)+'"></label><label>Доля порции<input name="factor'+i+'" type="number" min="0.1" max="3" step="0.05" required value="'+p.factors[i]+'"></label></div><div class="profile-macros">'+["Ккал","Белки, г","Жиры, г","Углеводы, г"].map((label,j)=>'<label>'+label+'<input type="number" min="0" max="'+(j?1500:9000)+'" name="macro'+i+'-'+j+'" value="'+(p.goals[i][j]||"")+'"></label>').join("")+'</div></fieldset>').join("")+'</div><label>Исключить из общей еды<input name="exclude" value="'+e(p.excluded.join(", "))+'" placeholder="Через запятую"></label><label class="tick"><input type="checkbox" name="soft" '+(p.soft?"checked":"")+'> Предлагать мягкие блюда чаще</label><label>Творог · максимум раз в неделю<input type="number" name="curd" min="0" max="28" value="'+p.maxCurd+'"><small>0 — без ограничения</small></label>'+
 (p.tips.length?'<div class="banner"><b>Правила вашего стола</b><ul>'+p.tips.map(t=>'<li>'+e(t)+'</li>').join("")+'</ul></div>':'')+
 '<div class="formend"><label class="btn secondary upload">Загрузить профиль<input type="file" id="import-profile" accept=".json,application/json"></label>'+btn("export-profile","Скачать профиль","secondary")+'<button class="btn primary">Сохранить</button></div><p class="muted">Файл профиля можно загрузить в браузере другого члена семьи.</p></form>',true);
}
function surveyModal(){
 const target=shift(week,7);
 const prefs=state.weeks[target]?.prefs||active().prefs;
 modal={kind:"survey"};
 show('<h2>План на новую неделю</h2><form id="survey"><label>Дата в нужной неделе<input type="date" name="date" required value="'+target+'"></label><fieldset><legend>Кто ест дома</legend><div class="choices">'+state.profile.names.map((name,i)=>'<label class="tick"><input type="checkbox" name="people" value="'+i+'" '+(prefs.people.includes(i)?"checked":"")+'>'+e(name)+'</label>').join("")+'</div></fieldset><label>Время на одно блюдо<select name="max">'+[20,25,30,35,45].map(i=>'<option value="'+i+'" '+(i===prefs.max?"selected":"")+'>'+i+' мин</option>').join("")+'</select></label><fieldset><legend>Дни, когда нужно быстро</legend><div class="choices">'+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map((s,i)=>'<label class="tick"><input type="checkbox" name="fast" value="'+i+'" '+(prefs.fast.includes(i)?"checked":"")+'>'+s+'</label>').join("")+'</div></fieldset><label>Что хочется приготовить<select name="priorities" multiple size="5">'+recipes.filter(r=>eligible(r,state.profile)).map(r=>'<option value="'+r.id+'" '+(prefs.priorities.includes(r.id)?"selected":"")+'>'+e(r.title)+'</option>').join("")+'</select><small>Можно выбрать несколько блюд.</small></label><label>Что пропустить на этой неделе<input name="exclude" value="'+e(prefs.exclude.join(", "))+'" placeholder="Например, помидоры"></label><label class="tick"><input type="checkbox" name="favorites" '+(prefs.useFavorites?"checked":"")+'> Чаще предлагать избранное</label><p class="muted">Если на выбранную неделю есть план, его заменит новое меню.</p><div class="formend"><button class="btn primary">Собрать меню '+icon("arrow")+'</button></div></form>',true);
}
function replaceModal(d,slot){
 modal={kind:"replace",day:d,slot};
 const pool=recipes.filter(r=>r.slots.includes(slot)&&eligible(r,state.profile,active().prefs.exclude)).sort((a,b)=>matchStock(b).length-matchStock(a).length||a.time-b.time);
 show('<h2>'+slots.find(s=>s[0]===slot)[1]+' · '+dateText(d,{weekday:"short",day:"numeric",month:"short"})+'</h2><div class="replacement">'+pool.map(r=>btn("place",img(r)+'<span><strong>'+e(r.title)+'</strong><small>'+r.time+' мин · ≈ '+Math.round(r.macros[0])+' ккал</small></span>',"pick",attr("id",r.id))).join("")+'</div>'+btn("place","Оставить свободным","quiet",attr("id","")),true);
}
function pickDay(id){
 const r=byId[id]; modal={kind:"pick-day",id};
 show('<h2>Добавить в меню</h2><p>'+e(r.title)+'</p><form id="add-dish"><label>День<select name="day">'+Object.keys(active().rows).map(d=>'<option value="'+d+'" '+(d===day?"selected":"")+'>'+dateText(d,{weekday:"long",day:"numeric",month:"short"})+'</option>').join("")+'</select></label><label>Приём пищи<select name="slot">'+slots.filter(([s])=>r.slots.includes(s)).map(([s,n])=>'<option value="'+s+'">'+n+'</option>').join("")+'</select></label><div class="formend"><button class="btn primary">Поставить в меню</button></div></form>');
}

function closeDialog(){if(dialog.open)dialog.close();modal=null;}
function announce(message){notice=message;render();}
function setDish(d,slot,id){
 if(id&&!eligible(byId[id],state.profile,active().prefs.exclude))return false;
 const row=active().rows[d];
 if(id)row[slot]=id;else delete row[slot];
 save();return true;
}
function swap(a,b){
 if(a.slot!==b.slot||a.day===b.day)return false;
 const ra=active().rows[a.day],rb=active().rows[b.day];
 const one=ra[a.slot],two=rb[b.slot];
 if(two)ra[a.slot]=two;else delete ra[a.slot];
 if(one)rb[b.slot]=one;else delete rb[b.slot];
 swapFrom=null;save();return true;
}
function favorite(id){
 const f=state.favorites;
 state.favorites=f.includes(id)?f.filter(x=>x!==id):[...f,id];
 save();
}
function newDate(value,people){
 week=value; day=week===current?today:week; swapFrom=null;
 if(!state.weeks[week]){state.weeks[week]=makeWeek(week,{...basicPrefs(),people:[...people]});save();}
}

function route(){
 const hash=location.hash.slice(1);
 screen=nav.some(x=>x[0]===hash)?hash:"plan";notice="";swapFrom=null;
 render();
}
window.addEventListener("hashchange",route);
const cleanProfile=p=>{
 if(!p||![p.names,p.goals,p.factors].every(a=>Array.isArray(a)&&a.length===4))throw Error();
 if(!p.names.every(x=>typeof x==="string"&&x.trim()&&x.length<=36))throw Error();
 if(!p.goals.every(a=>Array.isArray(a)&&a.length===4&&a.every((x,i)=>Number.isFinite(x)&&x>=0&&x<=(i?1500:9000))))throw Error();
 if(!p.factors.every(x=>Number.isFinite(x)&&x>=0.1&&x<=3))throw Error();
 const strings=(x,max,len)=>Array.isArray(x)?x.filter(v=>typeof v==="string").slice(0,max).map(v=>v.slice(0,len)):[];
 return {names:p.names,goals:p.goals,factors:p.factors,excluded:strings(p.excluded,100,80),soft:!!p.soft,maxCurd:Math.max(0,Math.min(28,Math.floor(Number(p.maxCurd)||0))),favorites:strings(p.favorites,50,40).filter(id=>Object.hasOwn(byId,id)),tips:strings(p.tips,20,320)};
};
function applyProfile(profile,merge=false){
 state.profile=cleanProfile(profile);
 if(merge)state.favorites=[...new Set([...state.favorites,...state.profile.favorites])];
 for(const p of Object.values(state.weeks))for(const row of Object.values(p.rows))for(const [slot,id] of Object.entries(row)){
   if(!eligible(byId[id],state.profile,p.prefs.exclude))delete row[slot];
 }
 save();
}
const stockForm=()=>document.querySelector("#stock-form");
document.addEventListener("click",async event=>{
 const target=event.target.closest("[data-act]");
 if(!target)return;
 const {act,id,value,day:when,slot}=target.dataset;
 notice="";
 switch(act){
  case "close": closeDialog();break;
  case "survey": surveyModal();break;
  case "profile": profileModal();break;
  case "detail": recipeDetail(id);break;
  case "pick-day": pickDay(id);break;
  case "fav": favorite(id);render();break;
  case "fav-detail": favorite(id);render();recipeDetail(id);break;
  case "scope": scope=value;render();break;
  case "day": day=value;if(target.dataset.open)scope="day";render();break;
  case "prev":
  case "next": newDate(shift(week,act==="prev"?-7:7),active().prefs.people);render();break;
  case "filter": recipeFilter=value;render();break;
  case "replace": replaceModal(when,slot);break;
  case "place":
   if(modal?.kind==="replace"&&setDish(modal.day,modal.slot,id)){closeDialog();announce("Меню и покупки обновлены.");}
   break;
  case "swap":
   if(swapFrom?.day===when&&swapFrom.slot===slot)swapFrom=null;
   else if(!swapFrom||!swap(swapFrom,{day:when,slot})){swapFrom={day:when,slot};scope="week";}
   render();break;
  case "cancel-swap": swapFrom=null;render();break;
  case "edit-stock": stockForm().elements.name.value=nameOf(id);stockForm().elements.grams.value=state.stock[id];stockForm().elements.grams.focus();break;
  case "remove-stock": delete state.stock[id];save();render();break;
  case "copy": {
   const rows=groceries(active(),state.profile,state.stock).filter(x=>x.buy&&active().checked[x.id]!==x.buy);
   const text=rows.map(x=>nameOf(x.id)+" — "+x.buy+" г").join("\n");
   if(!text){announce("Все покупки отмечены.");break;}
   try{await navigator.clipboard.writeText(text);announce("Список скопирован.");}
   catch{modal={kind:"copy"};show('<h2>Список для копирования</h2><textarea readonly rows="11" aria-label="Список покупок">'+e(text)+'</textarea>');dialog.querySelector("textarea").select();}
   break;
  }
  case "export-profile": {
    const url=URL.createObjectURL(new Blob([JSON.stringify({...state.profile,favorites:state.favorites},null,2)],{type:"application/json"}));
    const link=document.createElement("a");link.href=url;link.download="family-profile.json";link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    break;
  }
 }
});
dialog.addEventListener("close",()=>{if(!dialog.open)modal=null;});
document.addEventListener("input",event=>{
 if(event.target.id!=="recipe-search")return;
 recipeQuery=event.target.value;
 const temp=document.createElement("template");temp.innerHTML=recipePage();
 document.querySelector("#recipe-results").replaceChildren(...temp.content.querySelector("#recipe-results").childNodes);
});
document.addEventListener("change",async event=>{
 const input=event.target;
 if(input.id==="person"){person=Number(input.value);render();}
 if(input.id==="portion"&&modal?.kind==="detail")recipeDetail(modal.id,input.selectedIndex===0?1:Number(input.value));
 if(input.dataset.check){
  const id=input.dataset.check;
  if(input.checked)active().checked[id]=groceries(active(),state.profile,state.stock).find(x=>x.id===id).buy;
  else delete active().checked[id];
  save();
 }
 if(input.id==="import-profile"&&input.files[0]){
  try{
   if(input.files[0].size>50000)throw Error();
   const p=JSON.parse(await input.files[0].text());applyProfile(p,true);
   closeDialog();announce("Семейный профиль загружен. Пожелания можно применить при сборке недели.");
  }catch{input.value="";const old=dialog.querySelector("[role=alert]");if(!old)dialog.querySelector("form").insertAdjacentHTML("afterbegin",'<p class="banner" role="alert">Выберите файл профиля семейного меню.</p>');}
 }
});
document.addEventListener("submit",event=>{
 event.preventDefault();
 const form=event.target,data=new FormData(form);
 if(form.id==="stock-form"){
  state.stock[foodKey(data.get("name"))]=Number(data.get("grams"));save();announce("Запасы и список покупок обновлены.");
 }
 if(form.id==="profile-form"){
  applyProfile({...state.profile,names:family.map((_,i)=>data.get("name"+i).trim()),factors:family.map((_,i)=>Number(data.get("factor"+i))),goals:family.map((_,i)=>[0,1,2,3].map(j=>Number(data.get("macro"+i+"-"+j)))),excluded:list(data.get("exclude")),soft:data.has("soft"),maxCurd:Number(data.get("curd"))});
  closeDialog();announce("Семейный профиль сохранён.");
 }
 if(form.id==="survey"){
  const people=data.getAll("people").map(Number);
  if(!people.length){if(!form.querySelector("[role=alert]"))form.insertAdjacentHTML("afterbegin",'<p role="alert" class="banner">Выберите хотя бы одного человека.</p>');return;}
  week=monday(data.get("date"));day=week===current?today:week;
  const prefs={people,max:Number(data.get("max")),fast:data.getAll("fast").map(Number),priorities:data.getAll("priorities"),exclude:list(data.get("exclude")),useFavorites:data.has("favorites")};
  state.weeks[week]=makeWeek(week,prefs);scope="day";swapFrom=null;save();closeDialog();
  if(screen!=="plan"){location.hash="plan";screen="plan";}
  announce("План на неделю готов.");
 }
 if(form.id==="add-dish"&&modal?.kind==="pick-day"){
  if(setDish(data.get("day"),data.get("slot"),modal.id)){closeDialog();announce("Блюдо добавлено в меню.");}
 }
});
let dragged=null;
app.addEventListener("dragstart",event=>{
 const card=event.target.closest("article[draggable][data-day]");
 if(!card)return;
 dragged={day:card.dataset.day,slot:card.dataset.slot};event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain","meal");
});
app.addEventListener("dragover",event=>{
 const card=event.target.closest("article[data-day]");
 if(card&&dragged?.slot===card.dataset.slot)event.preventDefault();
});
app.addEventListener("drop",event=>{
 const card=event.target.closest("article[data-day]");
 if(card&&dragged){event.preventDefault();if(swap(dragged,{day:card.dataset.day,slot:card.dataset.slot}))render();}
 dragged=null;
});
app.addEventListener("dragend",()=>{dragged=null;});
route();

</script>
</body>
</html>
