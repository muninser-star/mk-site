/*КОМП-НАЧАЛО*/
:root {
  /* ── Шрифт ── */
  --font: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* ── Текст ── */
  --text-primary:   #101518;
  --text-paragraph: #29343d;
  --text-secondary: #5c7384;
  --text-tertiary:  #9db0be;
  --text-accent:    #118cdf;
  --text-accent-2:  #ff1f78;
  --text-positive:  #1a9e32;
  --text-warning:   #fa5f05;
  --text-negative:  #ff293e;
  --text-on-dark:   #f6f8f9;

  /* ── Поверхности ── */
  --page:           #f3f5f7;   /* фон страницы */
  --card:           #ffffff;
  --surface-1:      #f3f5f7;   /* плитки внутри карточки, поля ввода */
  --surface-2:      #e7ebef;   /* вторичные кнопки, разделители */
  --surface-3:      #dae1e7;
  --surface-dark:   #080a0c;   /* чёрные кнопки и активная вкладка */
  --on-surface-dark:#f6f8f9;   /* текст на них */
  --accent:         #199af0;
  --accent-2:       #ff4791;
  --positive:       #1a9e32;
  --warning:        #fa5f05;
  --negative:       #ff293e;

  /* Мягкие фоны статусов (для плашек «норма / выше / ниже») */
  --positive-soft:  #e6f6e9;
  --warning-soft:   #fff0e5;
  --negative-soft:  #ffe9ec;
  --accent-soft:    #e5f3fd;

  /* ── Градиенты ── */
  --grad-accent: linear-gradient(75deg, #12c2f3, #2b8ced);
  --grad-pink:   linear-gradient(75deg, #fc95da, #ff1f78);
  /* фон шапки-«героя»: тёмно-синий → малиновый → розовый */
  --grad-hero:
    radial-gradient(60% 120% at 100% 100%, #ff4791 0%, transparent 60%),
    radial-gradient(50% 100% at 0% 100%, #1c2a8c 0%, transparent 60%),
    radial-gradient(40% 90% at 60% 0%, #d65bd9 0%, transparent 60%),
    linear-gradient(120deg, #2a2f8f, #b23fc4 55%, #ff6fa8);

  /* ── Радиусы ── */
  --r-xs: 6px;    /* мелкие метки */
  --r-s:  8px;    /* маленькая кнопка */
  --r-m:  10px;   /* обычная кнопка */
  --r-l:  12px;   /* поле, кнопка в шапке */
  --r-xl: 16px;   /* карточка-строка */
  --r-2xl: 20px;  /* карточка, плитка, окно */
  --r-pill: 9999px; /* вкладки, чипы */

  /* ── Тени: почти нет, только у всплывающих окон ── */
  --shadow-s: 0 4px 16px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
  --shadow-m: 0 20px 48px rgba(0,0,0,.08);
  --shadow-popup: 0 16px 32px -8px rgba(0,0,0,.24);

  /* ── Отступы (шаг 4) ── */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  /* ── Ширина контента ── */
  --content: 700px;   /* колонка карточек на сайте-образце */
  --content-wide: 1100px;

  /* ── Движение ── */
  --ease-out: cubic-bezier(.22,1,.36,1);     /* появление, «мягкая посадка» */
  --ease-std: cubic-bezier(.4,0,.2,1);       /* наведение, смена цвета */
  --t-fast: 120ms;   /* нажатие */
  --t-base: 200ms;   /* наведение, вкладки */
  --t-slow: 500ms;   /* появление блоков */
  --t-data: 800ms;   /* шкала показателя, счётчик */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=&quot;light&quot;]) {
    --text-primary:#f6f8f9; --text-paragraph:#ced7de; --text-secondary:#9db0be; --text-tertiary:#5c7384; --text-accent:#52baff; --text-positive:#24b23e; --text-warning:#fe7024; --text-negative:#ff3d51;
    --page:#101518; --card:#181f25; --surface-1:#212a31; --surface-2:#2b363f; --surface-3:#36434d;
    --surface-dark:#f6f8f9; --on-surface-dark:#101518;
    --positive-soft:#12331b; --warning-soft:#3a2410; --negative-soft:#3d1a1f; --accent-soft:#0f2d44;
    --shadow-popup: 0 16px 32px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme=&quot;dark&quot;] {
  --text-primary:#f6f8f9; --text-paragraph:#ced7de; --text-secondary:#9db0be; --text-tertiary:#5c7384; --text-accent:#52baff; --text-positive:#24b23e; --text-warning:#fe7024; --text-negative:#ff3d51;
  --page:#101518; --card:#181f25; --surface-1:#212a31; --surface-2:#2b363f; --surface-3:#36434d;
  --surface-dark:#f6f8f9; --on-surface-dark:#101518;
  --positive-soft:#12331b; --warning-soft:#3a2410; --negative-soft:#3d1a1f; --accent-soft:#0f2d44;
}


.t-h2  { font: 600 20px/26px var(--font); }
.t-h3  { font: 600 16px/22px var(--font); }
.t-text-m  { font: 400 16px/24px var(--font); letter-spacing: -.3px; }
.t-text-s  { font: 400 14px/20px var(--font); letter-spacing: -.3px; }
.t-text-xs { font: 400 12px/16px var(--font); letter-spacing: -.25px; }
.t-bold    { font-weight: 600; }
.t-muted   { color: var(--text-secondary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  height: 40px; padding: 0 16px; border: 0; cursor: pointer;
  font: 600 14px/18px var(--font); letter-spacing: -.3px;
  border-radius: var(--r-m); transition: filter var(--t-base) var(--ease-std), transform var(--t-fast) var(--ease-std);
  text-decoration: none;
}
.btn:hover { filter: brightness(.94); }
.btn:active { transform: scale(.96); }
.btn-primary   { background: var(--accent); color: var(--text-on-dark); }
.btn-secondary { background: var(--surface-2); color: var(--text-primary); }
.btn-lg        { height: 48px; font-size: 16px; line-height: 20px; border-radius: var(--r-l); }
.tabs { display: flex; gap: var(--sp-1); }
.tab {
  height: 28px; padding: 0 10px; border: 0; cursor: pointer; background: transparent;
  font: 600 12px/14px var(--font); letter-spacing: -.25px; color: var(--text-primary);
  border-radius: var(--r-pill);
  transition: background var(--t-base) var(--ease-std), color var(--t-base) var(--ease-std);
}
.tab:hover:not([aria-selected=&quot;true&quot;]) { background: var(--surface-2); }
.tab[aria-selected=&quot;true&quot;], .tab.is-active { background: var(--surface-dark); color: var(--on-surface-dark); }
.lockbox,
.popup { background: var(--card); border-radius: var(--r-2xl); padding: var(--sp-6); box-shadow: var(--shadow-popup); animation: pop-in var(--t-base) var(--ease-out) both; }
.status { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-pill); font: 600 12px/14px var(--font); letter-spacing: -.25px; }
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-ok   { color: var(--text-positive); background: var(--positive-soft); }
.status-warn { color: var(--text-warning);  background: var(--warning-soft); }
.status-bad  { color: var(--text-negative); background: var(--negative-soft); }
.status-info { color: var(--text-accent);   background: var(--accent-soft); }
@keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pop-in  { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes grow    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes dot-in  { from { left: 0; opacity: 0; } 30% { opacity: 1; } to { left: var(--pos, 50%); opacity: 1; } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 currentColor; } 50% { box-shadow: 0 0 0 4px transparent; } }
.reveal { animation: fade-up var(--t-slow) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms); }
.skeleton { border-radius: var(--r-l); background: linear-gradient(90deg, var(--surface-1) 30%, var(--surface-2) 50%, var(--surface-1) 70%) 0 0 / 200% 100%; animation: shimmer 1.4s linear infinite; }
.status-bad::before { animation: pulse-dot 2s ease-out infinite; }
.chart { position: relative; }
.chart { max-width: 620px; }   /* на широком экране график не растягивается — надписи остаются обычного размера */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart__grid   { stroke: var(--surface-2); stroke-width: 1; }
.chart__band   { fill: var(--positive); opacity: .12; }
.chart__label  { fill: var(--text-secondary); font: 400 12px var(--font); letter-spacing: -.25px; }
.chart__line   { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--t-data) var(--ease-out) .1s forwards; }
.chart__pt     { fill: var(--card); stroke: var(--accent); stroke-width: 3; cursor: pointer; opacity: 0; transform-box: fill-box; transform-origin: center; animation: pt-in var(--t-base) var(--ease-out) forwards; animation-delay: calc(.3s + var(--i) * 110ms); transition: transform var(--t-base) var(--ease-out); }
.chart__pt:hover, .chart__pt.is-on { transform: scale(1.35); }
.chart__pt.bad { stroke: var(--negative); }
.chart__tip { position: absolute; pointer-events: none; padding: 8px 12px; border-radius: var(--r-l); background: var(--surface-dark); color: var(--text-on-dark); font: 600 12px/16px var(--font); white-space: nowrap; transform: translate(-50%, -120%); opacity: 0; transition: opacity var(--t-fast), left var(--t-base) var(--ease-out), top var(--t-base) var(--ease-out); }
.chart__tip.is-on { opacity: 1; }
.chart__tip span { display: block; font-weight: 400; opacity: .7; }
@keyframes draw    { to { stroke-dashoffset: 0; } }
@keyframes fade-in { to { opacity: 1; } }
@keyframes pt-in   { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
@keyframes slide-up   { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes slide-down { to { opacity: 0; transform: translateY(24px); } }
.app-header { position: sticky; top: 0; z-index: 20; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--card); }
.app-title  { margin-right: auto; font: 700 18px/1 var(--font); letter-spacing: -.3px; }

.donut-box { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }

.donut-wrap b { font: 600 24px/28px var(--font); }
.donut-wrap span { font: 400 12px/16px var(--font); color: var(--text-secondary); }
.donut-legend { display: grid; gap: 4px; min-width: 180px; }
.donut-legend div { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: var(--r-m); font: 400 14px/20px var(--font); cursor: pointer; transition: background var(--t-base); }
.donut-legend div:hover, .donut-legend div.is-on { background: var(--surface-1); }
.donut-legend i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.donut-legend em { margin-left: auto; font-style: normal; font-weight: 600; font-variant-numeric: tabular-nums; }
@keyframes seg-in { from { stroke-dasharray: 0 100; } }
.spark-card { padding: 14px 16px; border-radius: var(--r-xl); background: var(--surface-1); }
.spark-card__row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.spark { display: block; width: 100%; height: auto; margin-top: 8px; overflow: visible; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--t-data) var(--ease-out) forwards; }
.spark .up { stroke: var(--negative); }
.spark .dn { stroke: var(--positive); }
.spark circle { fill: var(--card); stroke: var(--accent); stroke-width: 1.6; opacity: 0; animation: pt-in var(--t-base) var(--ease-out) .8s forwards; transform-box: fill-box; transform-origin: center; }
.gtip { position: fixed; z-index: 70; pointer-events: none; padding: 8px 12px; border-radius: var(--r-l); background: var(--surface-dark); color: var(--on-surface-dark); font: 600 12px/16px var(--font); white-space: nowrap; transform: translate(-50%, -120%); opacity: 0; transition: opacity var(--t-fast); }
.gtip.is-on { opacity: 1; }
.gtip span { display: block; font-weight: 400; opacity: .7; }
.cal__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.cal__title { font: 600 18px/24px var(--font); min-width: 150px; text-align: center; }
.cal__nav { display: inline-flex; align-items: center; gap: 4px; }
.cal__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal__grid.to-next { animation: cal-next var(--t-slow) var(--ease-out) both; }
.cal__grid.to-prev { animation: cal-prev var(--t-slow) var(--ease-out) both; }
.cal__dow { padding: 6px 0; text-align: center; font: 600 12px/16px var(--font); color: var(--text-tertiary); }
.cal__day { position: relative; height: 48px; border: 0; border-radius: var(--r-l); background: transparent; color: var(--text-primary); font: 500 15px/20px var(--font); cursor: pointer; transition: background var(--t-base) var(--ease-std), color var(--t-base), transform var(--t-fast); }
.cal__day:hover { background: var(--surface-1); }
.cal__day:active { transform: scale(.92); }
.cal__day.is-out { color: var(--text-tertiary); }
.cal__day.is-today { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 700; }
.cal__day.is-sel { background: var(--accent); color: var(--text-on-dark); font-weight: 700; animation: pop-in var(--t-base) var(--ease-out); }
.cal__day.has-past { color: var(--text-secondary); }
.cal__dots { position: absolute; left: 50%; bottom: 5px; display: flex; gap: 3px; transform: translateX(-50%); }
.cal__dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: pt-in var(--t-base) var(--ease-out) both; }
.cal__dots i[data-k=&quot;lab&quot;] { background: var(--positive); }
.cal__dots i[data-k=&quot;med&quot;] { background: var(--warning); }
.cal__dots i[data-k=&quot;policy&quot;] { background: var(--accent-2); }

.cal__day.is-sel .cal__dots i { background: var(--text-on-dark); }
.cal-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; font: 400 12px/16px var(--font); color: var(--text-secondary); }
.cal-legend i { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--c); }
.cal-events { margin-top: 16px; display: grid; gap: 8px; }
.cal-ev { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px 10px 0; border-radius: var(--r-l); background: var(--surface-1); overflow: hidden; animation: fade-up var(--t-base) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 60ms); }
.cal-ev::before { content: ''; align-self: stretch; background: var(--c, var(--accent)); }
.cal-ev b { display: block; font: 600 15px/20px var(--font); }
.cal-ev span { font: 400 13px/18px var(--font); color: var(--text-secondary); }
.cal-events .empty { padding: 16px; }
@keyframes cal-next { from { opacity: 0; transform: translateX(24px); } }
@keyframes cal-prev { from { opacity: 0; transform: translateX(-24px); } }
.addcal { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 16px 20px; border-radius: var(--r-2xl); background: var(--surface-1); }
.addcal__date { width: 56px; padding: 6px 0; border-radius: var(--r-l); background: var(--card); text-align: center; flex: none; }
.addcal__date b { display: block; font: 700 22px/26px var(--font); }
.addcal__date span { font: 600 11px/14px var(--font); text-transform: uppercase; color: var(--text-negative); }
.addcal__info { flex: 1; min-width: 160px; }
.addcal__info b { display: block; font: 600 16px/22px var(--font); }
.addcal__info span { font: 400 13px/18px var(--font); color: var(--text-secondary); }
.cal-opt { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-radius: var(--r-xl); background: var(--surface-1); color: var(--text-primary); font: 600 15px/20px var(--font); text-align: left; cursor: pointer; transition: background var(--t-base), transform var(--t-fast); }
.cal-opt + .cal-opt { margin-top: 8px; }
.cal-opt:hover { background: var(--surface-2); }
.cal-opt:active { transform: scale(.98); }
.cal-opt small { display: block; font: 400 12px/16px var(--font); color: var(--text-secondary); }
.cal-opt__ic { width: 36px; height: 36px; border-radius: var(--r-l); background: var(--card); display: grid; place-items: center; font-size: 18px; flex: none; }
.modal--sm { max-width: 420px; }
.chart__ref { stroke: var(--text-tertiary); stroke-width: 1.5; stroke-dasharray: 6 5; animation: fade-in var(--t-slow) var(--ease-std) .9s both; }
.chart__ref--plan { fill: none; stroke: var(--text-tertiary); stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; animation: fade-in var(--t-slow) var(--ease-std) .6s both; }
.chart__ref-label { fill: var(--text-secondary); font: 600 11px var(--font); paint-order: stroke; stroke: var(--card); stroke-width: 4px; animation: fade-in var(--t-slow) var(--ease-std) 1s both; }
.spark line { stroke: var(--text-tertiary); stroke-width: 1; stroke-dasharray: 3 3; animation: fade-in var(--t-slow) var(--ease-std) .6s both; }
.sstack { width: 100%; max-width: 36px; display: flex; flex-direction: column-reverse; gap: 2px; transform-origin: bottom; animation: bar-up var(--t-data) var(--ease-out) both; animation-delay: calc(var(--i) * 60ms); transition: opacity var(--t-base); }
.sstack i { display: block; height: calc(140px * var(--h)); border-radius: 3px; background: var(--c); }
.sstack i:last-child { border-radius: 8px 8px 3px 3px; }
.bchart:hover .bchart__col:not(:hover) .sstack, .bchart:hover .bchart__col:not(:hover) .gbar { opacity: .4; }
.gbar { display: flex; align-items: flex-end; justify-content: center; gap: 3px; width: 100%; height: 100%; transition: opacity var(--t-base); }
.gbar i { width: 12px; max-width: 30%; height: calc(140px * var(--h)); border-radius: 4px 4px 2px 2px; background: var(--c); transform-origin: bottom; animation: bar-up var(--t-data) var(--ease-out) both; animation-delay: calc(var(--i) * 60ms + var(--j) * 80ms); }
.bchart__goal--c { border-top-color: var(--c); border-top-width: 1.5px; animation-delay: 1s; }
.bchart__goal--c span { left: 0; right: auto; color: var(--c); font-weight: 600; }
.macro-legend { display: flex; gap: 8px 16px; flex-wrap: wrap; margin-top: 12px; font: 400 12px/16px var(--font); color: var(--text-secondary); }
.macro-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; background: var(--c); vertical-align: -1px; }
.macro-legend .dash { display: inline-block; width: 16px; height: 0; margin-right: 6px; border-top: 2px dashed var(--c, var(--text-tertiary)); vertical-align: 3px; }
.hbar { display: grid; grid-template-columns: 84px 1fr 140px; gap: 12px; align-items: center; padding: 8px 0; font: 400 14px/20px var(--font); }
.hbar__val { text-align: right; font: 600 14px/20px var(--font); font-variant-numeric: tabular-nums; }
.hbar__val small { font-weight: 400; color: var(--text-secondary); }
.hbar__track { position: relative; height: 12px; border-radius: var(--r-pill); background: var(--surface-2); }
.hbar__fill { position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: inherit; background: var(--c); transform-origin: left; animation: grow var(--t-data) var(--ease-out) both; animation-delay: calc(var(--i) * 100ms); }
.hbar__mark { position: absolute; top: -5px; bottom: -5px; left: var(--m); width: 2px; border-radius: 1px; background: var(--text-primary); animation: fade-in var(--t-slow) 1s both; }
.save { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: var(--r-pill); font: 600 14px/20px var(--font); letter-spacing: -.3px; transition: background var(--t-base), color var(--t-base); }
.save--saving { background: var(--accent-soft); color: var(--text-accent); }
.save--done { background: var(--positive-soft); color: var(--text-positive); animation: pop-in var(--t-base) var(--ease-out); }
.save--error { background: var(--negative-soft); color: var(--text-negative); }
.save--wait { background: var(--warning-soft); color: var(--text-warning); }
.save small { font-weight: 400; opacity: .8; }
.save .link { color: inherit; }
.check { width: 20px; height: 20px; flex: none; }
.check circle, .check path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.check circle { stroke-width: 2; animation: draw .5s var(--ease-out) forwards; }
.check path { stroke-width: 2.4; animation: draw .35s var(--ease-out) .3s forwards; }
.check--lg { width: 56px; height: 56px; }
.indet { position: relative; height: 4px; border-radius: var(--r-pill); background: var(--accent-soft); overflow: hidden; }
.indet::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: var(--grad-accent); animation: indet 1.1s var(--ease-std) infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepi { display: flex; align-items: center; gap: 8px; font: 600 13px/18px var(--font); color: var(--text-tertiary); transition: color var(--t-base); }
.stepi__n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 700 12px/1 var(--font); transition: background var(--t-base), color var(--t-base); }
.stepi.is-now { color: var(--text-primary); }
.stepi.is-now .stepi__n { background: var(--accent); color: var(--text-on-dark); animation: pulse-ring 1.4s ease-out infinite; }
.stepi.is-done { color: var(--text-positive); }
.stepi.is-done .stepi__n { background: var(--positive); color: #fff; animation: pop-in var(--t-base) var(--ease-out); }
.stepper__line { flex: 0 0 24px; height: 2px; border-radius: 1px; background: var(--surface-2); transition: background var(--t-slow); }
.stepper__line.is-done { background: var(--positive); }
@keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(25,154,240,.5); } 100% { box-shadow: 0 0 0 8px rgba(25,154,240,0); } }
.btn.is-done { background: var(--positive); color: #fff; animation: pop-in var(--t-base) var(--ease-out); }
.saved-card { display: grid; justify-items: center; gap: 4px; padding: 24px 16px; border-radius: var(--r-2xl); background: var(--positive-soft); text-align: center; color: var(--text-positive); animation: pop-in var(--t-slow) var(--ease-out) both; }
.saved-card b { font: 600 18px/24px var(--font); color: var(--text-primary); }
.saved-card span { font: 400 13px/18px var(--font); color: var(--text-secondary); }
.saved-card[hidden] { display: none; }
.loader { display: grid; justify-items: center; align-content: center; gap: 14px; padding: 32px 16px; text-align: center; }
.loader__ring { position: relative; width: 1em; height: 1em; font-size: 48px; }
.loader--sm .loader__ring { font-size: 30px; }
.loader__ring i { position: absolute; left: 50%; top: 0; width: .09em; height: .26em; margin-left: -.045em; border-radius: .05em; background: var(--positive); transform-origin: 50% .5em; transform: rotate(calc(var(--n) * 30deg)); opacity: .15; animation: seg-chase 1.2s linear infinite; animation-delay: calc(var(--n) * -.1s); }
@keyframes seg-chase { 0% { opacity: 1; } 100% { opacity: .15; } }
.loader__title { margin: 0; font: 600 16px/22px var(--font); color: var(--text-primary); }
.loader__hint { margin: -8px 0 0; font: 400 13px/18px var(--font); color: var(--text-secondary); }
.loader--page { position: fixed; inset: 0; z-index: 100; background: var(--page); transition: opacity var(--t-slow); }
.loader--page.is-hidden { opacity: 0; pointer-events: none; }
.loader--block { position: absolute; inset: 0; z-index: 5; background: color-mix(in srgb, var(--card) 80%, transparent); border-radius: inherit; }
.loader-host { position: relative; }
.dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--positive); animation: dots 1.1s ease-in-out infinite; }
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%,80%,100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.15); } }
@media (prefers-reduced-motion: reduce) {
.loader__ring i { animation: none; opacity: .6; }
.dots span { animation: none; opacity: .6; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
/*КОМП-КОНЕЦ*/
/* состояния записи в формах — как .save из Компоненты.html: записывается / записано / сохранено на устройстве / не записалось */
.formlog&gt;div{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 14px;border-radius:var(--r-pill);width:fit-content;max-width:100%;font:600 14px/20px var(--font);background:var(--accent-soft);color:var(--text-accent)}
.formlog&gt;div:not(.ok):not(.er):not(.wa)::before{content:&quot;&quot;;width:16px;height:16px;flex:none;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.formlog&gt;div.ok{background:var(--positive-soft);color:var(--text-positive);animation:pop-in var(--t-base) var(--ease-out)}
.formlog&gt;div.er{background:var(--negative-soft);color:var(--text-negative)}
.formlog&gt;div.wa{background:var(--warning-soft);color:var(--text-warning)}
.mclose{border-radius:50%}
.mbox .ill__head{padding-right:44px}
.mbox&gt;h2,.mbox&gt;h3,.mbox&gt;.pill,.mbox&gt;.status{padding-right:40px}
#modal{display:none}
#modal.on{display:grid}
/* оболочка: шапка, поиск, нижняя панель (страница) */
.app-header{background:var(--card)}
.app-title{font:700 18px/24px var(--font);letter-spacing:-.3px;white-space:nowrap}
#q{flex:1 1 120px;min-width:100px;height:36px;padding:0 14px;border:0;border-radius:var(--r-l);background:var(--surface-1);font:inherit;font-size:14px;color:var(--text-primary)}
#q:focus{outline:0;box-shadow:0 0 0 2px var(--accent)}
nav.tabs{position:sticky;top:57px;z-index:19;border-bottom:0}
/* шапка и верхнее меню — в той же центральной колонке, что и содержимое (1120 px), а не у левого края широкого экрана */
.app-header{padding-left:max(16px,calc((100% - 1120px)/2 + 16px));padding-right:max(16px,calc((100% - 1120px)/2 + 16px))}
nav.tabs#nav{padding-left:max(16px,calc((100% - 1120px)/2 + 16px));padding-right:max(16px,calc((100% - 1120px)/2 + 16px))}
.subnav.tabs--scroll{background:none;padding:0 0 10px;margin:0}
.bottombar{display:none}
.verline{max-width:1120px;margin:0 auto;padding:0 16px 24px;font-size:12px;color:var(--text-secondary)}
#searchBtn{display:none}
.who-wrap{display:contents}#whoBtn{display:none}
@media (max-width:1100px){#addBtn b{display:none}#addBtn{padding:0 12px}}
@media (max-width:700px){
  /* меню на телефоне — сверху, внутри липкой шапки (Денис, 05.10.2026), а не у нижнего края */
  /* ТЗ-025 блок 2: пять кнопок — внизу экрана; пока курсор в поле ввода, панель спрятана (body.kb) */
  .bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;margin:0;padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--surface-2)}
  body.kb .bottombar{display:none}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  .bottombar button{flex:1 1 0;min-width:0;padding:6px 2px}
  main{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  .verline{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
  body.kb main,body.kb .verline{padding-bottom:16px}
  #addBtn{display:none}
  #q{order:10;flex:1 1 100%;display:none}
  .app-header.search-on #q{display:block}
  #searchBtn{display:inline-grid}
  /* ТЗ-025 блок 1: одна строка — название, имя ▾, поиск, аватар */
  .app-title{order:-2}
  .who-wrap{display:block;position:relative;order:-1}
  #whoBtn{display:inline-flex;align-items:center;height:36px;padding:0 12px;border:0;border-radius:var(--r-l);background:var(--surface-1);color:var(--text-primary);font:600 14px/18px var(--font);cursor:pointer}
  .who-wrap.single #whoBtn{cursor:default}
  .who-wrap #who{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;flex-direction:column;min-width:150px;padding:6px;background:var(--card);border-radius:var(--r-l);box-shadow:0 6px 24px rgba(0,0,0,.18)}
  .who-wrap.open #who{display:flex}
  .who-wrap #who button{text-align:left;padding:10px 12px}
  .app-header .pop-anchor{margin-left:auto}
  .phead--home{justify-content:flex-end;margin:0 0 4px}.phead--home h2{display:none}
}
@media print{.app-header,.bottombar,.drawer-overlay,nav.tabs{display:none!important}main,.verline{padding-bottom:0!important}}
/* верхняя полоса вкладок не показывается на телефоне (ТЗ-011 блок 3) */
@media (max-width:700px){ nav.tabs#nav{display:none} }
/* ── Новый дизайн (04.10.2026): токены и компоненты из Разработка/Дизайн. Слой поверх старых стилей:
   имена переменных прежние, значения — из токены.css; чёрная главная кнопка и активная вкладка, карточки 20px без рамок ── */
:root{
  --font:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#f3f5f7; --card:#fff; --ink:#101518; --muted:#5c7384; --line:#e7ebef;
  --ok:#137a26; --warn:#b84400; --bad:#d4122a; --none:#9db0be;
  --okbg:#e6f6e9; --warnbg:#fff0e5; --badbg:#ffe9ec; --nonebg:#eef1f4;
  --primary:#0f7fcc; --primary-hover:#0c6bb0; --on-accent:#fff;
  --accent:#0f7fcc; --accentbg:#e5f3fd; --seg:#e7ebef; --seghover:#dae1e7; --field:#f3f5f7;
  --radius:20px; --btn:#080a0c; --btn-hover:#29343d; --on-btn:#f6f8f9;
  --shadow:none; --shadow-md:0 4px 16px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.04); --shadow-lg:0 16px 32px -8px rgba(0,0,0,.24);

}

/*КОМП-НАЧАЛО*/
:root {
  /* ── Шрифт ── */
  --font: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* ── Текст ── */
  --text-primary:   #101518;
  --text-paragraph: #29343d;
  --text-secondary: #5c7384;
  --text-tertiary:  #9db0be;
  --text-accent:    #118cdf;
  --text-accent-2:  #ff1f78;
  --text-positive:  #1a9e32;
  --text-warning:   #fa5f05;
  --text-negative:  #ff293e;
  --text-on-dark:   #f6f8f9;

  /* ── Поверхности ── */
  --page:           #f3f5f7;   /* фон страницы */
  --card:           #ffffff;
  --surface-1:      #f3f5f7;   /* плитки внутри карточки, поля ввода */
  --surface-2:      #e7ebef;   /* вторичные кнопки, разделители */
  --surface-3:      #dae1e7;
  --surface-dark:   #080a0c;   /* чёрные кнопки и активная вкладка */
  --on-surface-dark:#f6f8f9;   /* текст на них */
  --accent:         #199af0;
  --accent-2:       #ff4791;
  --positive:       #1a9e32;
  --warning:        #fa5f05;
  --negative:       #ff293e;

  /* Мягкие фоны статусов (для плашек «норма / выше / ниже») */
  --positive-soft:  #e6f6e9;
  --warning-soft:   #fff0e5;
  --negative-soft:  #ffe9ec;
  --accent-soft:    #e5f3fd;

  /* ── Градиенты ── */
  --grad-accent: linear-gradient(75deg, #12c2f3, #2b8ced);
  --grad-pink:   linear-gradient(75deg, #fc95da, #ff1f78);
  /* фон шапки-«героя»: тёмно-синий → малиновый → розовый */
  --grad-hero:
    radial-gradient(60% 120% at 100% 100%, #ff4791 0%, transparent 60%),
    radial-gradient(50% 100% at 0% 100%, #1c2a8c 0%, transparent 60%),
    radial-gradient(40% 90% at 60% 0%, #d65bd9 0%, transparent 60%),
    linear-gradient(120deg, #2a2f8f, #b23fc4 55%, #ff6fa8);

  /* ── Радиусы ── */
  --r-xs: 6px;    /* мелкие метки */
  --r-s:  8px;    /* маленькая кнопка */
  --r-m:  10px;   /* обычная кнопка */
  --r-l:  12px;   /* поле, кнопка в шапке */
  --r-xl: 16px;   /* карточка-строка */
  --r-2xl: 20px;  /* карточка, плитка, окно */
  --r-pill: 9999px; /* вкладки, чипы */

  /* ── Тени: почти нет, только у всплывающих окон ── */
  --shadow-s: 0 4px 16px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
  --shadow-m: 0 20px 48px rgba(0,0,0,.08);
  --shadow-popup: 0 16px 32px -8px rgba(0,0,0,.24);

  /* ── Отступы (шаг 4) ── */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  /* ── Ширина контента ── */
  --content: 700px;   /* колонка карточек на сайте-образце */
  --content-wide: 1100px;

  /* ── Движение ── */
  --ease-out: cubic-bezier(.22,1,.36,1);     /* появление, «мягкая посадка» */
  --ease-std: cubic-bezier(.4,0,.2,1);       /* наведение, смена цвета */
  --t-fast: 120ms;   /* нажатие */
  --t-base: 200ms;   /* наведение, вкладки */
  --t-slow: 500ms;   /* появление блоков */
  --t-data: 800ms;   /* шкала показателя, счётчик */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=&quot;light&quot;]) {
    --text-primary:#f6f8f9; --text-paragraph:#ced7de; --text-secondary:#9db0be; --text-tertiary:#5c7384; --text-accent:#52baff; --text-positive:#24b23e; --text-warning:#fe7024; --text-negative:#ff3d51;
    --page:#101518; --card:#181f25; --surface-1:#212a31; --surface-2:#2b363f; --surface-3:#36434d;
    --surface-dark:#f6f8f9; --on-surface-dark:#101518;
    --positive-soft:#12331b; --warning-soft:#3a2410; --negative-soft:#3d1a1f; --accent-soft:#0f2d44;
    --shadow-popup: 0 16px 32px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme=&quot;dark&quot;] {
  --text-primary:#f6f8f9; --text-paragraph:#ced7de; --text-secondary:#9db0be; --text-tertiary:#5c7384; --text-accent:#52baff; --text-positive:#24b23e; --text-warning:#fe7024; --text-negative:#ff3d51;
  --page:#101518; --card:#181f25; --surface-1:#212a31; --surface-2:#2b363f; --surface-3:#36434d;
  --surface-dark:#f6f8f9; --on-surface-dark:#101518;
  --positive-soft:#12331b; --warning-soft:#3a2410; --negative-soft:#3d1a1f; --accent-soft:#0f2d44;
}


.t-h2  { font: 600 20px/26px var(--font); }
.t-h3  { font: 600 16px/22px var(--font); }
.t-text-m  { font: 400 16px/24px var(--font); letter-spacing: -.3px; }
.t-text-s  { font: 400 14px/20px var(--font); letter-spacing: -.3px; }
.t-text-xs { font: 400 12px/16px var(--font); letter-spacing: -.25px; }
.t-bold    { font-weight: 600; }
.t-muted   { color: var(--text-secondary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  height: 40px; padding: 0 16px; border: 0; cursor: pointer;
  font: 600 14px/18px var(--font); letter-spacing: -.3px;
  border-radius: var(--r-m); transition: filter var(--t-base) var(--ease-std), transform var(--t-fast) var(--ease-std);
  text-decoration: none;
}
.btn:hover { filter: brightness(.94); }
.btn:active { transform: scale(.96); }
.btn-primary   { background: var(--accent); color: var(--text-on-dark); }
.btn-secondary { background: var(--surface-2); color: var(--text-primary); }
.btn-lg        { height: 48px; font-size: 16px; line-height: 20px; border-radius: var(--r-l); }
.tabs { display: flex; gap: var(--sp-1); }
.tab {
  height: 28px; padding: 0 10px; border: 0; cursor: pointer; background: transparent;
  font: 600 12px/14px var(--font); letter-spacing: -.25px; color: var(--text-primary);
  border-radius: var(--r-pill);
  transition: background var(--t-base) var(--ease-std), color var(--t-base) var(--ease-std);
}
.tab:hover:not([aria-selected=&quot;true&quot;]) { background: var(--surface-2); }
.tab[aria-selected=&quot;true&quot;], .tab.is-active { background: var(--surface-dark); color: var(--on-surface-dark); }
.lockbox,
.popup { background: var(--card); border-radius: var(--r-2xl); padding: var(--sp-6); box-shadow: var(--shadow-popup); animation: pop-in var(--t-base) var(--ease-out) both; }
.status { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-pill); font: 600 12px/14px var(--font); letter-spacing: -.25px; }
.status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.status-ok   { color: var(--text-positive); background: var(--positive-soft); }
.status-warn { color: var(--text-warning);  background: var(--warning-soft); }
.status-bad  { color: var(--text-negative); background: var(--negative-soft); }
.status-info { color: var(--text-accent);   background: var(--accent-soft); }
@keyframes fade-up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes pop-in  { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes grow    { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes dot-in  { from { left: 0; opacity: 0; } 30% { opacity: 1; } to { left: var(--pos, 50%); opacity: 1; } }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 currentColor; } 50% { box-shadow: 0 0 0 4px transparent; } }
.reveal { animation: fade-up var(--t-slow) var(--ease-out) both; animation-delay: calc(var(--i, 0) * 70ms); }
.skeleton { border-radius: var(--r-l); background: linear-gradient(90deg, var(--surface-1) 30%, var(--surface-2) 50%, var(--surface-1) 70%) 0 0 / 200% 100%; animation: shimmer 1.4s linear infinite; }
.status-bad::before { animation: pulse-dot 2s ease-out infinite; }
.chart { position: relative; }
.chart { max-width: 620px; }   /* на широком экране график не растягивается — надписи остаются обычного размера */
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart__grid   { stroke: var(--surface-2); stroke-width: 1; }
.chart__band   { fill: var(--positive); opacity: .12; }
.chart__label  { fill: var(--text-secondary); font: 400 12px var(--font); letter-spacing: -.25px; }
.chart__line   { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw var(--t-data) var(--ease-out) .1s forwards; }
.chart__pt     { fill: var(--card); stroke: var(--accent); stroke-width: 3; cursor: pointer; opacity: 0; transform-box: fill-box; transform-origin: center; animation: pt-in var(--t-base) var(--ease-out) forwards; animation-delay: calc(.3s + var(--i) * 110ms); transition: transform var(--t-base) var(--ease-out); }
.chart__pt:hover, .chart__pt.is-on { transform: scale(1.35); }
.chart__pt.bad { stroke: var(--negative); }
.chart__tip { position: absolute; pointer-events: none; padding: 8px 12px; border-radius: var(--r-l); background: var(--surface-dark); color: var(--text-on-dark); font: 600 12px/16px var(--font); white-space: nowrap; transform: translate(-50%, -120%); opacity: 0; transition: opacity var(--t-fast), left var(--t-base) var(--ease-out), top var(--t-base) var(--ease-out); }
.chart__tip.is-on { opacity: 1; }
.chart__tip span { display: block; font-weight: 400; opacity: .7; }
@keyframes draw    { to { stroke-dashoffset: 0; } }
@keyframes fade-in { to { opacity: 1; } }
@keyframes pt-in   { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
@keyframes slide-up   { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes slide-down { to { opacity: 0; transform: translateY(24px); } }
.app-header { position: sticky; top: 0; z-index: 20; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px; background: var(--card); }
.app-title  { margin-right: auto; font: 700 18px/1 var(--font); letter-spacing: -.3px; }
.seg { display: inline-flex; gap: 4px; padding: 3px; background: var(--surface-1); border-radius: var(--r-l); }
.seg button { border: 0; background: transparent; color: var(--text-secondary); padding: 6px 14px; border-radius: var(--r-m); font: 600 14px/18px var(--font); letter-spacing: -.3px; cursor: pointer; transition: background var(--t-base) var(--ease-std), color var(--t-base) var(--ease-std), box-shadow var(--t-base); }
.seg button:hover:not(.is-active) { color: var(--text-primary); }
.seg button.is-active { background: var(--card); color: var(--text-primary); box-shadow: var(--shadow-s); }
.tabs--scroll { overflow-x: auto; padding: 8px 16px; background: var(--card); scrollbar-width: none; }
.tabs--scroll::-webkit-scrollbar { display: none; }
.tabs--scroll .tab { flex: none; height: 32px; padding: 0 14px; font-size: 14px; line-height: 18px; }
.mclose,
.icon-btn { width: 32px; height: 32px; border: 0; border-radius: var(--r-m); background: var(--surface-1); color: var(--text-primary); font-size: 15px; cursor: pointer; display: inline-grid; place-items: center; transition: background var(--t-base), transform var(--t-fast); }
.mclose:hover:not(:disabled),
.icon-btn:hover:not(:disabled) { background: var(--surface-2); }
.mclose:active:not(:disabled),
.icon-btn:active:not(:disabled) { transform: scale(.92); }
.mclose:disabled,
.icon-btn:disabled { opacity: .35; cursor: default; }
.icon-btn--round { border-radius: 50%; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.weeknav { display: inline-flex; align-items: center; gap: 8px; font: 400 13px/18px var(--font); color: var(--text-secondary); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.kpi { background: var(--surface-1); border-radius: var(--r-xl); padding: 14px 16px; transition: transform var(--t-base) var(--ease-out), background var(--t-base); }
.kpi.is-link { cursor: pointer; }
.kpi.is-link:hover { transform: translateY(-2px); background: var(--surface-2); }
.kpi.is-link:active { transform: scale(.98); }
.kpi__lab { font: 400 12px/16px var(--font); color: var(--text-secondary); letter-spacing: -.25px; }
.kpi__val { margin-top: 4px; font: 600 24px/28px var(--font); overflow-wrap: anywhere; }
.kpi__sub { margin-top: 2px; font: 400 12px/16px var(--font); color: var(--text-secondary); }
.kpi--ok   { background: var(--positive-soft); }
.kpi--ok   .kpi__val { color: var(--text-positive); }
.kpi--warn { background: var(--warning-soft); }
.kpi--warn .kpi__val { color: var(--text-warning); }
.kpi--bad  { background: var(--negative-soft); }
.kpi--bad  .kpi__val { color: var(--text-negative); }
.kpi--none .kpi__val { color: var(--text-tertiary); }
.trend { font: 600 12px/16px var(--font); }
.trend.up { color: var(--text-negative); }
.trend.dn { color: var(--text-positive); }
.tag  { display: inline-block; padding: 2px 8px; border-radius: var(--r-xs); background: var(--accent-soft); color: var(--text-accent); font: 400 12px/16px var(--font); }
.tag--gray { background: var(--surface-2); color: var(--text-secondary); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); background: var(--surface-1); color: var(--text-secondary); font: 500 12px/14px var(--font); }
.chip--main { background: var(--accent-soft); color: var(--text-primary); }
.red-dot { color: var(--text-negative); font-weight: 700; }
.pend { color: var(--text-warning); font-size: 11px; vertical-align: 2px; }
.status-none { color: var(--text-secondary); background: var(--surface-2); }
.tbl-wrap, .tw { overflow-x: auto; max-width: 100%; }
.tbl { width: 100%; border-collapse: collapse; font: 400 14px/20px var(--font); letter-spacing: -.3px; }
.tbl th { text-align: left; padding: 8px 12px; font: 600 12px/16px var(--font); color: var(--text-secondary); border-bottom: 1px solid var(--surface-2); white-space: nowrap; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--surface-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.is-link { cursor: pointer; }
.tbl tr.is-link td { transition: background var(--t-base); }
.tbl tr.is-link:hover td { background: var(--surface-1); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.tbl .none { color: var(--text-tertiary); }

.macro-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; background: var(--c); vertical-align: -1px; }
.macro-legend .dash { display: inline-block; width: 16px; height: 0; margin-right: 6px; border-top: 2px dashed var(--c, var(--text-tertiary)); vertical-align: 3px; }
.hbar { display: grid; grid-template-columns: 84px 1fr 140px; gap: 12px; align-items: center; padding: 8px 0; font: 400 14px/20px var(--font); }
.hbar__val { text-align: right; font: 600 14px/20px var(--font); font-variant-numeric: tabular-nums; }
.hbar__val small { font-weight: 400; color: var(--text-secondary); }
.hbar__track { position: relative; height: 12px; border-radius: var(--r-pill); background: var(--surface-2); }
.hbar__fill { position: absolute; inset: 0 auto 0 0; width: var(--w); border-radius: inherit; background: var(--c); transform-origin: left; animation: grow var(--t-data) var(--ease-out) both; animation-delay: calc(var(--i) * 100ms); }
.hbar__mark { position: absolute; top: -5px; bottom: -5px; left: var(--m); width: 2px; border-radius: 1px; background: var(--text-primary); animation: fade-in var(--t-slow) 1s both; }
.save { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: var(--r-pill); font: 600 14px/20px var(--font); letter-spacing: -.3px; transition: background var(--t-base), color var(--t-base); }
.save--saving { background: var(--accent-soft); color: var(--text-accent); }
.save--done { background: var(--positive-soft); color: var(--text-positive); animation: pop-in var(--t-base) var(--ease-out); }
.save--error { background: var(--negative-soft); color: var(--text-negative); }
.save--wait { background: var(--warning-soft); color: var(--text-warning); }
.save small { font-weight: 400; opacity: .8; }
.save .link { color: inherit; }
.check { width: 20px; height: 20px; flex: none; }
.check circle, .check path { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.check circle { stroke-width: 2; animation: draw .5s var(--ease-out) forwards; }
.check path { stroke-width: 2.4; animation: draw .35s var(--ease-out) .3s forwards; }
.check--lg { width: 56px; height: 56px; }
.indet { position: relative; height: 4px; border-radius: var(--r-pill); background: var(--accent-soft); overflow: hidden; }
.indet::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: var(--grad-accent); animation: indet 1.1s var(--ease-std) infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepi { display: flex; align-items: center; gap: 8px; font: 600 13px/18px var(--font); color: var(--text-tertiary); transition: color var(--t-base); }
.stepi__n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 700 12px/1 var(--font); transition: background var(--t-base), color var(--t-base); }
.stepi.is-now { color: var(--text-primary); }
.stepi.is-now .stepi__n { background: var(--accent); color: var(--text-on-dark); animation: pulse-ring 1.4s ease-out infinite; }
.stepi.is-done { color: var(--text-positive); }
.stepi.is-done .stepi__n { background: var(--positive); color: #fff; animation: pop-in var(--t-base) var(--ease-out); }
.stepper__line { flex: 0 0 24px; height: 2px; border-radius: 1px; background: var(--surface-2); transition: background var(--t-slow); }
.stepper__line.is-done { background: var(--positive); }
@keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(25,154,240,.5); } 100% { box-shadow: 0 0 0 8px rgba(25,154,240,0); } }
.btn.is-done { background: var(--positive); color: #fff; animation: pop-in var(--t-base) var(--ease-out); }
.saved-card { display: grid; justify-items: center; gap: 4px; padding: 24px 16px; border-radius: var(--r-2xl); background: var(--positive-soft); text-align: center; color: var(--text-positive); animation: pop-in var(--t-slow) var(--ease-out) both; }
.saved-card b { font: 600 18px/24px var(--font); color: var(--text-primary); }
.saved-card span { font: 400 13px/18px var(--font); color: var(--text-secondary); }
.saved-card[hidden] { display: none; }
.loader { display: grid; justify-items: center; align-content: center; gap: 14px; padding: 32px 16px; text-align: center; }
.loader__ring { position: relative; width: 1em; height: 1em; font-size: 48px; }
.loader--sm .loader__ring { font-size: 30px; }
.loader__ring i { position: absolute; left: 50%; top: 0; width: .09em; height: .26em; margin-left: -.045em; border-radius: .05em; background: var(--positive); transform-origin: 50% .5em; transform: rotate(calc(var(--n) * 30deg)); opacity: .15; animation: seg-chase 1.2s linear infinite; animation-delay: calc(var(--n) * -.1s); }
@keyframes seg-chase { 0% { opacity: 1; } 100% { opacity: .15; } }
.loader__title { margin: 0; font: 600 16px/22px var(--font); color: var(--text-primary); }
.loader__hint { margin: -8px 0 0; font: 400 13px/18px var(--font); color: var(--text-secondary); }
.loader--page { position: fixed; inset: 0; z-index: 100; background: var(--page); transition: opacity var(--t-slow); }
.loader--page.is-hidden { opacity: 0; pointer-events: none; }
.loader--block { position: absolute; inset: 0; z-index: 5; background: color-mix(in srgb, var(--card) 80%, transparent); border-radius: inherit; }
.loader-host { position: relative; }
.dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--positive); animation: dots 1.1s ease-in-out infinite; }
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%,80%,100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.15); } }
@media (prefers-reduced-motion: reduce) {
.loader__ring i { animation: none; opacity: .6; }
.dots span { animation: none; opacity: .6; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* состояния записи в формах — как .save из Компоненты.html: записывается / записано / сохранено на устройстве / не записалось */

.formlog&gt;div.ok{background:var(--positive-soft);color:var(--text-positive);animation:pop-in var(--t-base) var(--ease-out)}

  /* меню на телефоне — сверху, внутри липкой шапки (Денис, 05.10.2026), а не у нижнего края */

/* ── Новый дизайн (04.10.2026): токены и компоненты из Разработка/Дизайн. Слой поверх старых стилей:
   имена переменных прежние, значения — из токены.css; чёрная главная кнопка и активная вкладка, карточки 20px без рамок ── */
:root{
  --font:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#f3f5f7; --card:#fff; --ink:#101518; --muted:#5c7384; --line:#e7ebef;
  --ok:#137a26; --warn:#b84400; --bad:#d4122a; --none:#9db0be;
  --okbg:#e6f6e9; --warnbg:#fff0e5; --badbg:#ffe9ec; --nonebg:#eef1f4;
  --primary:#0f7fcc; --primary-hover:#0c6bb0; --on-accent:#fff;
  --accent:#0f7fcc; --accentbg:#e5f3fd; --seg:#e7ebef; --seghover:#dae1e7; --field:#f3f5f7;
  --radius:20px; --btn:#080a0c; --btn-hover:#29343d; --on-btn:#f6f8f9;
  --shadow:none; --shadow-md:0 4px 16px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.04); --shadow-lg:0 16px 32px -8px rgba(0,0,0,.24);
  --grad-hero:radial-gradient(60% 120% at 100% 100%,#ff4791 0%,transparent 60%),radial-gradient(50% 100% at 0% 100%,#1c2a8c 0%,transparent 60%),radial-gradient(40% 90% at 60% 0%,#d65bd9 0%,transparent 60%),linear-gradient(120deg,#2a2f8f,#b23fc4 55%,#ff6fa8);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=&quot;light&quot;]){--bg:#101518;--card:#181f25;--ink:#f6f8f9;--muted:#9db0be;--line:#2b363f;
    --ok:#4cd964;--warn:#fe8a4a;--bad:#ff6b7a;--none:#5c7384;
    --okbg:#12331b;--warnbg:#3a2410;--badbg:#3d1a1f;--nonebg:#212a31;
    --primary:#52baff;--primary-hover:#8ad2ff;--on-accent:#101518;--accent:#52baff;--accentbg:#0f2d44;--seg:#212a31;--seghover:#2b363f;--field:#212a31;
    --btn:#f6f8f9;--btn-hover:#dae1e7;--on-btn:#101518;--shadow-md:0 4px 16px rgba(0,0,0,.5);}
}
:root[data-theme=&quot;dark&quot;]{--bg:#101518;--card:#181f25;--ink:#f6f8f9;--muted:#9db0be;--line:#2b363f;
    --ok:#4cd964;--warn:#fe8a4a;--bad:#ff6b7a;--none:#5c7384;
    --okbg:#12331b;--warnbg:#3a2410;--badbg:#3d1a1f;--nonebg:#212a31;
    --primary:#52baff;--primary-hover:#8ad2ff;--on-accent:#101518;--accent:#52baff;--accentbg:#0f2d44;--seg:#212a31;--seghover:#2b363f;--field:#212a31;
    --btn:#f6f8f9;--btn-hover:#dae1e7;--on-btn:#101518;--shadow-md:0 4px 16px rgba(0,0,0,.5);}

/*КОМП-НАЧАЛО*/
:root {
  /* ── Шрифт ── */
  --font: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* ── Текст ── */
  --text-primary:   #101518;
  --text-paragraph: #29343d;
  --text-secondary: #5c7384;
  --text-tertiary:  #9db0be;
  --text-accent:    #118cdf;
  --text-accent-2:  #ff1f78;
  --text-positive:  #1a9e32;
  --text-warning:   #fa5f05;
  --text-negative:  #ff293e;
  --text-on-dark:   #f6f8f9;

  /* ── Поверхности ── */
  --page:           #f3f5f7;   /* фон страницы */
  --card:           #ffffff;
  --surface-1:      #f3f5f7;   /* плитки внутри карточки, поля ввода */
  --surface-2:      #e7ebef;   /* вторичные кнопки, разделители */
  --surface-3:      #dae1e7;
  --surface-dark:   #080a0c;   /* чёрные кнопки и активная вкладка */
  --on-surface-dark:#f6f8f9;   /* текст на них */
  --accent:         #199af0;
  --accent-2:       #ff4791;
  --positive:       #1a9e32;
  --warning:        #fa5f05;
  --negative:       #ff293e;

  /* Мягкие фоны статусов (для плашек «норма / выше / ниже») */
  --positive-soft:  #e6f6e9;
  --warning-soft:   #fff0e5;
  --negative-soft:  #ffe9ec;
  --accent-soft:    #e5f3fd;

  /* ── Градиенты ── */
  --grad-accent: linear-gradient(75deg, #12c2f3, #2b8ced);
  --grad-pink:   linear-gradient(75deg, #fc95da, #ff1f78);
  /* фон шапки-«героя»: тёмно-синий → малиновый → розовый */
  --grad-hero:
    radial-gradient(60% 120% at 100% 100%, #ff4791 0%, transparent 60%),
    radial-gradient(50% 100% at 0% 100%, #1c2a8c 0%, transparent 60%),
    radial-gradient(40% 90% at 60% 0%, #d65bd9 0%, transparent 60%),
    linear-gradient(120deg, #2a2f8f, #b23fc4 55%, #ff6fa8);

  /* ── Радиусы ── */
  --r-xs: 6px;    /* мелкие метки */
  --r-s:  8px;    /* маленькая кнопка */
  --r-m:  10px;   /* обычная кнопка */
  --r-l:  12px;   /* поле, кнопка в шапке */
  --r-xl: 16px;   /* карточка-строка */
  --r-2xl: 20px;  /* карточка, плитка, окно */
  --r-pill: 9999px; /* вкладки, чипы */

  /* ── Тени: почти нет, только у всплывающих окон ── */
  --shadow-s: 0 4px 16px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
  --shadow-m: 0 20px 48px rgba(0,0,0,.08);
  --shadow-popup: 0 16px 32px -8px rgba(0,0,0,.24);

  /* ── Отступы (шаг 4) ── */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  /* ── Ширина контента ── */
  --content: 700px;   /* колонка карточек на сайте-образце */
  --content-wide: 1100px;

  /* ── Движение ── */
  --ease-out: cubic-bezier(.22,1,.36,1);     /* появление, «мягкая посадка» */
  --ease-std: cubic-bezier(.4,0,.2,1);       /* наведение, смена цвета */
  --t-fast: 120ms;   /* нажатие */
  --t-base: 200ms;   /* наведение, вкладки */
  --t-slow: 500ms;   /* появление блоков */
  --t-data: 800ms;   /* шкала показателя, счётчик */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=&quot;light&quot;]) {
    --text-primary:#f6f8f9; --text-paragraph:#ced7de; --text-secondary:#9db0be; --text-tertiary:#5c7384; --text-accent:#52baff; --text-positive:#24b23e; --text-warning:#fe7024; --text-negative:#ff3d51;
    --page:#101518; --card:#181f25; --surface-1:#212a31; --surface-2:#2b363f; --surface-3:#36434d;
    --surface-dark:#f6f8f9; --on-surface-dark:#101518;
    --positive-soft:#12331b; --warning-soft:#3a2410; --negative-soft:#3d1a1f; --accent-soft:#0f2d44;
    --shadow-popup: 0 16px 32px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme=&quot;dark&quot;] {
  --text-primary:#f6f8f9; --text-paragraph:#ced7de; --text-secondary:#9db0be; --text-tertiary:#5c7384; --text-accent:#52baff; --text-positive:#24b23e; --text-warning:#fe7024; --text-negative:#ff3d51;
  --page:#101518; --card:#181f25; --surface-1:#212a31; --surface-2:#2b363f; --surface-3:#36434d;
  --surface-dark:#f6f8f9; --on-surface-dark:#101518;
  --positive-soft:#12331b; --warning-soft:#3a2410; --negative-soft:#3d1a1f; --accent-soft:#0f2d44;
}

.sstack { width: 100%; max-width: 36px; display: flex; flex-direction: column-reverse; gap: 2px; transform-origin: bottom; animation: bar-up var(--t-data) var(--ease-out) both; animation-delay: calc(var(--i) * 60ms); transition: opacity var(--t-base); }

.btn.is-done { background: var(--positive); color: #fff; animation: pop-in var(--t-base) var(--ease-out); }

.saved-card[hidden] { display: none; }
.loader { display: grid; justify-items: center; align-content: center; gap: 14px; padding: 32px 16px; text-align: center; }
.loader__ring { position: relative; width: 1em; height: 1em; font-size: 48px; }

.loader__ring i { position: absolute; left: 50%; top: 0; width: .09em; height: .26em; margin-left: -.045em; border-radius: .05em; background: var(--positive); transform-origin: 50% .5em; transform: rotate(calc(var(--n) * 30deg)); opacity: .15; animation: seg-chase 1.2s linear infinite; animation-delay: calc(var(--n) * -.1s); }
@keyframes seg-chase { 0% { opacity: 1; } 100% { opacity: .15; } }
.loader__title { margin: 0; font: 600 16px/22px var(--font); color: var(--text-primary); }
.loader__hint { margin: -8px 0 0; font: 400 13px/18px var(--font); color: var(--text-secondary); }
.loader--page { position: fixed; inset: 0; z-index: 100; background: var(--page); transition: opacity var(--t-slow); }

.loader-host { position: relative; }
.dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--positive); animation: dots 1.1s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
.loader__ring i { animation: none; opacity: .6; }
.dots span { animation: none; opacity: .6; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* оболочка: шапка, поиск, нижняя панель (страница) */

  /* меню на телефоне — сверху, внутри липкой шапки (Денис, 05.10.2026), а не у нижнего края */

  .app-title{order:-2}

@media print{.app-header,.bottombar,.drawer-overlay,nav.tabs{display:none!important}main,.verline{padding-bottom:0!important}}

/* ── Новый дизайн (04.10.2026): токены и компоненты из Разработка/Дизайн. Слой поверх старых стилей:
   имена переменных прежние, значения — из токены.css; чёрная главная кнопка и активная вкладка, карточки 20px без рамок ── */
:root{
  --font:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#f3f5f7; --card:#fff; --ink:#101518; --muted:#5c7384; --line:#e7ebef;
  --ok:#137a26; --warn:#b84400; --bad:#d4122a; --none:#9db0be;
  --okbg:#e6f6e9; --warnbg:#fff0e5; --badbg:#ffe9ec; --nonebg:#eef1f4;
  --primary:#0f7fcc; --primary-hover:#0c6bb0; --on-accent:#fff;
  --accent:#0f7fcc; --accentbg:#e5f3fd; --seg:#e7ebef; --seghover:#dae1e7; --field:#f3f5f7;
  --radius:20px; --btn:#080a0c; --btn-hover:#29343d; --on-btn:#f6f8f9;
  --shadow:none; --shadow-md:0 4px 16px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.04); --shadow-lg:0 16px 32px -8px rgba(0,0,0,.24);
  --grad-hero:radial-gradient(60% 120% at 100% 100%,#ff4791 0%,transparent 60%),radial-gradient(50% 100% at 0% 100%,#1c2a8c 0%,transparent 60%),radial-gradient(40% 90% at 60% 0%,#d65bd9 0%,transparent 60%),linear-gradient(120deg,#2a2f8f,#b23fc4 55%,#ff6fa8);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=&quot;light&quot;]){--bg:#101518;--card:#181f25;--ink:#f6f8f9;--muted:#9db0be;--line:#2b363f;
    --ok:#4cd964;--warn:#fe8a4a;--bad:#ff6b7a;--none:#5c7384;
    --okbg:#12331b;--warnbg:#3a2410;--badbg:#3d1a1f;--nonebg:#212a31;
    --primary:#52baff;--primary-hover:#8ad2ff;--on-accent:#101518;--accent:#52baff;--accentbg:#0f2d44;--seg:#212a31;--seghover:#2b363f;--field:#212a31;
    --btn:#f6f8f9;--btn-hover:#dae1e7;--on-btn:#101518;--shadow-md:0 4px 16px rgba(0,0,0,.5);}
}
:root[data-theme=&quot;dark&quot;]{--bg:#101518;--card:#181f25;--ink:#f6f8f9;--muted:#9db0be;--line:#2b363f;
    --ok:#4cd964;--warn:#fe8a4a;--bad:#ff6b7a;--none:#5c7384;
    --okbg:#12331b;--warnbg:#3a2410;--badbg:#3d1a1f;--nonebg:#212a31;
    --primary:#52baff;--primary-hover:#8ad2ff;--on-accent:#101518;--accent:#52baff;--accentbg:#0f2d44;--seg:#212a31;--seghover:#2b363f;--field:#212a31;
    --btn:#f6f8f9;--btn-hover:#dae1e7;--on-btn:#101518;--shadow-md:0 4px 16px rgba(0,0,0,.5);}
body{font-family:var(--font);letter-spacing:-.2px;-webkit-font-smoothing:antialiased}

main{padding-top:16px}
.card,details.card{border:0;border-radius:20px;padding:20px;box-shadow:none}

/* поле даты вне форм — как остальные поля сайта, не системное (11.10.2026) */
input[type=date]:not(.input){height:40px;min-width:150px;padding:0 12px;border:0;border-radius:var(--r-l);background:var(--surface-1);color:var(--text-primary);font:400 15px/20px var(--font);letter-spacing:-.2px;outline:0;transition:box-shadow var(--t-base) var(--ease-std)}

.nvrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nvrow .btn{height:40px;font-size:14px}
/* страница задачи: что сделать — сверху, обоснование — свёрнуто */
.taskh{margin:6px 0 0;font:600 22px/28px var(--font);letter-spacing:-.3px;text-transform:none;color:var(--ink)}

.taskurgent{margin-top:12px;padding:10px 12px;border-radius:var(--r-l);background:var(--negative-soft);font:400 14px/20px var(--font);color:var(--text-primary)}.taskurgent b{color:var(--text-negative)}
.taskact{margin-top:16px;gap:8px;align-items:center;flex-wrap:wrap}

.taskwhy summary::after{content:&quot;+&quot;;margin-left:auto;color:var(--muted);font-size:22px;line-height:22px}

.plan-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* строка «Плана здоровья» — компонент «Добавить в календарь» из каталога (Разработка/Дизайн), 11.10.2026 */
.addcal.plan-row{padding:12px 14px;gap:12px;cursor:pointer;background:var(--surface-1);align-items:center}
.addcal.plan-row .addcal__date{width:62px;min-height:58px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.addcal.plan-row .addcal__date span{font:600 11px/14px var(--font);letter-spacing:.04em;color:var(--text-negative);text-transform:uppercase}
.addcal.plan-row .addcal__date b.addcal__w{font:700 13px/16px var(--font);letter-spacing:-.2px;overflow-wrap:anywhere;text-align:center}
.addcal.plan-row .addcal__info{min-width:0;flex:1 1 200px}

.addcal.plan-row .plan-line1 .plan-chip--ok{background:var(--positive-soft);color:var(--text-positive)}
.addcal.plan-row .plan-line1 .plan-chip--acc{background:var(--accent-soft);color:var(--text-accent)}
.addcal.plan-row .plan-line1 .plan-chip--none{background:var(--surface-2);color:var(--text-secondary)}
.addcal.plan-row .addcal__info b.plan-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font:600 16px/22px var(--font);white-space:normal;overflow:hidden;overflow-wrap:anywhere;min-width:0;flex:1}
.addcal.plan-row .addcal__nd{color:var(--text-secondary);font-weight:600}
.addcal.plan-row .plan-stline{margin-top:2px;font:600 13px/18px var(--font)}.addcal.plan-row .plan-stline .plan-st{color:var(--text-secondary)}.plan-overdue .plan-stline .plan-st{color:var(--bad)}
.addcal.plan-row .plan-sub{margin-top:2px;font:400 13px/18px var(--font);color:var(--text-secondary);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;white-space:normal}
.addcal.plan-row .plan-cal{flex:none;margin-left:auto;position:relative}
.addcal.plan-row .plan-go{margin-left:auto}

.addcal.plan-row .plan-no{margin:4px 0 0;font:500 13px/18px var(--font);color:var(--text-secondary);text-decoration:underline;min-height:24px}
.plan-list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
/* телефон: название в две строки, календарь — кнопка-иконка 44×44 справа (Денис 25.10.2026) */
.addcal.plan-row .plan-done{flex:none;min-height:44px;min-width:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px}

.avatar .ic{width:60%;height:60%}
/* ── Дневники здоровья (ТЗ-032) ── */
.dz-h1{font:600 20px/26px var(--font);margin:0}
.dz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}

@media (min-width:900px){.dz-grid{grid-template-columns:1fr 1fr}}
.dz-card{position:relative;display:block;width:100%;text-align:left;min-height:112px;padding:16px;border:0;border-radius:var(--r-2xl);background:var(--card);color:var(--text-primary);cursor:pointer;font:inherit}
.dz-card.is-off{opacity:.6}
.dz-card__t{display:block;padding-right:40px;font:600 16px/22px var(--font)} .dz-card__h{display:block;margin-top:4px;font:400 14px/20px var(--font);color:var(--text-secondary)}
.dz-card__pv{display:flex;gap:8px;margin-top:12px} .dz-card__pv i{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--surface-2);color:var(--text-secondary)} .dz-card__pv .ic{width:22px;height:22px} .dz-card.is-on .dz-card__pv i{background:var(--accent-soft);color:var(--text-accent)}
.dz-card__sel{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:#fff}
.dz-card.is-on .dz-card__sel{background:var(--accent)} .dz-card__sel .ic{width:16px;height:16px}
.dz-card:focus-visible,.dz-chip:focus-visible,.dz-tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.dz-nav:disabled{opacity:.4;cursor:default} .dz-nav:focus-visible,.dz-add:focus-visible,.dz-smile:focus-visible,.dz-sec__h:focus-visible,.dz-del:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dz-sec__h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0;margin:0 0 12px;border:0;background:none;color:var(--text-primary);cursor:pointer;text-align:left;min-height:44px}
.dz-sec__h h3{margin:0;font:600 20px/26px var(--font)}
.dz-c{background:var(--card);border-radius:var(--r-2xl);padding:16px;margin:0 0 12px}
.dz-c__h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px} .dz-c__h h4{margin:0;font:600 16px/22px var(--font);display:flex;align-items:center;gap:6px} .dz-c__h h4 .ic{width:20px;height:20px;color:var(--text-accent)}
.dz-time{font:400 14px/20px var(--font);color:var(--text-secondary);flex:none}
.dz-big{display:flex;align-items:baseline;gap:6px;margin:4px 0 8px} .dz-big b{font:600 32px/36px var(--font);letter-spacing:-.7px} .dz-big span{font:400 16px/24px var(--font);color:var(--text-secondary)}
.dz-trend{margin:0 0 12px} .dz-trend::before{display:none} .dz-trend .ic{width:16px;height:16px;margin-right:4px}
.dz-spark{display:block;width:100%;height:56px;margin-top:4px} .dz-spark__l{display:flex;justify-content:space-between;font:400 12px/16px var(--font);color:var(--text-secondary);margin:2px 0 12px}
.dz-none{margin:0 0 12px;color:var(--text-secondary);font:400 14px/20px var(--font)}
.dz-add{display:block;width:100%;min-height:48px;border:0;border-radius:var(--r-l);background:var(--accent-soft);color:var(--text-accent);font:600 14px/18px var(--font);cursor:pointer}
.dz-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--surface-2)} .dz-item:first-of-type{border-top:0}
.dz-item__t{flex:1;font:400 14px/20px var(--font);min-width:0;overflow-wrap:anywhere} .dz-del{flex:none;width:44px;height:44px;margin:-10px -8px -10px 0;border:0;background:none;color:var(--text-secondary);display:grid;place-items:center;cursor:pointer}

.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.chgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:6px}
.chg{border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column}
.chg span{font-size:12.5px}

.mt{border:1px solid var(--line);border-left-width:4px;border-radius:8px;padding:8px 10px}

.mt-h{font-size:11px;color:var(--muted);line-height:1.35}
.diaryframe{display:block;width:100%;height:calc(100vh - 150px);min-height:560px;border:0;border-radius:12px;background:var(--bg)}
.wbox{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin:8px 0}
.wbox input{width:104px;height:44px;padding:0 12px}
.wbox label span{font:600 13px/18px var(--font)!important;color:var(--text-primary)!important}
details.nut-acc{border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin:8px 0;background:var(--bg)}
details.nut-acc&gt;summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px}
details.nut-acc&gt;summary::-webkit-details-marker{display:none}
details.nut-acc&gt;summary::after{content:&quot;▸&quot;;margin-left:auto;color:var(--muted)}
details.nut-acc[open]&gt;summary::after{transform:rotate(90deg);display:inline-block}
@media(max-width:640px){.nut-hero{grid-template-columns:1fr}.nut-hero .big{font-size:32px}}
.soonitem{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--bad);
  border-radius:10px;padding:11px 13px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.soonitem:hover{border-color:var(--accent)}
.soonitem b{font-size:14px;line-height:1.35}
.soonitem .s-warn~b{}
.soonitem:has(.s-warn){border-left-color:var(--warn)}

/* ===== Новый внешний вид (ТЗ-001 блок 13): отклик, карточки, анимации ===== */
.card,details.card{border-radius:var(--radius);box-shadow:var(--shadow);border-color:var(--line);
  transition:box-shadow .25s var(--ease),transform .25s var(--ease)}
.card:hover,details.card:hover{box-shadow:var(--shadow-md)}
.phead h2{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-transform:none}
/* кнопки: отклик на нажатие */
button:active:not([disabled]){transform:scale(.96)}
/* подсказка «?» у заголовка блока */
.tip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;border-radius:50%;
  background:var(--seg);color:var(--muted);font-size:11px;font-weight:700;cursor:help;position:relative;vertical-align:1px;
  text-transform:none;letter-spacing:0;transition:background .2s var(--ease),color .2s var(--ease)}
.tip:hover,.tip:focus{background:var(--primary);color:var(--on-accent);outline:none}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,4px);
  width:max-content;max-width:260px;background:#1a1d26;color:#fff;font-size:12px;font-weight:500;line-height:1.4;
  padding:7px 10px;border-radius:8px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;white-space:normal;z-index:30;
  transition:opacity .2s var(--ease),transform .2s var(--ease)}
.tip:hover::after,.tip:focus::after{opacity:1;transform:translate(-50%,0)}
/* сетки 4 → 2 → 1 */
.mtiles{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){.mtiles{grid-template-columns:repeat(2,1fr)}}
@media (max-width:420px){.mtiles{grid-template-columns:1fr}}
.mt{border-radius:10px;background:var(--field)}
.mt:hover{background:var(--card)}
.mt-v{font-size:18px;letter-spacing:-.02em}
.mbar{height:4px;background:var(--seg);border-radius:2px;margin-top:8px;overflow:hidden}
.mbar&gt;i{display:block;height:100%;width:var(--w);border-radius:2px;animation:growBar .8s var(--ease) .1s both}
.macchart rect{transition:opacity .2s var(--ease)}
.macchart:hover rect{opacity:.55}
.macchart rect:hover{opacity:1}
/* появление блоков снизу по очереди — только при смене человека или вкладки; всё вместе ≤ 0,5 с */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.enter&gt;*{animation:fadeUp .3s var(--ease) both}
main.enter&gt;*:nth-child(2){animation-delay:.04s}
main.enter&gt;*:nth-child(3){animation-delay:.08s}
main.enter&gt;*:nth-child(4){animation-delay:.12s}
main.enter&gt;*:nth-child(5){animation-delay:.16s}
main.enter&gt;*:nth-child(n+6){animation-delay:.2s}
/* текст на синем и на цветных пилюлях: в тёмной теме синий светлый — текст тёмный */
@media (prefers-color-scheme:dark){.pill[style*=&quot;var(--bad)&quot;],.pill[style*=&quot;var(--warn)&quot;],.pill[style*=&quot;var(--ok)&quot;],.pill[style*=&quot;var(--accent)&quot;]{color:#0b1220}}

/* Вес · тренд — по референсу */
.whead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ptabs{display:flex;gap:4px;background:var(--seg);padding:3px;border-radius:8px}
.ptabs button{border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:6px;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
.ptabs button:hover:not(.on){color:var(--ink)}
.ptabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.wstat{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.wchip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:var(--seg);font-size:12.5px;color:var(--muted);font-weight:500}
.wchip.main{background:var(--accentbg);color:var(--ink)}
.wchip.main b{font-size:15px}

.wchip.bad{background:var(--badbg);color:var(--bad);font-weight:600}
.wchip.fire{background:#ffedd5;color:#9a3412;font-weight:600}
@media (prefers-color-scheme:dark){.wchip.fire{background:#3b2410;color:#fdba74}}
.wbar{display:inline-block;width:56px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;font-style:normal}
.wbar&gt;i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#3b82f6,#10b981);animation:growBar .9s var(--ease) .1s both}
.wchart{width:100%;height:auto;display:block}
.wchart .wpt{transition:r .2s var(--ease);cursor:pointer}
.wchart .wpt:hover{r:7}
.wleg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:4px}
.wleg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}

/* микроанимации графиков — только при входе в раздел и переключении периода/недели (main.enter), ≤ 1 с */
@keyframes drawLine{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes popIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growY{from{transform:scaleY(0)}to{transform:none}}
main.enter .wline{stroke-dasharray:1;animation:drawLine .7s var(--ease) .1s both}
main.enter .wdot{transform-box:fill-box;transform-origin:center;animation:popIn .3s var(--ease-spring) both;animation-delay:calc(.1s + var(--i)*.04s)}
main.enter .wfade{animation:fadeIn .5s var(--ease) both}
main.enter .wfade2{animation:fadeIn .3s var(--ease) .7s both}
main.enter .macchart rect{transform-box:fill-box;transform-origin:bottom;animation:growY .5s var(--ease) .1s both}
main.enter .macchart text{animation:fadeIn .3s var(--ease) .45s both}

/* плашка «Запись удалена · Отменить» */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120%);opacity:0;z-index:80;display:flex;align-items:center;gap:14px;
  background:#1a1d26;color:#fff;padding:11px 14px 11px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:14px;max-width:calc(100vw - 32px);
  transition:transform .25s var(--ease),opacity .25s var(--ease)}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast button{border:0;background:none;color:#93c5fd;font:inherit;font-weight:700;cursor:pointer;padding:4px 6px}

/* строки лечения в форме болезни */
.rxrow{display:grid;grid-template-columns:1fr 130px 130px 70px auto;gap:6px;align-items:end;padding:8px 0;border-bottom:1px solid var(--line)}
.rxrow label{display:flex;flex-direction:column;font-size:11.5px;color:var(--muted);font-weight:500;margin:0}
.rxrow .rxhow{grid-column:1/5}

@media (max-width:560px){.rxrow{grid-template-columns:1fr 1fr auto}.rxrow .rxm{grid-column:1/3}.rxrow .rxdel{grid-column:3;grid-row:1}.rxrow .rxhow{grid-column:1/4}}
.rxrow&gt;*,.rxrow label&gt;input,.rxrow .sugwrap{min-width:0;width:100%}
.rxrow input{min-width:0;width:100%;padding:8px 9px!important;font-size:14px!important}
.addform .welrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.addform .welrow input{flex:1 1 150px;min-width:0}
.addform .welrow .btn{flex:0 0 auto}

@media (hover:none){.tl-act{opacity:1}}

/* «＋ Добавить»: в шапке на компьютере, круглая внизу справа на телефоне; меню — шторка */
#addBtn{border:0;background:var(--primary);color:var(--on-accent);border-radius:9px;padding:8px 14px;font:inherit;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(37,99,235,.3)}

@media (max-width:640px){
  #addBtn{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:70;width:56px;height:56px;border-radius:50%;
    justify-content:center;padding:0;box-shadow:var(--shadow-lg)}
  #addBtn b{display:none}

}
.addmenu{position:fixed;inset:0;z-index:90;background:rgba(15,20,26,.45);display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .14s var(--ease)}
.addmenu.on{opacity:1;pointer-events:auto}
.vt-hero{text-align:center;padding:26px 14px;border-radius:18px;background:linear-gradient(135deg,hsl(215 70% 55% / .35),hsl(300 60% 55% / .3));margin-bottom:14px}.vt-cnt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.vt-cnt&gt;div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column}.vt-cnt b{font-size:22px}.vt-g{font-size:15px;margin:16px 0 4px}.vt-offer{margin:8px 0}.sv__sub{text-align:center;margin:-10px 0 14px}
.iv-row{margin:14px 0}.iv-l{display:flex;justify-content:space-between;margin-bottom:4px}
.chip--more{display:inline-flex;align-items:center;gap:4px;font-weight:600;background:var(--card);border:1px dashed var(--muted);color:var(--ink)}.chip__arr{transform:rotate(90deg);transition:transform .15s}.chip__arr.is-up{transform:rotate(-90deg)}@media (prefers-reduced-motion:reduce){.chip__arr{transition:none}}
.addsheet{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-lg);transform:translateY(100%);transition:transform .16s var(--ease)}
.addmenu.on .addsheet{transform:none}
@media (min-width:641px){.addmenu{align-items:center}.addsheet{border-radius:16px;transform:translateY(12px) scale(.98)}}
.addsheet .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.addsheet h2{margin:0 0 10px}
.additems{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.additems button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);
  border-radius:12px;padding:14px 12px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
.additems button:hover,.additems button:focus-visible{border-color:var(--primary);background:var(--accentbg);outline:none}
.additems button span{font-size:20px}
.additems button[hidden]{display:none}.additems .addmore-b{border-style:dashed;color:var(--muted)}
.own-more{margin-top:14px}.own-more&gt;summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600;color:var(--accent)}.plan-fold&gt;summary{min-height:44px}

/* экран проверки анализа */
.labrev input{width:100%;min-width:0;padding:6px 8px!important;font-size:13.5px!important}
.labrev tr.unsure td{background:var(--warnbg)}
.labrev td{padding:4px 5px}
.ind-card{animation:indIn .35s ease both}
@keyframes indIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ind-dyn{font-size:18px;line-height:1.6;margin:2px 0 4px;overflow-wrap:anywhere}
.ind-lab{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.ind-v.bad{color:var(--bad)} .ind-v.ok{color:var(--ok)}
.ind-sum{font-size:13px;margin-bottom:8px}
.ind-ch{max-width:620px} .ind-ch svg{width:100%;height:auto}
.ind-t tr.ind-out td{background:var(--badbg)}
.ind-more summary{cursor:pointer;font-size:14px}
