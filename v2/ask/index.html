<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Спросить медкнижку</title>
<!-- Данных в странице нет: вопрос уходит в функцию mk, она ищет по базе и просит модель
     ответить строго по найденному. Доступ — по коду из ссылки, как и у остальных экранов v2. -->
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#16202a;--muted:#5d6b7a;--line:#e2e8ee;--accent:#2b5fd9;--accentbg:#eef3fd;
  --ok:#2e9d68;--warn:#d38b12;--bad:#d64545}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1a222b;--ink:#e6edf3;--muted:#9fb0c0;--line:#2a3541;
  --accent:#6f9bff;--accentbg:#1d2a40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.embed .wrap{padding:0 0 12px}
.embed header{display:none}
header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
header h1{font-size:19px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary,:root:not([data-theme="light"]) .chips button.on{color:#0b1220}}
.chips button{min-height:44px;padding:8px 12px}.hints button{min-height:36px}.fixbar button{min-height:44px}.linkq{min-height:44px;padding:10px 4px}
button:disabled{opacity:.55;cursor:default}
textarea,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chips button{font-size:14px;padding:8px 10px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ask{display:flex;gap:8px;margin-top:8px}
.ask button{flex:none;padding:10px 18px}
.hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hints button{font-size:12.5px;padding:5px 10px;color:var(--muted)}
.ans{white-space:pre-wrap;font-size:15px}
.ans b{font-weight:700}
.ans .ref{display:inline-block;min-width:20px;text-align:center;font-size:11.5px;font-weight:700;color:var(--accent);
  background:var(--accentbg);border-radius:5px;padding:0 5px;cursor:pointer}
.srcs{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.src{border-top:1px solid var(--line);padding:8px 0;font-size:13.5px}
.src:first-of-type{border-top:0}
.src .h{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.src .n{font-size:11.5px;font-weight:700;color:var(--accent);background:var(--accentbg);border-radius:5px;padding:0 6px}
.src .t{font-weight:600;flex:1}
.src .meta{font-size:12px;color:var(--muted)}
.src .body{display:none;white-space:pre-wrap;font-size:13px;color:var(--muted);margin-top:6px}
.src.open .body{display:block}
.spin{width:30px;height:30px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;margin:14px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-size:13.5px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.qa{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}
.card.fu{margin-left:14px;border-left:3px solid var(--accent)}
.fu-box{display:flex;gap:8px;align-items:flex-end;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.fu-box textarea{flex:1}.fu-box button{flex:none;padding:10px 16px}
.past{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px}
.card.closed .body-a{display:none}
.card.closed .q{cursor:pointer;margin-bottom:0}
.qdate{font-size:12px;color:var(--muted);font-weight:400}
.fixbar{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fixbar button{font-size:13px;padding:6px 10px}
.fixhint{background:#fff6e5;border:1px solid #f0d49a;border-radius:10px;padding:8px 10px;font-size:13.5px;margin-top:12px;color:#7a5200}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fixhint{background:#2e2615;border-color:#5b4a22;color:#f0d49a}}
.linkq{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;height:auto}
.fixed{color:#1f7a4f;font-size:13.5px;font-weight:600}
.fixform{display:flex;gap:8px;margin-top:8px;width:100%}
.fixform input{flex:1}
.q{font-weight:700;margin-bottom:6px}
.ans .tbl-wrap{overflow-x:auto;margin:8px 0}.ans table{border-collapse:collapse;font-size:13px}.ans th,.ans td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.ans h3.mdh,.ans h2.mdh1{font-size:15px;margin:12px 0 4px}.ans blockquote{margin:6px 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted)}.ans ul,.ans ol{margin:6px 0;padding-left:20px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card muted">Загрузка…</div></div>
<script type="module">
const SB_URL = "https://cuhplpukqhdfutcymtmv.supabase.co";
const SB_KEY = "sb_publishable_ILfqT6mCyHBOu6BVVRxHKQ_0bPQtNi3";
const KEY_LS = "mk2_key";
if (new URLSearchParams(location.search).get("embed")) document.documentElement.classList.add("embed");
let KEY = (() => { try { return localStorage.getItem(KEY_LS) || ""; } catch (e) { return ""; } })();
(() => { const u = new URL(location.href), k = u.searchParams.get("k");
  if (k) { KEY = k; try { localStorage.setItem(KEY_LS, k); } catch (e) {} u.searchParams.delete("k"); history.replaceState(null, "", u.pathname + u.search + u.hash); } })();

const PEOPLE = [["", "Вся семья"], ["denis", "Денис"], ["anya", "Аня"], ["dima", "Дима"], ["danya", "Даня"]];
const NAME = Object.fromEntries(PEOPLE);
const ACC = { denis: "Дениса", anya: "Аню", dima: "Диму", danya: "Даню" };   // «Про Диму вопросов пока нет»
const KIND = { passport: "паспорт", razbor: "разбор", record: "запись приёма", lab_series: "ряд анализа", series: "ряд",
  symptom: "симптом", episode: "эпизод болезни", task: "дело", med: "препарат", diagnoses: "диагноз", family: "семейный анамнез",
  vac: "прививка", diary: "дневник питания", diet_week: "питание за неделю", body: "замеры тела", history: "история болезней",
  note: "заметка", ref: "справочник", organs: "органы", nutrition: "питание", nutrition_plan: "план питания", recipe: "рецепт" };
const HINTS_BY = { "": ["Какие анализы пора сдать?", "Какие прививки не сделаны?", "Какие приёмы были за месяц?"],
  denis: ["Что с моей печенью?", "Какие анализы мне пора сдать?", "Что назначали на последнем приёме?"],
  anya: ["Какие анализы мне пора сдать?", "Что назначали на последнем приёме?", "Что у меня с железом?"],
  dima: ["Что у Димы с железом?", "Что говорили про головные боли Димы?", "Чем лечили Диму на последнем приёме?"],
  danya: ["Чем лечили Даню от обструкции?", "Какие прививки Дане не сделаны?", "Что назначали Дане на последнем приёме?"] };
const hintsFor = p => HINTS_BY[p] || HINTS_BY[""];
const placeholderFor = p => ({ "": "Спросить про семью…", denis: "Спросить про Дениса…", anya: "Спросить про Аню…", dima: "Спросить про Диму…", danya: "Спросить про Даню…" })[p] || "Спросить…";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ru = d => d ? d.split("-").reverse().join(".") : "";
const app = document.getElementById("app");
const qs = new URLSearchParams(location.search);
// разговоры хранятся в базе (ТЗ-003 блок 1): при открытии подгружаем свои последние 50 — «Прошлые вопросы»
let person = PEOPLE.some(([k]) => k === qs.get("p")) ? qs.get("p") : "";
let busy = false, fixOpen = null;
let hist = [];
let uidN = 0;
const newUid = () => "u" + (++uidN) + Math.random().toString(36).slice(2, 6);
function fromRow(r) { return ({ uid: "h" + r.id, parent: r.parent_id ? "h" + r.parent_id : null, id: r.id, q: r.question, person: r.person || "", answer: r.answer || null, no_data: !r.answer,
  sources: r.sources || [], at: r.created_at, flag: r.flag, flag_note: r.flag_note, open: false }); }
// ТЗ-068: история приходит новыми сверху; сначала по возрастанию id (родитель раньше уточнения), потом — вопросы новые сверху, под каждым его уточнения по порядку
function askBuildHist(rows) {
  const asc = (rows || []).filter(askRowOk).slice().sort((a, b) => a.id - b.id).map(fromRow), have = new Set(asc.map(h => h.uid));
  for (const h of asc) if (h.parent && !have.has(h.parent)) h.parent = null;   // родитель не загружен (старше 50) — карточка самостоятельная
  const out = [], kids = h => asc.filter(x => x.parent === h.uid);
  for (const h of asc.filter(x => !x.parent).reverse()) { out.push(h); const walk = n => kids(n).forEach(k => { out.push(k); walk(k); }); walk(h); }
  return out;
}
// запрос истории для выбранного чипа: «Вся семья» — вопросы без человека
function askHistReq(person) { return { person: person ? person : "_family" }; }
function askListTitle(person) { return "Прошлые вопросы — " + (NAME[person] || "Вся семья"); }
// подпись человека в карточке: не из списка — «Другой человек», а не пустая
function askPersonLabel(p) { return !p ? "Вся семья" : NAME[p] || "Другой человек"; }
// подсказка «Похоже, в медкнижке этого нет» — один раз на цепочку, под последней карточкой
function askShowHint(hist, hi) { return askIsLast(hist, hi) && askNeedsFix(hist[hi].answer, hist[hi].sources); }
// уточнения (Денис, 18.10.2026): цепочка идёт сверху вниз — первый вопрос, под ним уточнения; врач получает последние три пары «вопрос — ответ»
function askChain(hist, hi) {
  const out = []; let h = hist[hi];
  while (h) { if (h.answer) out.unshift({ q: h.q, a: h.answer }); h = h.parent ? hist.find(x => x.uid === h.parent) : null; }
  return out.slice(-3);
}
// поле «Уточнить» — только под последним ответом цепочки
function askIsLast(hist, hi) { const next = hist[hi + 1]; return !(next && next.parent === hist[hi].uid); }
let histState = "ok", showAll = false;   // ok | loading | error
async function loadHistory() {
  histState = "loading"; showAll = false; paint();
  const mine = person;
  try { const r = await api("ask_history", askHistReq(mine)); if (mine !== person) return; hist = askBuildHist(r.rows || []); histState = "ok"; }
  catch (e) { if (mine !== person) return; histState = "error"; }
  paint();
}

async function api(action, payload = {}, retry = true) {
  let r;
  try { r = await fetch(`${SB_URL}/functions/v1/mk`, { method: "POST",
    headers: { "Content-Type": "application/json", apikey: SB_KEY, "x-mk-key": KEY }, body: JSON.stringify({ action, ...payload }) }); }
  catch (e) { throw new Error("Нет соединения. Проверьте интернет."); }
  // 546 — Supabase не хватило ресурсов (бывает под нагрузкой, ~1 на 400 запросов): один повтор через 1,5 с
  if (r.status === 546 && retry) { await new Promise(z => setTimeout(z, 1500)); return api(action, payload, false); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { try { localStorage.removeItem(KEY_LS); } catch (e) {} KEY = ""; throw new Error("Код доступа не подошёл — откройте ссылку с кодом."); }
  if (!r.ok || j.status !== "ok") throw new Error(j.code === "upstream" ? "Сервис ответов сейчас недоступен. Попробуйте ещё раз."
    : j.code === "config" ? "Сервис ответов не настроен." : "Не получилось ответить. Попробуйте переформулировать вопрос.");
  return j;
}
// запись разговора годится для показа: у вопроса есть слова, а человек известен («вся семья» тоже). Служебные записи проверок («q», «чужой») скрываем
function askRowOk(r) {
  const words = String(r && r.question || "").replace(/[^\p{L}\p{N}]/gu, "");
  return words.length >= 3 && PEOPLE.some(([k]) => k === (r.person || ""));
}
// кнопка «Поправить медкнижку» нужна, когда есть что поправлять: ничего не нашлось, источников нет или ответ уже отмечен
function askCanFix(h) { return askNeedsFix(h.answer, h.sources) || h.flag === "fix"; }
// ответ, после которого стоит поправить медкнижку: ничего не нашлось или у ответа нет ни одного источника (ТЗ-003 блок 2, ТЗ-031 блок 6)
function askNeedsFix(answer, sources) {
  if (!answer || !String(answer).trim()) return true;
  return !(sources && sources.length);
}
// ответ модели: заголовки, жирный текст, списки, таблицы и ссылки [1] на источники (тот же разбор, что в карточке симптома)
function fmt(t) {
  const text = t;
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<i>$2</i>").replace(/\[(\d{1,2})\]/g,(m,n)=>`<span class="ref" data-ref="${n}">${n}</span>`);
  const L=String(text||"").replace(/\r/g,"").replace(/^---[\s\S]*?\n---\n/,"").split("\n"), out=[]; let i=0;
  while(i<L.length){
    const l=L[i];
    if(/^\s*\|/.test(l)){ const rows=[]; while(i<L.length&&/^\s*\|/.test(L[i])){ rows.push(L[i]); i++; }
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body=rows.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)); if(!body.length) continue;
      out.push(`<div class="tbl-wrap"><table class="tbl"><thead><tr>${cells(body[0]).map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); continue; }
    let h=l.match(/^(#{1,3})\s+(.+)/); if(h){ out.push(h[1].length===1?`<h2 class="mdh1">${inl(h[2])}</h2>`:`<h3 class="mdh">${inl(h[2])}</h3>`); i++; continue; }
    if(/^\s*-{3,}\s*$/.test(l)){ out.push('<hr class="mdhr">'); i++; continue; }
    if(/^\s*>/.test(l)){ const q=[]; while(i<L.length&&/^\s*>/.test(L[i])){ q.push(L[i].replace(/^\s*>\s?/,"")); i++; } out.push(`<blockquote class="mdq">${q.filter(x=>x.trim()).map(x=>`<p style="margin:4px 0">${inl(x)}</p>`).join("")}</blockquote>`); continue; }
    if(/^\s*\d+[.)]\s+/.test(l)){ const it=[]; while(i<L.length&&(/^\s*\d+[.)]\s+/.test(L[i])||(/^\s{2,}\S/.test(L[i])&&it.length))){ if(/^\s*\d+[.)]\s+/.test(L[i])) it.push(L[i].replace(/^\s*\d+[.)]\s+/,"")); else it[it.length-1]+=" "+L[i].trim(); i++; } out.push(`<ol style="margin:4px 0 8px;padding-left:22px">${it.map(x=>`<li>${inl(x)}</li>`).join("")}</ol>`); continue; }
    if(/^\s*[-•]\s+/.test(l)){ const it=[]; while(i<L.length&&(/^\s*[-•]\s+/.test(L[i])||(/^\s{2,}\S/.test(L[i])&&it.length))){ if(/^\s*[-•]\s+/.test(L[i])) it.push(L[i].replace(/^\s*[-•]\s+/,"")); else it[it.length-1]+=" "+L[i].trim(); i++; } out.push(`<ul style="margin:4px 0 8px;padding-left:20px">${it.map(x=>`<li>${inl(x)}</li>`).join("")}</ul>`); continue; }
    if(!l.trim()){ i++; continue; }
    out.push(`<p style="margin:6px 0">${inl(l)}</p>`); i++;
  }
  return out.join("");
}
function view() {
  app.innerHTML = `
  <header><h1>Спросить медкнижку</h1></header>
  ${KEY ? `<div class="card">
    <div class="chips" id="ppl">${PEOPLE.map(([k, n]) => `<button data-p="${k}" class="${k === person ? "on" : ""}">${n}</button>`).join("")}</div>
    <textarea id="q" rows="2" placeholder="${esc(placeholderFor(person))}"></textarea>
    <div class="ask"><button class="primary" id="go" style="flex:1">Спросить</button></div>
    ${hist.some(h => h.open) ? "" : `<div class="hints">${hintsFor(person).map(h => `<button data-h="${esc(h)}">${esc(h)}</button>`).join("")}</div>`}
    <div class="note">Отвечает по вашим записям: паспорта здоровья, разборы, приёмы, анализы, симптомы, питание.
      Общих медицинских советов не даёт и диагнозов не ставит — под ответом всегда видно, из каких записей он собран.</div>
  </div>
  <div id="out"></div>`
  : `<div class="card"><div class="muted">Откройте на этом устройстве ссылку с кодом доступа — дальше страница его запомнит.</div>
     <input id="kc" placeholder="или вставьте код сюда" style="margin:10px 0">
     <button class="primary" id="kgo" style="width:100%">Открыть</button></div>`}`;
  if (!KEY) { document.getElementById("kgo").onclick = () => {
      const v = document.getElementById("kc").value.trim().replace(/^.*[?&]k=/, "").replace(/[&#].*$/, "");
      if (!v) return; try { localStorage.setItem(KEY_LS, v); } catch (e) {} KEY = v; view(); }; return; }
  document.getElementById("ppl").onclick = e => { const b = e.target.closest("[data-p]"); if (!b || busy) return;
    person = b.dataset.p; document.querySelectorAll("#ppl button").forEach(x => x.classList.toggle("on", x === b)); tellPerson(); loadHistory();
    document.getElementById("q").placeholder = placeholderFor(person);
    const hs = document.querySelector(".hints"); if (hs) { hs.innerHTML = hintsFor(person).map(h => `<button data-h="${esc(h)}">${esc(h)}</button>`).join(""); } };
  const q = document.getElementById("q");
  if (qs.get("q") && !q.value) q.value = qs.get("q").slice(0, 300);
  document.getElementById("go").onclick = () => ask(q.value.trim());
  // Enter отправляет вопрос; Shift+Enter — новая строка
  q.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value.trim()); } };
  const hints = document.querySelector(".hints");
  if (hints) hints.onclick = e => { const b = e.target.closest("[data-h]"); if (b) { q.value = b.dataset.h; ask(b.dataset.h); } };
  paint();
  loadHistory();
}
// ТЗ-010 блок 16: сверху — источники, на которые ссылается ответ ([3], [6]); остальные найденные — свёрнуты
function splitSources(answer, sources) {
  const refs = new Set(); String(answer || "").replace(/\[(\d+(?:\s*[,;]\s*\d+)*)\]/g, (_, g) => g.split(/[,;]/).forEach(n => refs.add(+n)));
  const list = sources || [];
  return { cited: list.filter(x => refs.has(x.n)), rest: list.filter(x => !refs.has(x.n)) };
}
function srcHtml(s) {
  return `<div class="src" data-n="${s.n}"><div class="h"><span class="n">${s.n}</span>
           <span class="t">${esc(s.title)}</span></div>
           <div class="meta">${esc(NAME[s.person] || "семья")}${s.kind ? " · " + esc(KIND[s.kind] || s.kind) : ""}${s.doc_date ? " · " + ru(s.doc_date) : ""}${s.source ? " · " + esc(s.source) : ""}</div>
           ${s.content ? `<div class="body">${esc(s.content.split("\n").slice(1).join("\n"))}</div>` : ""}</div>`;
}
function card(h, hi) {
  const flagged = h.flag === "fix";
  const fixUi = !h.id || h.error ? "" : flagged
    ? `<div class="fixbar"><span class="fixed">📌 отмечено — поправим</span>${h.flag_note ? `<span class="muted" style="font-size:13px">«${esc(h.flag_note)}»</span>` : ""}
        <button data-unfix="${hi}">Снять отметку</button></div>`
    : `${askShowHint(hist, hi) ? `<div class="fixhint">Похоже, в медкнижке этого нет</div>` : ""}
       <div class="fixbar">${fixOpen === hi
         ? `<div class="fixform"><input id="fixnote" placeholder="Что не так или чего не хватает (необязательно)"><button class="primary" data-fixgo="${hi}">Отметить</button></div>`
         : askCanFix(h) ? `<button data-fix="${hi}">📌 Поправить медкнижку</button>` : `<button class="linkq" data-fix="${hi}">Ответ неверный или неполный?</button>`}</div>`;
  const fu = h.open && !h.error && askIsLast(hist, hi)
    ? `<div class="fu-box"><textarea data-fuq="${hi}" rows="2" placeholder="Уточнить: задайте вопрос по этому ответу"></textarea>
        <button class="primary" data-fugo="${hi}"${busy ? " disabled" : ""}>Спросить</button></div>` : "";
  return `<div class="card${h.open ? "" : " closed"}${h.parent ? " fu" : ""}" data-card="${hi}">
    <div class="q" data-toggle="${hi}">${esc(h.q)}${h.person ? ` <span class="muted" style="font-weight:400">· ${esc(askPersonLabel(h.person))}</span>` : ""}
      ${h.at ? `<span class="qdate">· ${esc(ru(String(h.at).slice(0, 10)))}</span>` : ""}${flagged && !h.open ? ' <span class="fixed" style="font-size:12px">📌</span>' : ""}</div>
    <div class="body-a">
    ${h.error ? `<div class="err">${esc(h.error)}</div>`
      : h.no_data ? `<div class="muted">В медкнижке по этому вопросу ничего не нашлось.</div>`
      : `<div class="ans" data-h="${hi}">${fmt(h.answer)}</div>
         ${h.sources.length ? (() => { const sp = splitSources(h.answer, h.sources);
           return `<div class="srcs">${sp.cited.length ? `<div class="muted" style="font-size:12.5px;margin-bottom:6px">Источники — нажмите, чтобы раскрыть</div>${sp.cited.map(srcHtml).join("")}` : ""}
           ${sp.rest.length ? `<details class="more-src"><summary class="muted" style="font-size:12.5px;cursor:pointer">${sp.cited.length ? "Ещё найдено" : "Что искал"}: ${sp.rest.length}</summary>${sp.rest.map(srcHtml).join("")}</details>` : ""}</div>`; })() : ""}`}
    ${fu}
    ${fixUi}
    </div></div>`;
}
function paint() {
  const out = document.getElementById("out"); if (!out) return;
  out.innerHTML = (busy ? `<div class="card"><div class="q">${esc(busy)}</div><div class="spin"></div>
      <div class="muted" style="text-align:center">Ищу в медкнижке и собираю ответ…</div></div>` : "")
    + (histState === "loading" ? `<div class="past">${esc(askListTitle(person))}</div><div class="muted" style="padding:0 2px">Открываем вопросы…</div>` : "")
    + (histState === "error" ? `<div class="past">${esc(askListTitle(person))}</div><div class="muted" style="padding:0 2px">Не получилось открыть вопросы. <button class="linkq" id="histretry">Повторить</button></div>` : "")
    + (histState === "ok" && !busy && !hist.length ? `<div class="past">${esc(askListTitle(person))}</div><div class="muted" style="padding:0 2px">${esc(person ? "Про " + (ACC[person] || "этого человека") + " вопросов пока нет" : "Про всю семью вопросов пока нет")}</div>` : "")
    + (histState === "ok" ? hist.map((h, hi) => ({ h, hi })).filter(x => showAll || x.hi < 10 || x.h.open).map(({ h, hi }) => (hi === hist.findIndex(x => !x.open) && hist.some(x => !x.open) ? `<div class="past">${esc(askListTitle(person))}</div>` : "") + card(h, hi)).join("")
        + (!showAll && hist.length > 10 && hist.slice(10).some(x => !x.open) ? `<button class="linkq" id="histmore" style="margin:8px 2px">Ещё ${hist.length - 10}</button>` : "") : "");
  out.onkeydown = e => { const t = e.target; if (t && t.dataset && t.dataset.fuq !== undefined && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); followUp(+t.dataset.fuq); } };
  out.onclick = async e => {
    if (e.target.id === "histretry") { loadHistory(); return; }
    if (e.target.id === "histmore") { showAll = true; paint(); return; }
    const fg = e.target.closest("[data-fugo]"); if (fg) { followUp(+fg.dataset.fugo); return; }
    const tg = e.target.closest("[data-toggle]");
    if (tg && tg.closest(".card.closed")) { hist[+tg.dataset.toggle].open = true; paint(); return; }
    const fx = e.target.closest("[data-fix]"); if (fx) { fixOpen = +fx.dataset.fix; paint(); document.getElementById("fixnote")?.focus(); return; }
    const go = e.target.closest("[data-fixgo]"), un = e.target.closest("[data-unfix]");
    if (go || un) { const h = hist[+(go || un).dataset[go ? "fixgo" : "unfix"]]; const note = go ? (document.getElementById("fixnote")?.value || "").trim() : "";
      (go || un).disabled = true;
      try { await api(go ? "ask_flag" : "ask_unflag", { id: h.id, note });
        Object.assign(h, go ? { flag: "fix", flag_note: note || null } : { flag: null, flag_note: null }); fixOpen = null; }
      catch (err) { alert(err.message); }
      paint(); return; }
    const ref = e.target.closest("[data-ref]");
    if (ref) { const card = ref.closest(".card"), s = card.querySelector(`.src[data-n="${ref.dataset.ref}"]`);
      if (s) { s.classList.add("open"); s.scrollIntoView({ block: "center", behavior: "smooth" }); } return; }
    const src = e.target.closest(".src .h"); if (src) src.parentElement.classList.toggle("open");
  };
}
// о ком спрашивают — тот человек и открывается в медкнижке (страница-родитель переключает «Дима»/«Даня» вверху)
function tellPerson() { try { if (person && window.parent !== window) window.parent.postMessage({ mk: "person", person }, "*"); } catch (e) {} }
function followUp(hi) {
  const ta = document.querySelector(`[data-fuq="${hi}"]`), q = (ta && ta.value || "").trim();
  if (q) ask(q, hist[hi]);
}
async function ask(q, parent) {
  if (!q || busy) return;
  if (!parent) tellPerson();
  busy = q;
  document.querySelector(".hints")?.remove();
  paint();
  const who = parent ? parent.person : person;
  const item = { uid: newUid(), parent: parent ? parent.uid : null, q, person: who, open: true, at: new Date().toISOString() };
  // уточнение: врач видит предыдущие вопросы и ответы, а поиск по медкнижке идёт по вопросу вместе с прежним
  const history = parent ? askChain(hist, hist.indexOf(parent)) : [];
  try { const r = await api("ask", { question: q, person: who || null, mode: "doctor", general: true, search: parent ? parent.q + " " + q : q, prefer_kind: ["razbor", "passport"], ...(history.length ? { history } : {}), ...(parent && parent.id ? { parent_id: parent.id } : {}) });
    Object.assign(item, { id: r.log_id, answer: r.answer, sources: r.sources || [], no_data: !!r.no_data }); }
  catch (e) { item.error = e.message; }
  busy = false; fixOpen = null;
  if (who === person || parent) { if (parent) hist.splice(hist.indexOf(parent) + 1, 0, item); else hist.unshift(item); }   // уточнение — сразу под вопросом, к которому относится
  paint();
  if (!KEY) view();
}
view();
</script>
