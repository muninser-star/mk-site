// статус по норме с бланка — та же логика, что в функции распознавания (rag/функции/entries)
// ТЗ-003 блок 3: поиск показателя — основы слов названия (как sameIndicator в функции entries):
// сокращения (Hb, HGB, WBC…) → русская основа, «МСН» кириллицей → MCH, полные названия индексов → их сокращения
function indStems(s){
  const ABBR={wbc:"лейко",rbc:"эритр",hgb:"гемог",hb:"гемог",hct:"гемат",plt:"тромб",neu:"нейтр",lym:"лимфо",mon:"моноц",eos:"эозин",bas:"базоф",esr:"соэ",alt:"алт",ast:"аст",tsh:"ттг",crp:"срб"};
  const LOOK={"а":"a","в":"b","с":"c","е":"e","н":"h","к":"k","м":"m","о":"o","р":"p","т":"t","х":"x"};
  const FULL=[[/объем\S* эритроц/,"mcv"],[/содерж\S* гемоглоб/,"mch"],[/концентр\S* гемоглоб/,"mchc"],[/распредел\S* эритроц|анизоцит/,"rdw"],[/объем\S* тромбоц/,"mpv"],[/распредел\S* тромбоц/,"pdw"]];
  const t=String(s||"").toLowerCase().replace(/ё/g,"е");
  const lat=w=>/^[авсенкмортх]{2,5}$/.test(w)&&!ABBR[w]?[...w].map(c=>LOOK[c]).join(""):w;
  const out=new Set(t.split(/[^a-zа-я0-9]+/).filter(w=>w.length>=3||ABBR[w]||/^[авсенкмортх]{2,5}$/.test(w)).map(lat)
    .map(w=>ABBR[w]||(/^[a-z0-9]+$/.test(w)?w:w.slice(0,5))));
  for(const [re,ab] of FULL) if(re.test(t)) out.add(ab);
  return out;
}
// насколько название показателя подходит к запросу: 3 — это он («hb», «Гемоглобин (HGB)»), 1 — запрос входит в название, 0 — нет
function indicatorMatch(q,name){
  const noBr=x=>String(x||"").replace(/\([^)]*\)/g," ");
  const qs=indStems(q), qb=indStems(noBr(q)), bs=indStems(noBr(name)), is=indStems((String(name).match(/\(([^)]*)\)/)||[])[1]||"");
  if(!qs.size) return 0;
  const eq=(a,b)=>a.size>0&&a.size===b.size&&[...a].every(x=>b.has(x));
  if(eq(qb,bs)||eq(qs,bs)||eq(qs,is)) return 3;
  const qq=qb.size?qb:qs;
  return [...qq].every(x=>bs.has(x)||is.has(x))?1:0;
}
// карточки показателей для запроса: строки {d, n, v, u, norm} → [{name, unit, rows (новые сверху), dyn (от старых, до 8)}]
function indicatorCards(q,rows){
  const noBr=x=>String(x||"").replace(/\([^)]*\)/g," ");
  const groups={};
  for(const r of rows||[]){ if(!r||!r.n||!r.d) continue;
    const key=[...indStems(noBr(r.n))].sort().join(" ")||String(r.n).toLowerCase();
    (groups[key]=groups[key]||[]).push(r); }
  const num=v=>{ const x=parseFloat(String(v??"").replace(",",".").replace(/\s/g,"")); return isFinite(x)?x:null; };
  const cards=[];
  for(const g of Object.values(groups)){
    const names={}; g.forEach(r=>{ names[r.n]=(names[r.n]||0)+1; });
    const name=Object.keys(names).sort((a,b)=>names[b]-names[a]||b.length-a.length)[0];
    const score=Math.max(...Object.keys(names).map(n=>indicatorMatch(q,n)));
    if(!score) continue;
    // одна дата и одно значение — одна строка; из дублей берём ту, где есть единица и норма числами
    const byKey={}, normOk=x=>/\d/.test(String(x||""));
    g.forEach(r=>{ const k=r.d+"|"+(num(r.v)??String(r.v)), o=byKey[k];
      const row={d:r.d,v:r.v,u:r.u||"",norm:normOk(r.norm)?r.norm:""};
      if(!o) byKey[k]=row; else { if(!o.u&&row.u) o.u=row.u; if(!o.norm&&row.norm) o.norm=row.norm; } });
    const list=Object.values(byKey).sort((a,b)=>b.d.localeCompare(a.d)).map(r=>Object.assign(r,{flag:flagByNorm(r.v,r.norm)}));
    const unit=(list.find(r=>num(r.v)!=null&&r.u)||list.find(r=>num(r.v)!=null)||list[0]||{}).u||"";
    const dyn=list.filter(r=>num(r.v)!=null&&(!r.u||r.u===unit)).slice(0,8).reverse().map(r=>({d:r.d,v:num(r.v),flag:r.flag}));
    cards.push({name,unit,score,rows:list,dyn});
  }
  return cards.sort((a,b)=>b.score-a.score||b.rows.length-a.rows.length).slice(0,4);
}
// блок 4: запись книжки за дату строки показателя — сам показатель или анализ, внутри которого он есть; нет — -1
function recForMeasurement(rec,d,name){
  const noBr=x=>String(x||"").replace(/\([^)]*\)/g," ").trim().toLowerCase();
  const day=(rec||[]).map((r,i)=>[r,i]).filter(([r])=>r.d===d&&(r.t==="lab"||r.t==="instr"));
  const exact=day.find(([r])=>indicatorMatch(name,r.title)===3); if(exact) return exact[1];
  const inside=day.find(([r])=>[r.res,r.v,(r.full||[]).map(f=>Array.isArray(f)?f.join(" "):f).join(" ")].join(" ").toLowerCase().includes(noBr(name)));
  if(inside) return inside[1];
  return day.length===1?day[0][1]:-1;
}
// значения показателей человека для поиска: полный ряд из базы (mk → measurements) + записи и ряды книжки
function measRows(k){
  const d=DATA[k]||{}, out=[];
  (window.__MEAS||[]).filter(m=>m.person===k).forEach(m=>out.push({d:m.m_date,n:m.indicator,v:m.value_num??m.value_text,u:m.unit||"",norm:m.norm||""}));
  (d.rec||[]).filter(r=>r.t==="lab"&&r.v).forEach(r=>{ const m=String(r.v).match(/^\s*([<>]?\s*-?[\d.,]+)\s*(.*)$/);
    if(m) out.push({d:r.d,n:r.title,v:m[1].trim(),u:m[2].trim(),norm:r.n||""}); });
  (d.series||[]).forEach(s=>(s.pts||[]).forEach(p=>{ const [dd,mm,yy]=String(p[0]).split(".");

function sparkSvg(pts,dir){

function favRows(rows,keys){

// специальность дела: по названию врача в тексте, иначе по системе дела (первая специальность, у которой она в списке)
function wzSpecOfTask(x){
  const bySys=x.sys?(DOC_SPECS.find(sp=>sp[0]!=="ped"&&sp[0]!=="other"&&sp[2]!=="all"&&sp[2].split(" ").includes(x.sys))||[])[0]:null;

// куда идти: ближайшие визиты (запланированные и «следующий визит» с прошлых приёмов), дела «записаться», авто-подбор по записям
function wzCandidates(d,plans,todo,today){
  const out=[], has=k=>out.some(x=>x.spec===k);
  upcomingVisits(d,plans,today).forEach(v=>{ const k=v.src==="plan"?v.title:specByDoctor(v.title); if(!has(k)) out.push({spec:k,date:v.date,why:v.src==="plan"?"запланирован визит":`назначен на прошлом приёме: ${v.title}`}); });
  // дата дальше чем через 4 месяца — не «ближайший визит»: такие идут после дел «записаться»
  const far=x=>x.date&&Math.round((Date.parse(x.date+"T12:00:00Z")-Date.parse(today+"T12:00:00Z"))/864e5)>120, farOnes=out.filter(far); farOnes.forEach(x=>out.splice(out.indexOf(x),1));
  // «Педиатр 13.11 — уже после забора»: врач и дата из текста дел
  const yr=+today.slice(0,4), fix=(dd,mm,yy)=>{ let y=yy?+yy:yr, iso=`${y}-${mm}-${dd}`; if(!yy&&iso<today) iso=`${y+1}-${mm}-${dd}`; return iso; };
  (todo||[]).forEach(x=>{ const m=(x.title+" "+(x.why||"")).match(/(педиатр|гематолог|невролог|кардиолог|уролог|эндокринолог|офтальмолог|ортопед|аллерголог|гастроэнтеролог|психиатр|психотерапевт|нейропсихолог|стоматолог|лор\b|дерматолог|хирург)[а-яё]*[^.;\n]{0,30}?(\d{2})\.(\d{2})(?:\.(\d{4}))?/i);
    if(m){ const k=specByDoctor(m[1]), date=fix(m[2],m[3],m[4]); if(date>=today&&!has(k)) out.push({spec:k,date,why:`в плане: ${m[1]} ${m[2]}.${m[3]}`}); } });
  (todo||[]).filter(x=>!x.self&&x.tag==="записаться").forEach(x=>{ const k=wzSpecOfTask(x); if(k!=="ped"&&!has(k)) out.push({spec:k,date:"",why:x.title}); });
  const a=briefSpecialty(d,today); if(!has(a.spec)) out.push({spec:a.spec,date:"",why:a.why});
  farOnes.forEach(x=>{ if(!has(x.spec)) out.push(x); });
  // порядок: ближайшие по дате → без даты → дата дальше четырёх месяцев
  const rank=x=>x.date?(far(x)?2:0):1;
  return out.map((x,i)=>[x,i]).sort((a,b)=>rank(a[0])-rank(b[0])||(rank(a[0])===0?a[0].date.localeCompare(b[0].date):a[1]-b[1])).map(x=>x[0]).slice(0,5);
}
// что предложить для приёма: причины, вопросы, анализы и обследования, что взять; каждый пункт — {t, src: дата или пояснение}

  const namesOther=x=>{ const k=specByDoctor(x.title); return k!=="ped"&&k!==spec; };

  const mine=(d.rec||[]).filter(r=>r.t==="visit"&&specOfName(r.who||r.title)===spec).sort((a,b)=>b.d.localeCompare(a.d)), prev=mine[0]||null;   // приём именно этой специальности: по названию врача
  if(prev){ const rx=(prev.full||[]).find(f=>Array.isArray(f)&&/назначени|рекоменд/i.test(f[0]));
    questions.push(I(`С прошлого приёма (${ru(prev.d)}) что-то менялось — выполнено ли назначенное${rx?`: ${String(rx[1]).slice(0,90)}`:""}?`,prev.d)); }

  myTodo.filter(x=>x.tag==="спросить").slice(0,5).forEach(x=>questions.push(I(x.title,x.when||"")));

  (d.meds||[]).filter(m=>!m.plan&&m.from&&m.from<=today&&(!m.to||m.to>=today)&&!(m.stopped&&m.stopped<=today)&&(all||eps.some(e=>e.id===m.ep))).slice(0,3)
    .forEach(m=>questions.push(I(`${m.n}: до какого срока принимать и по какому признаку судить, что работает?`,m.from)));
  // анализы: сначала из дел, потом повтор находок вне нормы

  const last=name=>{ const k=favKey(String(name).split(/[,:(—-]/)[0]); return k.length<4?null:labs.find(r=>favKey(r.title).includes(k)); };
  const note=name=>{ const r=last(name); if(!r) return ""; const dd=days(r.d,today); return dd<=21?`сдавали ${ru(r.d)}: ${r.v}`:`последний ${ru(r.d)}: ${r.v}`; };

  const latest=new Map(); labs.forEach(r=>{ const k=favKey(String(r.title).split(/[,(]/)[0]); if(!latest.has(k)) latest.set(k,r); });
  [...latest.values()].filter(r=>(all||inS(r))&&!seen.has(favKey(r.title).slice(0,12))&&["выше","ниже"].includes(flagByNorm(String(r.v).match(/^\s*([<>]?\s*-?[\d.,]+)/)?.[1]||"",r.n))&&days(r.d,today)<=365).forEach(r=>{
    if(tests.length<9) tests.push(I(`Повторить: ${r.title}`,`${ru(r.d)}: ${r.v} (норма ${r.n})`)); });
  // что известно по специальности: последний приём, свежие исследования по теме, диагнозы в её системах, семейный анамнез по теме
  const known=[], fam=DOC_FAM[spec];

// набор для документа: только то, что записано; личные данные (СНИЛС, паспорт, адрес, полис) не читаются никогда
function doctorPack(d,key,today,opt){
  opt=opt||{};
  const sys=new Set(opt.systems&&opt.systems.length?opt.systems:docSpecSys(key)), all=DOC_SPECS.find(x=>x[0]===key)||DOC_SPECS[0];
  const allSys=all[2]==="all"&&!(opt.systems&&opt.systems.length);
  const inS=r=>allSys?true:sys.has(r.sys);
  const yearAgo=(()=>{ const x=new Date(today+"T12:00:00Z"); x.setUTCFullYear(x.getUTCFullYear()-1); return x.toISOString().slice(0,10); })();
  const R=d.rec||[], S=d.sym||{}, ok=r=>!!r;
  // запрос
  const rq=opt.req||{}, req={purpose:String(rq.purpose||"").trim(),questions:planClean(rq.questions),tests:planClean(rq.tests),other:planClean(rq.other)};
  const hasReq=!!(req.purpose||req.questions.length||req.tests.length||req.other.length);
  // сейчас: открытые болезни и последние симптомы системы (не больше 10, не старше года)
  const eps=(S.ep||[]).filter(e=>!e.d2&&/[a-zа-яё]{2}/i.test(e.dx||""));
  const syms=(S.log||[]).filter(x=>x.d>=yearAgo&&x.d<=today&&(allSys||sys.has(x.sys))).sort((a,b)=>b.d.localeCompare(a.d));
  const d30=(()=>{ const x=new Date(today+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()-30); return x.toISOString().slice(0,10); })();
  const m30=syms.filter(x=>x.d>=d30), ii=m30.map(x=>x.i).filter(v=>v!=null);
  // лекарства: только действующие
  const meds=(d.meds||[]).filter(m=>{ const a=m.from||null; if(m.stopped&&m.stopped<=today) return false; if(m.plan&&!(a&&a<=today)) return false; return a?(a<=today&&(!m.to||m.to>=today)):false; });
  // анамнез
  const dx=(d.diagnoses||[]).filter(x=>allSys||!x.sys||sys.has(x.sys));
  const topical=DOC_FAM[key]||null;
  const fam=(d.family||[]).map(f=>({who:f.who,what:f.what,topical:!!(topical&&topical.test(f.who+" "+f.what))})).sort((a,b)=>b.topical-a.topical);
  // анализы: последний по каждому показателю; вне нормы — до 4 последних значений
  const labsAll=R.filter(r=>r.t==="lab"&&r.title&&inS(r)), by={};
  labsAll.forEach(r=>(by[r.title]=by[r.title]||[]).push(r));
  const labs=Object.keys(by).map(t=>{ const L=by[t].sort((a,b)=>b.d.localeCompare(a.d)), r=L[0];
    return {title:t,v:r.v||"",n:r.n||"",st:r.st||"none",d:r.d,last:(r.st&&r.st!=="ok")?L.slice(0,4).map(x=>({d:x.d,v:x.v||"",st:x.st||"none"})):[],
      ser:(d.series||[]).find(s=>String(s.name).toLowerCase()===String(t).toLowerCase())?String(t):""}; })
    .sort((a,b)=>(a.st==="ok")-(b.st==="ok")||a.title.localeCompare(b.title));
  const instr=R.filter(r=>r.t==="instr"&&inS(r)).sort((a,b)=>b.d.localeCompare(a.d)).map(r=>({d:r.d,title:r.title,st:r.st||"none",res:firstSentence(r.res,160)}));
  // посещения: 12 месяцев, по специальности — сверху
  const nameRx=new RegExp(String(all[1]).split(/\s*\/\s*/)[0].slice(0,6),"i");
  const visits=R.filter(r=>r.t==="visit"&&r.d>=yearAgo&&r.d<=today).map(r=>({d:r.d,who:r.who||String(r.title||"").replace(/:.*$/,""),title:r.title,
      ill:(r.data&&r.data.dx)||r.epDx||"",rx:(r.data&&r.data.rx)||"",mine:allSys||sys.has(r.sys)||nameRx.test(String(r.who||"")+" "+String(r.title||""))}))
    .sort((a,b)=>(b.mine-a.mine)||b.d.localeCompare(a.d));
  const hosp=R.filter(r=>r.t==="hosp"&&inS(r)).sort((a,b)=>String(b.d1||b.d).localeCompare(String(a.d1||a.d)));
  return {head:{name:d.name,dob:d.dob,age:d.age,spec:all[1],date:today},req:hasReq?req:null,
    now:{eps,tmax:eps.reduce((m,e)=>e.tmax&&e.tmax>m?e.tmax:m,0)||null},
    syms:{list:syms.slice(0,10),n30:m30.length,avg30:ii.length?Math.round(ii.reduce((a,b)=>a+b,0)/ii.length*10)/10:null},
    meds,dx,past:d.past||[],fam,labs,instr,visits,hosp,
    empty:!labs.length&&!instr.length&&!syms.length&&!dx.length&&!visits.some(v=>v.mine)};
}

// ── Предстоящие визиты (ТЗ-010 блок 17): запрос врачу заранее; хранятся в базе, видны с любого устройства ──
// разбор текста с вопросами — по правилам, без модели (тот же текст, что в функции mk)
function parsePlanText(text) {
  const head = t => { const k = String(t).toLowerCase().replace(/[#*_\x60:]/g, "").replace(/ё/g, "е").trim();
    if (/^(вопросы|вопросы к врачу)$/.test(k)) return "questions";
    if (/^(анализы|исследования|анализы и исследования|анализы и обследования|обследования)$/.test(k)) return "tests";
    if (/^(что еще|что еще нужно|другое|еще|прочее)$/.test(k)) return "other";
    if (/^(цель|для чего|для чего пришли|цель визита)$/.test(k)) return "purpose";
    return null; };
  const out = { purpose: "", questions: [], tests: [], other: [] }, seen = {};
  let sec = "questions";
  for (const raw of String(text || "").replace(/\r/g, "").split("\n")) {
    const line = raw.trim(); if (!line) continue;
    const h = head(line); if (h) { sec = h; continue; }
    const t = line.replace(/^(?:[-•*–—]|\d+[.)])\s+/, "").trim(); if (!t) continue;
    if (sec === "purpose") { out.purpose = (out.purpose ? out.purpose + " " : "") + t; continue; }
    const k = sec + "|" + t.toLowerCase(); if (seen[k]) continue; seen[k] = 1; out[sec].push(t);
  }
  return out;
}
// подпись даты визита: «дата не известна», «завтра», «дата прошла — отметить состоялся?»
function planLabel(plan,today){
  if(!plan.planned_date) return "дата не известна";
  if(plan.status==="planned"&&plan.planned_date<today) return "дата прошла — отметить состоялся?";
  const n=Math.round((Date.parse(plan.planned_date+"T12:00:00Z")-Date.parse(today+"T12:00:00Z"))/864e5);
  return n===0?"сегодня":n===1?"завтра":ru(plan.planned_date);
}

}

// ── Календарь и «Добавить в календарь» (компоненты из Компоненты.html; ТЗ-005 блок 19 — задел: файл .ics и ссылка календаря с напоминанием за 3 дня) ──
const CAL_KIND={visit:"приём",lab:"анализ",med:"курс лекарства",sym:"симптом",plan:"приём"};
// события человека по датам: приёмы и анализы из записей, начало и конец курсов, симптомы, предстоящие визиты и следующие визиты из приёмов
function calEvents(d,plans){
  const E={}, add=(k,date,t,time)=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date||""))) return; (E[date]=E[date]||[]).push({k,t,time:time||"",date}); };
  (d.rec||[]).forEach(r=>{
    if(r.t==="visit"){ add("visit",r.d,r.title||"Приём"); const nx=r.data&&r.data.next; if(nx) add("plan",nx,"Следующий визит: "+(r.who||r.title||"")); }
    else if(r.t==="lab"||r.t==="instr") add("lab",r.d,r.title);
  });
  (d.meds||[]).forEach(m=>{ const a=medStart(m); if(a) add("med",a,"Начало курса: "+m.n); if(m.to) add("med",m.to,"Конец курса: "+m.n); });
  ((d.sym||{}).log||[]).forEach(x=>add("sym",x.d,x.n));
  (plans||[]).filter(p=>p.status==="planned"&&p.planned_date).forEach(p=>add("plan",p.planned_date,"Приём: "+((DOC_SPECS.find(s=>s[0]===p.specialty)||[])[1]||p.specialty)));
  return E;
}
function icsEsc(t){ return String(t||"").replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n"); }
// файл календаря на один день; remind — напоминание за 3 дня
function icsFor(ev,remind){
  const ymd=iso=>iso.replace(/-/g,""), next=iso=>{ const x=new Date(iso+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+1); return x.toISOString().slice(0,10).replace(/-/g,""); };
  const dt=ev.time?`DTSTART:${ymd(ev.date)}T${ev.time.replace(":","")}00`:`DTSTART;VALUE=DATE:${ymd(ev.date)}`;
  const end=ev.time?`DTEND:${ymd(ev.date)}T${String((+ev.time.slice(0,2)+1)%24).padStart(2,"0")}${ev.time.slice(3,5)}00`:`DTEND;VALUE=DATE:${next(ev.date)}`;
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Медкнижка//RU","BEGIN:VEVENT","UID:"+ymd(ev.date)+"-"+Math.abs(icsEsc(ev.t).split("").reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))+"@mk",
    "DTSTAMP:"+new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",dt,end,"SUMMARY:"+icsEsc(ev.t),"DESCRIPTION:"+icsEsc(ev.note||"Медкнижка"),
    ...(remind?["BEGIN:VALARM","TRIGGER:-P3D","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(ev.t),"END:VALARM"]:[]),"END:VEVENT","END:VCALENDAR"].join("\r\n");
}
function googleCalUrl(ev){
  const ymd=iso=>iso.replace(/-/g,""), n=iso=>{ const x=new Date(iso+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+1); return x.toISOString().slice(0,10).replace(/-/g,""); };
  const dates=ev.time?`${ymd(ev.date)}T${ev.time.replace(":","")}00/${ymd(ev.date)}T${String((+ev.time.slice(0,2)+1)%24).padStart(2,"0")}${ev.time.slice(3,5)}00`:`${ymd(ev.date)}/${n(ev.date)}`;
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(ev.t)+"&dates="+dates+"&details="+encodeURIComponent(ev.note||"Медкнижка");
}

    <div class="cal-legend"><span style="--c:var(--accent)"><i></i>приём</span><span style="--c:var(--positive)"><i></i>анализ</span><span style="--c:var(--warning)"><i></i>курс лекарства</span><span style="--c:var(--negative)"><i></i>симптом</span></div>

function indicatorBlock(){

  if(!cards.length) return window.__measLoading&&!window.__MEAS?`<div class="card muted">Собираю значения <span class="dots"><span></span><span></span><span></span></span></div>`:"";
  const fmt=v=>String(v).replace(".",",");

function flagByNorm(value,norm){
  const n=s=>parseFloat(String(s).replace(",","."));
  const v=n(String(value??"").replace(/\s/g,"").replace(/^[<>≤≥]/,"")), t=String(norm??"").replace(/\s/g,"").toLowerCase();
  if(!isFinite(v)||!t) return "";
  let m=t.match(/^(-?[\d.,]+)[-–—](-?[\d.,]+)$/); if(m) return v<n(m[1])?"ниже":v>n(m[2])?"выше":"норма";
  m=t.match(/^(?:до|<|≤|<=)(-?[\d.,]+)$/); if(m) return v>n(m[1])?"выше":"норма";
  m=t.match(/^(?:от|>|≥|>=)(-?[\d.,]+)$/); if(m) return v<n(m[1])?"ниже":"норма";
  return "";
}

async function loadPdfJs(){

  await new Promise((ok,err)=>{ const sc=document.createElement("script"); sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"; sc.onload=ok; sc.onerror=err; document.head.appendChild(sc); });

const canvasJpeg=c=>new Promise(ok=>c.toBlob(b=>ok(b),"image/jpeg",0.85));
async function shrinkImage(file){
  const img=await createImageBitmap(file); const k=Math.min(1,1600/Math.max(img.width,img.height));
  const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height); return canvasJpeg(c);
}
// → {text?, files:[пути картинок для модели], keep:[пути оригиналов для карточки]}
async function prepareDocs(fileList,say){
  const out={text:"",files:[],keep:[]};
  for(const f of [...fileList].slice(0,10)){
    if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){
      say("Открываю PDF…");
      out.keep.push(await uploadBlob(f,"blank.pdf"));
      const lib=await loadPdfJs(), doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;
      let txt=""; for(let i=1;i<=Math.min(doc.numPages,10);i++){ const tc=await (await doc.getPage(i)).getTextContent(); txt+=tc.items.map(x=>x.str).join(" ")+"\n"; }
      if(txt.replace(/\s/g,"").length>200){ out.text+=txt+"\n"; continue; }        // PDF с текстом — текстом
      for(let i=1;i<=Math.min(doc.numPages,10);i++){ const pg=await doc.getPage(i), vp=pg.getViewport({scale:1.6}), c=document.createElement("canvas");
        c.width=vp.width; c.height=vp.height; await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
        out.files.push(await uploadBlob(await canvasJpeg(c),"page.jpg")); }
    } else {
      say("Загружаю снимок…");
      const p=await uploadBlob(await shrinkImage(f),"photo.jpg"); out.files.push(p); out.keep.push(p);
    }
  }
  if(out.text) out.files=[];                                   // есть текст — картинки модели не нужны
  return out;
}

// ── Единый список дел: ближайшие записи + то, что требует внимания ──────────
// Сортировка одна: чем ближе дело, тем выше. Просроченное и бессрочное — сверху.
const MONTHS_RU=[["январ",0],["феврал",1],["март",2],["апрел",3],["ма",4],["июн",5],
  ["июл",6],["август",7],["сентябр",8],["октябр",9],["ноябр",10],["декабр",11]];
// точная дата в тексте срока (ТЗ-025 блок 3): «22.11.2026», «11.2026», «конец ноября 2026», «до марта 2027»; слова «не откладывать», «срочно», «идёт» — сегодня.
// Остальные слова («ближайшие недели», «осень 2026», «постоянно») — не дата, вернётся null. today — «ГГГГ-ММ-ДД», без него — сегодняшний день
function exactDays(str,today){
  if(!str) return null;
  const s=String(str).toLowerCase();
  const t=today?new Date(+today.slice(0,4),+today.slice(5,7)-1,+today.slice(8,10)):new Date(); t.setHours(0,0,0,0);
  const day=dt=>Math.round((dt-t)/86400000);
  let m=s.match(/(\d{1,2})[.](\d{1,2})[.](\d{4})/);   // 07.09.2026
  if(m) return day(new Date(+m[3],+m[2]-1,+m[1]));
  m=s.match(/(\d{1,2})[.](\d{4})/);                    // 08.2022
  if(m) return day(new Date(+m[2],+m[1]-1,1));
  m=s.match(/([а-яё]{3,})\s+(\d{4})/);                 // «декабрь 2026», «конец ноября 2026»
  if(m){ const hit=MONTHS_RU.find(([k])=>m[1].startsWith(k));
         if(hit){ const dd=/конц|конец/.test(s)?25:/серед/.test(s)?15:/начал/.test(s)?5:1;
                  return day(new Date(+m[2],hit[1],dd)); } }
  if(/не откладыв|срочно|сейчас|тем же заходом|идёт|идет/.test(s)) return 0;
  return null;
}
function whenDays(str,today){
  if(!str) return null;
  const e=exactDays(str,today); if(e!=null) return e;
  const s=String(str).toLowerCase();
  const t=today?new Date(+today.slice(0,4),+today.slice(5,7)-1,+today.slice(8,10)):new Date(); t.setHours(0,0,0,0);
  const day=dt=>Math.round((dt-t)/86400000);
  if(/эта недел|на этой недел/.test(s)) return 7;
  if(/ближайшие 2|ближайшие 3|ближайшие недел|ближайшие дни|\d\s*[–-]\s*\d\s*недел/.test(s)) return 21;
  if(/ближайший месяц|ближайшее время/.test(s)) return 30;
  if(/осен|зим|весн|лет[оа]/.test(s)) return 60;
  const m=s.match(/(\d{4})/); if(m) return day(new Date(+m[1],0,1));
  return null;
}
// ── План здоровья (ТЗ-025 блок 3): группы по срочности, статус словами, строка дела
function taskGroup(x,today){
  const dated=x.kind==="soon"||x.due===true||x.merged===true;
  const days=dated?exactDays(x.when,today):null;
  if(days==null) return {group:"nodate",status:"Срок уточнить",days:null};
  const booked=x.tag==="записан";
  if(days<0) return {group:"overdue",status:`Просрочено на ${-days} дн.`,days};
  if(days<=30) return {group:"soon",days,status:booked?"Записан":days===0?(/не откладыв|срочно|сейчас|тем же заходом|идёт|идет/i.test(String(x.when))?"Не откладывать":"Сегодня"):days===1?"Завтра":`Через ${days} дн.`};
  return {group:"later",days,status:booked?"Записан":days<=99?`Через ${days} дн.`:`Через ${Math.round(days/30)} мес.`};
}
// список дел → группы по порядку срочности; limit — сколько дел показать всего (самые срочные)
function planGroups(list,today,limit){
  const GI={overdue:0,soon:1,later:2,nodate:3};
  const rows=list.map(x=>Object.assign({x},taskGroup(x,today))).sort((a,b)=>GI[a.group]-GI[b.group]||(a.group==="nodate"?(a.x.p||99)-(b.x.p||99):a.days-b.days));
  const cut=limit?rows.slice(0,limit):rows;
  return [["overdue","Просрочено"],["soon","Ближайшие"],["later","Позже"],["nodate","Без точной даты"]].map(([g,title])=>({group:g,title,items:cut.filter(r=>r.group===g).map(r=>Object.assign(r.x,{_g:r}))})).filter(g=>g.items.length);
}
function ruDayMonth(t,days){ const RU_GEN=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"], d=new Date(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10)+days); const y=d.getFullYear()!==+t.slice(0,4)?" "+d.getFullYear():""; return `${d.getDate()} ${RU_GEN[d.getMonth()]}${y}`; }
function planSummary(list,today){
  const n=list.length, rows=list.map(x=>taskGroup(x,today)).filter(g=>g.days!=null&&g.days>=0).map(g=>g.days);
  const head=`${n} ${plural(n,"предстоящее действие","предстоящих действия","предстоящих действий")}`;
  return rows.length?`${head} · ближайшее — ${ruDayMonth(today,Math.min(...rows))}`:head;
}
// дата слева в строке: число и месяц или текст срока; без срока — «срока нет»
// три подписанные строки дат задачи: назначено · срок · основание срока (ТЗ-025 блок 4)
function taskDates(a){
  const d=String(a.d||"").trim(), due=String(a.due||"").trim(), why=String(a.due_why||"").trim();
  let assigned="";
  if(d){ const m=d.match(/^назначено\s+(.*)$/i), c=d.match(/^(?:тянется\s+)?с\s+(.*)$/i);
    assigned=m?"Назначено: "+m[1]:c?"Тянется с: "+c[1]:"Ранее: "+d; }
  return {assigned,due:due?"Срок: "+due:"",basis:due?(why?"Основание срока: "+why:"Основание срока не записано"):""};
}
// дата в начале строки: «22 ноя», «22 ноя 2027», слова срока как есть или «без срока»
function planDateText(x,today){
  const dated=x.kind==="soon"||x.due===true||x.merged===true, w=String(x.when||"").trim();
  const m=dated&&w.match(/(\d{1,2})[.](\d{1,2})[.](\d{4})/);
  if(m) return `${+m[1]} ${["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"][+m[2]-1]}${+m[3]!==+String(today||localDay()).slice(0,4)?" "+m[3]:""}`;
  return dated&&w?w:"без срока";
}
// цвет ярлыка действия: сдать — зелёный, записаться / записан — синий, остальное — серый
function planChipTone(tag){ const t=String(tag||"").toLowerCase(); return /сдать/.test(t)?"ok":/запис/.test(t)?"acc":"none"; }
function planRow(x,today){
  const g=x._g||Object.assign({x},taskGroup(x,today)), ts=taskState(cur,x.title), done=ts&&ts.s==="done";

    const has=(...v)=>!query||v.some(x=>String(x||"").toLowerCase().includes(q));
    const LVL={bad:"очень высокий",warn:"умеренный",ok:"низкий"};
    const risks=(d.risks||[]).filter(x=>has(x.r,x.why));
    const eps=(d.episodes||[]).filter(x=>has(x.dx,x.sym,x.tx));
    const contra=(d.contra||[]).filter(x=>has(x.q,x.doc,x.ok));
    const nothing=!d.risks&&!d.family&&!d.episodes&&!d.contra&&!d.preg&&!d.vac;
    m.innerHTML=nothing?`<div class="card"><div class="empty">По этому человеку анамнез ещё не заполнен</div></div>`:`
      ${d.family?`<div class="card"><h2>Наследственность</h2>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Кто</th><th>Что было</th></tr></thead><tbody>
        ${d.family.map(f=>`<tr><td style="white-space:nowrap"><b>${esc(f.who)}</b></td><td>${hl(f.what)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}

      ${risks.length?`<div class="card"><h2>Предрасположенность — ${risks.length} <span class="hint" tabindex="0" title="Оценка риска, а не диагнозы. Нажмите строку — откроется система" aria-label="Оценка риска, а не диагнозы. Нажмите строку — откроется система">?</span></h2>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Риск</th><th>К чему</th><th>На чём основан</th></tr></thead><tbody>
        ${risks.map(x=>`<tr ${x.sys?`class="row" data-sys="${x.sys}"`:""}>
          <td><span class="status status-${x.lvl}">${LVL[x.lvl]}</span></td>
          <td><b>${hl(x.r)}</b></td><td class="muted">${hl(x.why)}</td></tr>`).join("")}
        </tbody></table></div>
        ${d.risksNote?`<div class="note">${esc(d.risksNote)}</div>`:""}</div>`:""}

      ${d.preg?`<div class="card"><h2>Беременности и роды</h2>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th></th><th>Учёт</th><th>Роды</th><th>Осложнения</th><th>Исход</th><th>Ребёнок</th></tr></thead><tbody>
        ${d.preg.map(p=>`<tr><td><b>${esc(p.n)}</b></td><td class="muted">${esc(p.uch)}</td><td>${esc(p.rody)}</td>
          <td class="muted">${esc(p.osl)}</td><td><b>${esc(p.ish)}</b></td><td class="muted">${esc(p.reb)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}

      ${eps.length?`<div class="card"><h2>Дневник болезней — ${eps.length}</h2>

        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Начало</th><th>Конец</th><th>Что было</th><th>Симптомы</th><th>Лечение</th></tr></thead><tbody>
        ${eps.map(x=>`<tr ${x.sys?`class="row" data-sys="${x.sys}"`:""}>

      ${d.vac||d.past?`<details class="card"><summary>Вакцинация и перенесённое<span class="sum-cnt">${(d.vac?.length||0)+(d.past?.length||0)}</span></summary>
        ${d.vac?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Что</th><th>Когда</th><th></th></tr></thead><tbody>
        ${d.vac.map(x=>{const v=Array.isArray(x)?{v:x[0],d:"",note:x[1]}:x;
          return `<tr><td><b>${esc(v.v)}</b></td><td class="muted">${esc(v.d)}</td><td class="muted">${esc(v.note||"")}</td></tr>`}).join("")}

        ${d.past?`<h3>Перенесённое</h3><ul style="margin:0;padding-left:20px">
        ${d.past.map(p=>`<li style="margin-bottom:5px">${esc(p)}</li>`).join("")}</ul>`:""}</details>`:""}

      ${contra.length?`<div class="card"><h2>Противоречия в документах — ${contra.length} <span class="hint" tabindex="0" title="Выявлены при сверке архива. Указано, какой версии верить" aria-label="Выявлены при сверке архива. Указано, какой версии верить">?</span></h2>
        ${contra.map(x=>`<details ${x.lvl==="bad"?"open":""}>
          <summary><span class="status status-${x.lvl}">${x.lvl==="bad"?"существенное":"уточнение"}</span> ${hl(x.q)}</summary>
          <div style="margin-top:8px"><b>Как в документах:</b> <span class="muted">${hl(x.doc)}</span></div>
          <div style="margin-top:6px"><b>Что верно:</b> ${hl(x.ok)}</div>
        </details>`).join("")}</div>`:""}`;
  }

  // ── Страница пункта «требует внимания»: обоснование → доказательства → записи
  else if(tab==="task"&&taskIdx!=null&&d.attention[taskIdx]){
    const a=d.attention[taskIdx], o=a.sys?organOf(a.sys):null;
    const all=a.sys?DATA[cur].rec.filter(r=>r.sys===a.sys).sort((x,y)=>y.d.localeCompare(x.d)):[];
    const ser=a.sys?seriesOf(d).filter(s=>s.sys===a.sys):[];
    const by=t=>all.filter(r=>r.t===t&&!r.op);
    const ops=all.filter(r=>r.op);
    const goto=(lab,n,id)=>`<div class="kpi ${n?"is-link":"kpi--none"}" ${n?`data-goto="${id}"`:""}>
      <div class="kpi__lab">${lab}</div><div class="kpi__val">${n}</div></div>`;
    const blk=(l,ttl,id)=>l.length?`<div class="card"${id?` id="${id}"`:""}><h2>${ttl} <span class="muted" style="text-transform:none">— ${l.length}</span></h2>

    m.innerHTML=`
      <button class="back" data-t="home">← На главную</button>
      <div class="card">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
          <span class="status status-${a.st}">${labelOf(a)}</span>
        </div>
        ${(()=>{ const T=taskDates(a), L=[T.assigned,T.due,T.basis].filter(Boolean); return L.length?`<div class="muted taskdates" style="margin-bottom:8px">${L.map(esc).join("<br>")}</div>`:""; })()}

        ${(()=>{ const ts=taskState(cur,a.t), tm=new Date(Date.now()+864e5*14); const def=`${tm.getFullYear()}-${String(tm.getMonth()+1).padStart(2,"0")}-${String(tm.getDate()).padStart(2,"0")}`;
          return ts?`<div class="note" style="margin-top:12px">${ts.s==="done"?"Отмечено как готово — на главной не показывается.":"Напомню с "+ru(ts.until)+" — до этого на главной не показывается."}</div>
            <button class="btn btn-secondary" data-tsk="clear" style="margin-top:8px">Вернуть на главную</button>`
          :`<div class="row" style="margin-top:12px;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn btn-primary" data-tsk="done">Готово</button>
            <span class="muted">или напомнить с</span><input type="date" id="tskDate" value="${def}" aria-label="Напомнить с даты"><button class="btn btn-secondary" data-tsk="snooze">Напомнить</button></div>`; })()}
      </div>

      ${a.sys==="allerg"?allergyCard(d):""}
      ${a.facts?`<div class="card"><h2>На чём основано</h2>
        <ul style="margin:0;padding-left:20px">${a.facts.map(f=>`<li style="margin-bottom:6px">${esc(f)}</li>`).join("")}</ul>
      </div>`:""}

      ${a.fam&&d.family?`<div class="card"><h2>Семейный анамнез</h2>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Кто</th><th>Что было</th></tr></thead><tbody>
        ${d.family.map(f=>`<tr><td style="white-space:nowrap"><b>${esc(f.who)}</b></td><td>${esc(f.what)}</td></tr>`).join("")}
        </tbody></table></div></div>`:""}

      ${o?`<div class="card"><h2>Система: ${o.ic} ${esc(o.name)}</h2>
        <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
          <span class="status status-${o.st}">${ST[o.st]}</span>
          <span style="flex:1;min-width:220px">${esc(o.txt)}</span>
        </div>
        ${all.length?`<div class="kpis" style="margin-top:14px">
          ${goto("Записей",all.length,ops.length?"t-ops":by("lab").length?"t-lab":by("instr").length?"t-instr":"t-visit")}
          ${goto("Анализов",by("lab").length,"t-lab")}
          ${goto("Исследований",by("instr").length,"t-instr")}
          ${goto("Посещений",by("visit").length,"t-visit")}
        </div>`:`<div class="note" style="margin-top:12px">По этой системе в архиве нет ни одной записи — именно поэтому пункт и стоит в плане.</div>`}
      </div>`:""}

      ${ser.length?`<div class="card" id="t-ser"><h2>Динамика</h2>

      ${blk(by("lab"),"Анализы","t-lab")}
      ${blk(by("instr"),"Инструментальные исследования","t-instr")}
      ${blk(by("visit"),"Посещения врачей","t-visit")}`;
  }

  // ── Страница системы: график → анализы → исследования → посещения
  else if(tab==="sys"&&sysFilter){
    const o=organOf(sysFilter);
    const all=DATA[cur].rec.filter(r=>inSys(r,sysFilter)&&matches(r)).sort((a,b)=>b.d.localeCompare(a.d));
    const ser=seriesOf(d).filter(s=>isLnk(sysFilter)?false:s.sys===sysFilter);
    const ops=all.filter(r=>r.op);
    const by=t=>all.filter(r=>r.t===t&&!r.op);
    const goto=(lab,n,id)=>`<div class="kpi ${n?"is-link":"kpi--none"}" ${n?`data-goto="${id}"`:""}>
      <div class="kpi__lab">${lab}</div><div class="kpi__val">${n}</div></div>`;
    const blk=(l,ttl,note,id)=>l.length?`<div class="card"${id?` id="${id}"`:""}>
        <h2>${ttl} <span class="muted" style="text-transform:none">— ${l.length}</span></h2>
        ${note?`<div class="muted" style="font-size:13px;margin:-6px 0 10px">${note}</div>`:""}
        ${tableRows(l,{showSys:false})}</div>`:"";
    // сравнение анализов по датам
    const labs=by("lab");
    const names=[...new Set(labs.map(r=>r.title))];
    const cmp=names.length&&labs.length>names.length?(()=>{
      const dates=[...new Set(labs.map(r=>r.d))].sort().reverse();
      return `<div class="card"><h2>Сравнение по периодам</h2>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Показатель</th>${dates.map(x=>`<th>${ru(x)}</th>`).join("")}</tr></thead><tbody>
        ${names.map(nm=>`<tr><td><b>${esc(nm)}</b></td>${dates.map(dt=>{
          const c=labs.find(r=>r.title===nm&&r.d===dt);
          if(!c) return `<td><span class="muted">—</span></td>`;
          const mk=markVN(c.v,c.n);
          const col=mk?mk.c:statusColor(c.st);
          return `<td><b style="color:${col}"${mk?` title="${esc(mk.why)}"`:""}>${esc(c.v||"—")}</b></td>`;
        }).join("")}</tr>`).join("")}
        </tbody></table></div></div>`;})():"";
    m.innerHTML=`
      <button class="back" data-back="1">← Назад</button>
      <div class="card">
        <h2>${o?o.ic+" "+esc(o.name):(LNK[sysFilter]?LNK[sysFilter].ic+" "+esc(LNK[sysFilter].name):esc(sysFilter))}</h2>
        <div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap">
          <span class="status status-${o?o.st:'none'}">${o?ST[o.st]:""}</span>
          <span style="flex:1;min-width:220px">${o?esc(o.txt):""}</span>
        </div>
        <div class="kpis" style="margin-top:14px">
          ${goto("Всего записей",all.length,ops.length?"y-ops":by("lab").length?"y-lab":by("instr").length?"y-instr":"y-visit")}
          ${goto("Операций",ops.length,"y-ops")}
          ${goto("Анализов",by("lab").length,"y-lab")}
          ${goto("Исследований",by("instr").length,"y-instr")}
          ${goto("Посещений",by("visit").length,"y-visit")}
          ${goto("Рядов динамики",ser.length,"y-ser")}
          ${goto("Диагнозов",d.diagnoses.filter(x=>x.sys===sysFilter||x.lnk===sysFilter||(!!x.lnk&&incOf(sysFilter).includes(x.lnk))).length,"y-dx")}
          ${goto("Симптомов",symsFor(d,sysFilter).filter(x=>x.log.length).length,"y-sym")}
        </div>
      </div>
      ${sysFilter==="allerg"?allergyCard(d):""}
      ${blk(ops,"Операции и госпитализации","",'y-ops')}
      ${ser.length?`<div class="card" id="y-ser"><h2>Динамика</h2>
        ${ser.map(s=>`<h3>${esc(s.name)}<span class="muted">, ${esc(s.unit)}</span></h3>${chart(s)}`).join("")}</div>`:""}
      ${blk(by("lab"),"Анализы","Нажмите строку — история показателя и все значения этой сдачи",'y-lab')}
      ${cmp}
      ${blk(by("instr"),"Инструментальные исследования","",'y-instr')}
      ${blk(by("visit"),"Посещения врачей","",'y-visit')}
      ${all.length?"":`<div class="card"><div class="empty">По этой системе записей нет</div></div>`}
      ${(()=>{const SY=symsFor(d,sysFilter),withLog=SY.filter(x=>x.log.length);
        if(!SY.length) return "";
        const allLog=withLog.flatMap(x=>x.log);
        return `<div class="card" id="y-sym"><h2>Симптомы по этой системе <span class="muted" style="text-transform:none">— ${SY.length}</span> <span class="hint" tabindex="0" title="Что человек чувствовал при этих диагнозах. Нажмите симптом — все его записи и лекарства." aria-label="Что человек чувствовал при этих диагнозах. Нажмите симптом — все его записи и лекарства.">?</span></h2>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Симптом</th><th style="text-align:center">записей</th><th>последний раз</th><th>чем лечил</th><th></th></tr></thead><tbody>
        ${SY.map(x=>{const meds=x.log.length?medsOf([x.log[0]]).map(v=>v.name):[];
          return `<tr class="symlink" data-sym="${esc(x.n)}"><td><b>${esc(x.n)}</b>${x.cat.red?' <span class="red-dot">▲</span>':""}</td>
          <td style="text-align:center">${x.log.length?`<b>${x.log.length}</b>`:'<span class="muted">—</span>'}</td>
          <td class="muted">${x.log.length?x.log[0].d.split("-").reverse().join("."):"не отмечалось"}</td>
          <td class="muted">${x.log.length?(meds.length?medLinks(meds):"<span class='muted'>не лечил</span>"):"—"}</td>
          <td style="color:var(--accent);font-weight:600">→</td></tr>`}).join("")}
        </tbody></table></div>
        ${allLog.length?`<h3 style="margin-top:14px">Чем лечили по всей системе</h3>${medChips(allLog)}`:""}
        </div>`;})()}
      <div class="card" id="y-dx"><h2>Диагнозы по системе</h2>
        ${d.diagnoses.filter(x=>x.sys===sysFilter||x.lnk===sysFilter||(!!x.lnk&&incOf(sysFilter).includes(x.lnk))).length?
          `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Диагноз</th><th>МКБ-10</th><th>С года</th><th>Состояние</th></tr></thead><tbody>
          ${dxSort(d.diagnoses.filter(x=>x.sys===sysFilter||x.lnk===sysFilter||(!!x.lnk&&incOf(sysFilter).includes(x.lnk)))).map(x=>`<tr class="dxrow" data-sys="${esc(x.sys||"")}"><td><b>${esc(x.n)}</b></td>
          <td class="muted">${esc(x.c)}</td><td class="muted">${esc(x.y)}</td><td>${esc(x.s)}</td></tr>`).join("")}
          </tbody></table></div>`:`<div class="muted">Нет активных диагнозов</div>`}
      </div>`;
  }

  else{
    const list=recs(tab==="all"?null:tab), list2=tab==="lab"?recs("instr"):[];
    const ser=seriesOf(d).filter(s=>!sysFilter||sysIs(s.sys,sysFilter));
    const showCharts=(tab==="lab"||sysFilter)&&ser.length;
    const other=sysFilter?DATA[cur].rec.filter(r=>inSys(r,sysFilter)).length:0;
    const S=query?searchIn(cur):null;
    const others=query?Object.keys(DATA).filter(k=>k!==cur&&!lockNeeded(k)).map(k=>({k,n:searchIn(k).total})).filter(x=>x.n):[];
    const tile=(lab,n,id)=>`<div class="kpi ${n?"is-link":"kpi--none"}" ${n?`data-goto="${id}"`:""}>
      <div class="kpi__lab">${lab}</div><div class="kpi__val">${n}</div></div>`;
    m.innerHTML=`
      ${query?indicatorBlock():""}
      ${query?`<div class="card"><h2>Найдено по запросу «${esc(query)}» — ${S.total} <span class="hint" tabindex="0" title="Ищет в любом месте записи: в названии, в результате, в значении, в норме, во враче, в дате, а также в диагнозах, планах, обоснованиях и семейном анамнезе. Нажмите цифру — прокрутит к разделу." aria-label="Ищет в любом месте записи: в названии, в результате, в значении, в норме, во враче, в дате, а также в диагнозах, планах, обоснованиях и семейном анамнезе. Нажмите цифру — прокрутит к разделу.">?</span></h2>
        <div class="kpis">
          ${tile("Записей",S.rec.length,"s-rec")}
          ${tile("Диагнозов",S.dx.length,"s-dx")}
          ${tile("Разрешившихся",S.rs.length,"s-rs")}
          ${tile("В планах",S.at.length,"s-at")}
          ${tile("Систем",S.org.length,"s-org")}
          ${tile("Рядов динамики",S.ser.length,"s-ser")}
          ${tile("В карточке",S.kpi.length,"s-kpi")}
          ${tile("Родня",S.fam.length,"s-fam")}
          ${tile("Не сдавалось",S.nev.length,"s-nev")}
        </div>
        ${S.org.length?`<div style="margin-top:12px">${S.org.map(o=>`<span class="tag" data-sys="${o.sys}"
          style="cursor:pointer;font-size:13px;padding:4px 10px">${o.ic} ${esc(o.name)} →</span>`).join(" ")}</div>`:""}
        ${others.length?`<div class="note" style="margin-top:12px">Это же слово есть у других:
          ${others.map(x=>`<span class="tag" data-w="${x.k}" style="cursor:pointer;font-size:13px;padding:4px 10px">${DATA[x.k].short} — ${x.n} →</span>`).join(" ")}</div>`:""}
      </div>`:""}
      <div class="card" id="s-rec">
        <h2>${tab==="all"?"Лента событий":(query?"Записи":TABS.find(t=>t[0]===tab)[1])}${sysFilter?" · "+esc(sysName(sysFilter)):""} <span class="muted" style="text-transform:none">— ${tab==="all"&&!sysFilter?(tlKind==="cal"?"по дням":tlKindFilter(tlEvents(d),tlKind).length):list.length+list2.length}</span>${!query&&["visit","lab","instr"].includes(tab)?`<button class="btn btn-primary" id="recAdd" style="float:right;height:32px;font-size:13px">+ Добавить</button>`:""}</h2>
        ${tab==="visit"&&!query?`<div class="fld" style="margin:0 0 10px"><input id="visitQ" type="search" placeholder="Врач или болезнь" value="${esc(visitQ)}" autocomplete="off"></div>
          <div id="vtab">${visitsTable(list,d)}</div>`
        :`${tab==="all"&&!sysFilter?"":filterBar()}${tab==="lab"&&sysFilter?hpOrgCard(d,sysFilter):""}
        ${tab==="all"&&!sysFilter?`<div class="tabs tabs--scroll" id="tlKinds" style="padding:0 0 10px;background:none">${TL_FILTERS.map(([k,t])=>`<button data-tlk="${k}" class="tab${tlKind===k?" is-active":""}">${t}</button>`).join("")}</div>`+(tlKind==="cal"?calBody():timeline(d)):(tab==="lab"?labInstrHtml(list,list2):tableRows(list,{showType:tab==="all"}))}`}
        ${(!list.length&&!list2.length&&sysFilter&&other&&!String(sysFilter).startsWith("grp:"))?`<div style="text-align:center;margin-top:10px">
          <button class="btn btn-primary btn-block" style="max-width:320px" data-sys="${sysFilter}">Показать все ${other} записей системы →</button></div>`:""}
      </div>
      ${query?`
      ${S.ep.length?`<div class="card" id="s-ep"><h2>Болезни — ${S.ep.length}</h2><div class="tbl-wrap"><table class="tbl"><tbody>

document.getElementById("q").addEventListener("input",e=>{
  tlReset(); const was=query; query=e.target.value.trim();
  if(query&&!was) window.__preSearch={tab,symView};
  if(query){sysFilter=null;tab="all";}   // поиск всегда по всему архиву
  else if(was&&window.__preSearch){ tab=window.__preSearch.tab; symView=window.__preSearch.symView; window.__preSearch=null; }
  render();
});
const vEl=document.getElementById("ver"); if(vEl) vEl.textContent="сборка "+BUILD;
ovApply();

// ── Замок на карточку Дениса. Остальные открыты. Код запоминается на устройстве.
// Это ширма от чужого взгляда, а не защита: страница публичная, данные лежат в её тексте.
const LOCK_WHO="denis", LOCK_CODE="", LOCK_KEY="mk_open_denis";
function lockOpen(){ try{ return localStorage.getItem(LOCK_KEY)==="1" }catch(e){ return false } }
function lockNeeded(k){ return false }   // v2: доступ даёт код из ссылки
function lockCard(){
  return `<div class="popup gate" style="margin-top:36px"><div style="font-size:32px;text-align:center">🔒</div>
    <h3 class="t-h3" style="margin:4px 0 4px;text-align:center">${esc(DATA[LOCK_WHO].short)}</h3>
    <p class="t-text-s t-muted" style="margin:0 0 12px;text-align:center">Карточка закрыта кодом. На этом устройстве он запомнится — вводить каждый раз не нужно.</p>
    <input class="input" id="lockIn" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Код">
    <button class="btn btn-primary btn-block btn-lg" id="lockGo" style="margin-top:12px">Открыть</button>
    <div id="lockMsg" class="t-text-s t-muted" style="margin-top:9px;min-height:16px"></div>
  </div>`;
}
function lockBind(){
  const inp=document.getElementById("lockIn"), go=document.getElementById("lockGo"), msg=document.getElementById("lockMsg");
  if(!inp||!go||go.dataset.on) return;
  go.dataset.on="1";
  const check=()=>{
    if(inp.value.trim()===LOCK_CODE){ try{localStorage.setItem(LOCK_KEY,"1")}catch(e){}; render(); return }
    msg.innerHTML='<span style="color:var(--bad)">Код не подошёл</span>';
    inp.value=""; inp.focus();
  };
  go.addEventListener("click",check);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") check() });
  setTimeout(()=>inp.focus(),60);
}
if(lockNeeded(cur)) cur="anya";     // при первом заходе открываем то, что не под кодом
render();
if(window.__MK_KEY) editsPull().then(ch=>{ if(ch) render(); });   // правки записей с других устройств
if(window.__MK_KEY) entriesPull().then(ch=>{ if(ch) render(); });  // записи с сайта (анализ, визит, лекарство, заметка)

</script>
<script>
// Загрузчик v2: код доступа из ссылки (?k=…) → запомнить на устройстве → данные из Supabase → запустить медкнижку
(async () => {
  const SB_URL = "https://cuhplpukqhdfutcymtmv.supabase.co", SB_KEY = "sb_publishable_ILfqT6mCyHBOu6BVVRxHKQ_0bPQtNi3", KEY_LS = "mk2_key";
  let KEY = ""; try { KEY = localStorage.getItem(KEY_LS) || ""; } catch (e) {}
  const u = new URL(location.href), k = u.searchParams.get("k");
  if (k) { KEY = k; try { localStorage.setItem(KEY_LS, k); } catch (e) {} u.searchParams.delete("k"); history.replaceState(null, "", u.pathname + u.search + u.hash); }
  // приложение на экране (ТЗ-023 блок 3): регистрируем до проверки кода; на адресах предпросмотра веток не ставим
  if ("serviceWorker" in navigator && ["mk.opalinskiy.ru", "health-peach-five.vercel.app", "localhost"].includes(location.hostname))
    window.addEventListener("load", () => navigator.serviceWorker.register("/v2/sw.js", { scope: "/v2/" }).catch(() => {}));
  const main = document.getElementById("main");
  const n = v => v == null || v === "" ? null : Math.round(+v * 10) / 10;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const codeView = msg => {
    main.innerHTML = `<div class="popup gate" style="margin-top:40px">
      <h3 class="t-h3" style="margin:0 0 4px">Медкнижка</h3>
      <p class="t-text-s t-muted" style="margin:0 0 12px">Откройте на этом устройстве ссылку с кодом доступа или вставьте её ниже — дальше страница её запомнит. Скопировать ссылку можно в профиле на другом устройстве.</p>
      <input id="mkc" class="input" placeholder="Или вставьте ссылку или код сюда" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="mkpaste" class="btn btn-secondary btn-block" style="margin-top:8px">Вставить</button>
      <button id="mkgo" class="btn btn-primary btn-block btn-lg" style="margin-top:12px">Открыть</button>
      <div class="t-text-s" style="margin-top:8px;color:var(--text-negative)">${msg ? esc(msg) : ""}</div></div>`;
    document.getElementById("mkpaste").onclick = () => {
      if (!(navigator.clipboard && navigator.clipboard.readText)) return document.getElementById("mkc").focus();
      navigator.clipboard.readText().then(t => { document.getElementById("mkc").value = t; }).catch(() => document.getElementById("mkc").focus());
    };
    document.getElementById("mkgo").onclick = () => {
      const v = document.getElementById("mkc").value.trim().replace(/^.*[?&]k=/, "").replace(/[&#].*$/, "");
      if (!v) return; try { localStorage.setItem(KEY_LS, v); } catch (e) {} location.reload();
    };
  };
  if (!KEY) return codeView();
  const call = action => fetch(SB_URL + "/functions/v1/mk", { method: "POST",
    headers: { "Content-Type": "application/json", apikey: SB_KEY, "x-mk-key": KEY }, body: JSON.stringify({ action }) });
  // Копия данных лежит на устройстве (медкнижка, питание, симптомы). Есть копия — страница открывается сразу из неё,
  // а свежие данные приходят в фоне: если что-то изменилось, страница обновится сама (пока вы ничего не нажали) или
  // покажет кнопку «Обновить». Копии нет (первый запуск) — ждём базу и показываем заглушку-скелет.
  const CK = "mk_c_medbook", CD = "mk_c_diet", CS = "mk_c_sym";
  const rd = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const wr = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const cached = rd(CK), cDiet = rd(CD), cSym = rd(CS);
  const badKey = () => { try { localStorage.removeItem(KEY_LS); } catch (e) {} return codeView("Код не подошёл — откройте ссылку с кодом ещё раз."); };

  // свежие данные из базы: сначала дата обновления, полную медкнижку качаем, только если она изменилась
  const fetchAll = async () => {
    const [rmeta, rd2, rs] = await Promise.all([call("medbook_meta"), call("diet_days").catch(() => null), call("symptoms_list").catch(() => null)]);
    if (rmeta.status === 401) return { bad: true };
    const sym = rs && rs.ok ? await rs.json().catch(() => null) : null;
    const diet = rd2 && rd2.ok ? await rd2.json().catch(() => null) : null;
    const meta = await rmeta.json().catch(() => null);
    let j;
    if (cached && meta && meta.updated_at && cached.updated_at === meta.updated_at) j = { status: "ok", data: cached.data, updated_at: cached.updated_at };
    else {
      const r = await call("medbook"); if (r.status === 401) return { bad: true };
      j = await r.json();
    }
    return { j, diet, sym };
  };

  const start = (data, diet, sym) => {
    window.__MK_DATA = data;
    // питание по дням — из общей базы: дни по фото суммируются из приёмов пищи, остальные — из дневника
    try {
      const P = data.denis && data.denis.nutrition && data.denis.nutrition.prog;
      const rows = diet && diet.status === "ok" ? diet.days.filter(d => d.person === "denis") : [];
      if (P && P.macros && rows.length) P.macros.days = rows.map(d => [d.day, n(d.calories), n(d.protein_g), n(d.fat_g), n(d.carbs_g), n(d.salt_g)]);
    } catch (e) { /* не вышло — остаются дни из самой медкнижки */ }
    // журнал симптомов: то, что записано в книжке и лежит в базе, подмешиваем к записям самой медкнижки
    try {
      const rows = sym && sym.status === "ok" ? sym.rows : [];
      for (const r2 of rows) {
        const P = data[r2.person]; if (!P || !P.sym) continue;
        const log = P.sym.log = P.sym.log || [];
        const same = log.find(x => x.d === r2.occurred_on && x.n === r2.symptom);
        if (same) { if (!same.p && r2.reason) same.p = r2.reason; continue; }   // уже есть; повод берём из дубля, если у первой строки его нет
        log.push({ d: r2.occurred_on, n: r2.symptom, sys: r2.sys || "other", i: r2.intensity ?? null, v: r2.value_num ?? null,
          u: r2.unit || "", f: r2.feeling || "", m: r2.med || "", h: r2.helped || "", p: r2.reason || "" });
      }
      Object.values(data).forEach(P => P.sym && P.sym.log && P.sym.log.sort((a, b) => a.d < b.d ? 1 : -1));
    } catch (e) { /* не вышло — остаются записи из самой медкнижки */ }
    // для записи замеров в базу медкнижке нужны адрес, ключ проекта и код доступа
    window.__MK_URL = SB_URL; window.__MK_APIKEY = SB_KEY; window.__MK_KEY = KEY;
    const s = document.createElement("script");
    s.text = document.getElementById("mk-main").textContent;
    document.body.appendChild(s);
  };

  if (cached && cached.data) {
    let touched = false;
    ["pointerdown", "keydown", "touchstart"].forEach(ev => document.addEventListener(ev, () => { touched = true; }, { once: true, capture: true }));
    start(cached.data, cDiet, cSym);
    // фоновое обновление: ошибка сети не мешает, работаем с копией
    fetchAll().then(f => {
      if (f.bad) return badKey();
      if (!f.j || f.j.status !== "ok" || !f.j.data) return;
      const same = f.j.updated_at === cached.updated_at && JSON.stringify(f.diet) === JSON.stringify(cDiet) && JSON.stringify(f.sym) === JSON.stringify(cSym);
      if (same) return;
      wr(CK, { updated_at: f.j.updated_at, data: f.j.data }); wr(CD, f.diet); wr(CS, f.sym);
      let last = 0; try { last = +sessionStorage.getItem("mk_reload") || 0; } catch (e) {}
      if (!touched && Date.now() - last > 30000) { try { sessionStorage.setItem("mk_reload", Date.now()); } catch (e) {} location.reload(); return; }
      const bar = document.createElement("div");
      bar.setAttribute("style", "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;max-width:420px;margin:0 auto;padding:10px 14px;border-radius:14px;background:#080a0c;color:#f6f8f9;display:flex;gap:12px;align-items:center;justify-content:space-between;font:14px system-ui");
      bar.innerHTML = '<span>Есть новые данные</span><button style="border:0;border-radius:10px;padding:8px 14px;background:#199af0;color:#fff;font:inherit;cursor:pointer">Обновить</button>';
      bar.querySelector("button").onclick = () => location.reload();
      document.body.appendChild(bar);
    }).catch(() => {});
    return;
  }

  main.innerHTML = '<div class="popup" style="max-width:420px;margin:40px auto" aria-busy="true"><div class="loader"><div class="loader__ring" role="progressbar" aria-label="Загрузка"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><i style="--n:5"></i><i style="--n:6"></i><i style="--n:7"></i><i style="--n:8"></i><i style="--n:9"></i><i style="--n:10"></i><i style="--n:11"></i></div><p class="loader__title">Открываем медкнижку…</p><p class="loader__hint">В первый раз на этом устройстве чуть дольше</p></div></div>';
  let f;
  try { f = await fetchAll(); }
  catch (e) { main.innerHTML = '<div class="card" style="max-width:420px;margin:40px auto"><b>Нет связи.</b> Проверьте интернет и повторите.<div style="margin-top:12px"><button id="mkretry" class="btn btn-primary">Повторить</button></div></div>'; document.getElementById("mkretry").onclick = () => location.reload(); return; }
  if (f.bad) return badKey();
  const j = f.j;
  if (!j || j.status !== "ok" || !j.data) { main.innerHTML = '<div class="card">Данные медкнижки пока не загружены в базу. Попробуйте позже.</div>'; return; }
  wr(CK, { updated_at: j.updated_at, data: j.data }); wr(CD, f.diet); wr(CS, f.sym);
  start(j.data, f.diet, f.sym);
})();
</script>
