<style>
:root{
  /* токены оформления — как в референсе редизайна (ТЗ-001 блок 13) */
  --bg:#f4f6f9; --card:#fff; --ink:#1a1d26; --muted:#5b6474; --line:#e5e7eb;
  --ok:#065f46; --warn:#92400e; --bad:#b91c1c; --none:#9aa7b4;   /* тёмнее, чем в референсе: текст статусов на подкрашенном фоне держит AA */
  --okbg:#e6f6ef; --warnbg:#fdf3dd; --badbg:#fdeaea; --nonebg:#eef1f4;
  --primary:#2563eb; --primary-hover:#1d4ed8; --on-accent:#fff;
  --accent:var(--primary); --accentbg:#f0f5ff; --seg:#eef2f7; --seghover:#e2e8f0; --field:#f8fafc;
  --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(0,0,0,.1);
  --ease:cubic-bezier(.4,0,.2,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f141a;--card:#171e27;--ink:#e6edf3;--muted:#a3b1c0;--line:#2a3541;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --okbg:#16302250;--warnbg:#3a2f1050;--badbg:#3a1c1c50;--nonebg:#232c35;
  --primary:#60a5fa;--primary-hover:#93c5fd;--on-accent:#0b1220;
  --accentbg:#1b2a3d;--seg:#1f2833;--seghover:#2a3541;--field:#121922;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 4px 14px rgba(0,0,0,.55);
  --shadow-lg:0 8px 28px rgba(0,0,0,.6);}
}
:root[data-theme="dark"]{--bg:#0f141a;--card:#171e27;--ink:#e6edf3;--muted:#a3b1c0;--line:#2a3541;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --okbg:#16302250;--warnbg:#3a2f1050;--badbg:#3a1c1c50;--nonebg:#232c35;
  --primary:#60a5fa;--primary-hover:#93c5fd;--on-accent:#0b1220;
  --accentbg:#1b2a3d;--seg:#1f2833;--seghover:#2a3541;--field:#121922;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 4px 14px rgba(0,0,0,.55);
  --shadow-lg:0 8px 28px rgba(0,0,0,.6);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1120px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px;margin-bottom:16px}
h2{font:600 20px/26px var(--font);margin:0 0 14px;letter-spacing:-.3px;text-transform:none;color:var(--text-primary)}   /* как .t-h2 из Компоненты.html */
h3{font:600 16px/22px var(--font);margin:18px 0 8px;letter-spacing:-.3px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card.flash{outline:2px solid var(--accent);outline-offset:2px}
details.card{padding:16px;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:13px}
details.card>summary{font-size:15px;margin:0;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);
  cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▸";margin-left:auto;font-size:13px;transition:transform .15s ease;flex:0 0 auto}
details.card[open]>summary::after{transform:rotate(90deg)}
details.card[open]>summary{margin-bottom:14px}
summary .sum-cnt{font-weight:500;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted);opacity:.75}
.hitline{font-size:13px;color:var(--muted);margin-top:3px}
/* карта симптомов */
.strip{display:flex;gap:2px;align-items:flex-end;min-height:22px}
.cell{width:11px;height:20px;border-radius:2px;background:var(--nonebg);flex:0 0 auto}
.dcell{width:5px;height:18px;border-radius:1px;background:var(--nonebg);flex:0 0 auto}
.stripwrap{overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
.striprow{display:flex;align-items:center;gap:12px;padding:5px 0;border-bottom:1px solid var(--line);width:max-content;min-width:100%}
.striprow:last-child{border-bottom:0}
.striprow .nm{position:sticky;left:0;background:var(--card);width:190px;min-width:190px;font-size:13px;
  line-height:1.25;padding-right:10px;z-index:2;cursor:pointer}
.striprow .nm:hover{color:var(--accent)}
.axis{display:flex;gap:2px;font-size:10px;color:var(--muted)}
.axis span{width:11px;flex:0 0 auto;text-align:center}
.vsw{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 12px}
.vsw button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:7px;
  padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.vsw button.on{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--accentbg)}
.medchip{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:0 5px 5px 0;font-size:13px}
.medchip b{color:var(--accent)}
.medchip.go{cursor:pointer}
.medchip.go:hover{border-color:var(--accent);color:var(--accent)}
.medlink{color:var(--accent);cursor:pointer;border-bottom:1px dashed currentColor}
.medlink:hover{border-bottom-style:solid}
.addsym{border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:6px;
  width:22px;height:22px;line-height:1;font-size:15px;font-weight:700;cursor:pointer;margin-left:6px;vertical-align:-3px;padding:0}
.addsym:hover{border-color:var(--accent);background:var(--accentbg)}
.editep{color:var(--muted);font-size:13px}
.pend{color:var(--warn);font-size:11px;vertical-align:2px}
#ver{font-size:11px;color:var(--muted);margin-left:8px;white-space:nowrap}
.addform{max-width:100%}
.addform .fld{margin-top:14px}
.addform label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px}
.addform .hint{font-size:12px;color:var(--muted);margin:0 0 6px;line-height:1.45}
.addform input,.addform textarea{width:100%;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
  font:inherit;font-size:15px;background:var(--card);color:var(--ink)}
.addform input:focus,.addform textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.addform input#asInt{max-width:150px}
.addform .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.sugwrap{position:relative}
.sug{position:absolute;left:0;right:0;top:100%;z-index:60;background:var(--card);
  border:1px solid var(--line);border-radius:9px;margin-top:4px;max-height:320px;overflow:auto;-webkit-overflow-scrolling:touch;
  box-shadow:0 8px 24px rgba(0,0,0,.12);display:none}
.sug.on{display:block}
.sug div{padding:9px 12px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line)}
.sug div:last-child{border-bottom:0}
.sug div:hover,.sug div.pick{background:var(--accentbg);color:var(--accent)}
.sug b{color:var(--accent)}
.sug .sughd{padding:7px 12px 5px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;
  cursor:default;background:var(--card);position:sticky;top:0;border-bottom:1px solid var(--line)}
.sug .sughd:hover{background:var(--card);color:var(--muted)}
.sug .sugnone{color:var(--muted);cursor:default}
.sug .sugnone:hover{background:none;color:var(--muted)}
.sugwrap.btn2 input{padding-right:40px}
.sugbtn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;
  color:var(--muted);font-size:14px;cursor:pointer;border-radius:7px}
.sugbtn:hover{background:var(--accentbg);color:var(--accent)}
.addform .note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px;
  border-top:1px solid var(--line);padding-top:10px}
.ctx{background:var(--nonebg);border-radius:9px;padding:10px 12px;font-size:13px;line-height:1.5;margin:-2px 0 4px}
.ctx b{color:var(--ink)}
#sync{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:8px;
  padding:7px 13px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
#sync:hover{border-color:var(--accent);color:var(--accent)}
#sync[disabled]{opacity:.55;cursor:default}
.formlog{font-size:13px;line-height:1.7;max-height:52vh;overflow:auto;margin-top:10px}
.formlog .ok{color:var(--ok)} .formlog .er{color:var(--bad)} .formlog .wa{color:var(--warn)}
.eprow td{vertical-align:top}
.tag2{display:inline-block;background:var(--nonebg);border-radius:6px;padding:2px 8px;font-size:12px;margin:0 4px 4px 0}
.fwrap{overflow-x:auto;padding-bottom:4px}
.fbars{display:flex;gap:3px;align-items:flex-end;height:92px;width:max-content;min-width:100%}
.fbar{width:24px;flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.fbar i{display:block;border-radius:2px 2px 0 0;background:var(--accent);min-height:2px}
.fbar b{text-align:center;font-size:10px;color:var(--muted);font-weight:600;line-height:1.1;margin-bottom:2px}
.fbar.zero i{background:var(--nonebg);height:2px}
.faxis{display:flex;gap:3px;font-size:10px;color:var(--muted);margin-top:4px;width:max-content;min-width:100%}
.faxis span{width:24px;flex:0 0 auto;text-align:center}
.faxis span.jan{color:var(--ink);font-weight:700}
.yband{display:flex;gap:3px;width:max-content;min-width:100%;margin-top:3px}
.yband div{flex:0 0 auto;font-size:11px;color:var(--muted);font-weight:600;border-top:2px solid var(--line);
  padding-top:3px;text-align:center;overflow:hidden;white-space:nowrap}
.verdict{padding:9px 12px;border-radius:8px;font-size:14px;margin-top:10px}
.verdict.up{background:var(--badbg);color:var(--bad);font-weight:600}
.verdict.dn{background:var(--okbg);color:var(--ok)}
.verdict.flat{background:var(--nonebg);color:var(--muted)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.symlink{cursor:pointer}
.symlink:hover{background:var(--hov,rgba(127,127,127,.09))}
.red-dot{color:var(--bad);font-weight:700}
.trend-up{color:var(--bad);font-weight:600}
.trend-dn{color:var(--ok);font-weight:600}
.logline{padding:9px 0;border-bottom:1px solid var(--line)}
.logline:last-child{border-bottom:0}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;color:#fff}
@media(max-width:640px){.striprow .nm{width:130px;min-width:130px;font-size:12px}}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.s-ok{background:var(--okbg);color:var(--ok)} .s-warn{background:var(--warnbg);color:var(--warn)}
.s-bad{background:var(--badbg);color:var(--bad)} .s-none{background:var(--nonebg);color:var(--muted)}
.tag{display:inline-block;background:var(--accentbg);color:var(--accent);border-radius:6px;
  padding:1px 7px;font-size:12px;margin:1px 3px 1px 0}
.muted{color:var(--muted)}
.body-wrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
@media(max-width:780px){.body-wrap{grid-template-columns:1fr}}
.organ{cursor:pointer}
.organ circle{transition:r .12s}
.organ:hover circle.dot{r:23}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:5px}
.olist{display:flex;flex-direction:column;gap:7px;max-height:520px;overflow:auto}
.orow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:9px;
  background:var(--bg);cursor:pointer;border:1px solid transparent}
.orow:hover{border-color:var(--accent)}
.orow .ic{font-size:18px;line-height:1.2}
.orow b{display:block;font-size:14px}
.orow span{font-size:12.5px;color:var(--muted)}
.dot.dxrow{cursor:pointer}
.dxrow:hover{background:var(--hov,rgba(127,127,127,.09))}
.dxrow td:last-child{color:var(--acc,#2b5fd9);font-weight:600}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.empty{padding:26px;text-align:center;color:var(--muted)}
details{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
summary{cursor:pointer;font-weight:600}
.note{background:var(--warnbg);border-radius:9px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.src{font-size:12px;color:var(--muted);margin-top:10px}
mark{background:#ffe680;color:#000;border-radius:3px}
tr.row{cursor:pointer} tr.row:hover td{background:var(--accentbg)}
.back{border:0;background:var(--accentbg);color:var(--accent);padding:6px 12px;border-radius:99px;
  cursor:pointer;font:inherit;font-size:13px;font-weight:600;margin-bottom:12px}
.soon{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.nut-hero{display:grid;gap:14px;grid-template-columns:minmax(220px,1fr) minmax(240px,1.2fr);align-items:center;
  background:linear-gradient(135deg,var(--accentbg),var(--bg));border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:6px}
.nut-hero .big{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.02em}
.nut-hero .cap{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.nut-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin:8px 0 4px}
.nut-card{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--bg)}
.nut-card b{display:block;font-size:14px;margin-bottom:3px}
.nut-card span{font-size:12.5px;color:var(--muted);line-height:1.45}
.nut-card.good{border-left:4px solid var(--ok)}
.nut-card.bad{border-left:4px solid var(--bad)}
.nut-h{display:flex;align-items:center;gap:8px;font-size:15px;margin:24px 0 8px;font-weight:700;letter-spacing:-.01em}
.nut-h .ic{font-size:19px}
.nut-h .sub{font-weight:400;font-size:12.5px;color:var(--muted)}
.nut-meal{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.nut-meal b{color:var(--muted);font-weight:600}
.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.5px;cursor:pointer}
.chk input{margin-top:3px;width:16px;height:16px;flex:0 0 auto;accent-color:var(--accent)}
.chk.done span{text-decoration:line-through;opacity:.5}
.shop-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.shop-col{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.shop-col h4{margin:0 0 4px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.lockbox{max-width:320px;margin:36px auto;text-align:center}
.lockico{font-size:38px;margin-bottom:10px}
.lockbox h2{margin:0 0 4px;font-size:19px}
.lockbox p{margin:0 0 16px;font-size:13px}
.lockbox input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:17px;text-align:center;letter-spacing:.25em}
.lockbox button{width:100%;margin-top:9px;padding:11px;font-size:15px}
#lockMsg{margin-top:9px;font-size:12.5px;min-height:16px}
.nut-meal.edit{cursor:pointer;border-radius:7px;transition:background .15s}
.nut-meal.edit:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.nut-meal .pen{font-style:normal;opacity:0;margin-left:auto;padding-left:8px;color:var(--muted)}
.nut-meal.edit:hover .pen{opacity:1}
.mrow .grip{cursor:grab;color:var(--muted);user-select:none;width:22px;text-align:center}
.mrow.drag{opacity:.4}
.mrow.over td{border-top:2px solid var(--ink)}
.mcell{cursor:pointer}
.mcell:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.lnk{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font:inherit;font-size:12px}
.alts{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow:auto}
.ideas-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.ideas-tab{font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);cursor:pointer}
.ideas-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ideas-list{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto}
.idea{border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.idea.on{border-color:var(--ok)}
.idea-head{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.idea-btn{flex:0 0 auto;font-size:12.5px;padding:6px 10px;border:1px solid var(--accent);border-radius:8px;background:var(--card);color:var(--accent);cursor:pointer;white-space:nowrap}
.idea.on .idea-btn{background:var(--ok);border-color:var(--ok);color:#fff}
.idea summary{font-size:12px;color:var(--muted);cursor:pointer;margin-top:4px}
.alt{text-align:left;font-size:12.5px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.alt:hover{border-color:var(--ink)}
.frow{display:flex;gap:8px;align-items:center;margin-top:10px}
.tl-m>h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
  border-bottom:1px solid var(--line);padding-bottom:6px}
.tl-l>div{color:var(--muted)}
.ins-c{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.ins-p{font-size:13px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;font-family:inherit}
.ins-p:hover{border-color:var(--ink)}
.ins-p.on{border-color:var(--ink);background:var(--bg);font-weight:600}
.ins-sel{margin-top:4px}
.ins-t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:2px 0 8px}
.ins-top{display:flex;flex-direction:column;gap:8px}
.ins-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;
  padding:8px 10px;border:1px solid var(--line);border-radius:9px}
.ins-row .muted{font-size:11.5px}
.ins-v{font-size:13.5px;white-space:nowrap;text-align:right}
.ins-v .muted{white-space:normal;max-width:190px;display:block;margin-top:2px}
.ins-row.stale{opacity:.6;border-style:dashed}
.ins-row[data-rec]{cursor:pointer}
.linkbtn{background:none;border:0;padding:0;margin-left:4px;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}

  transition:box-shadow .25s var(--ease),transform .25s var(--ease)}

/* кнопки: отклик на нажатие */
button:active:not([disabled]){transform:scale(.96)}
/* подсказка «?» у заголовка блока */
.tip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;border-radius:50%;
  background:var(--seg);color:var(--muted);font-size:11px;font-weight:700;cursor:help;position:relative;vertical-align:1px;
  text-transform:none;letter-spacing:0;transition:background .2s var(--ease),color .2s var(--ease)}

  width:max-content;max-width:260px;background:#1a1d26;color:#fff;font-size:12px;font-weight:500;line-height:1.4;
  padding:7px 10px;border-radius:8px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;white-space:normal;z-index:30;
  transition:opacity .2s var(--ease),transform .2s var(--ease)}

/* появление блоков снизу по очереди — только при смене человека или вкладки; всё вместе ≤ 0,5 с */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.enter>*{animation:fadeUp .3s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.04s}

main.enter>*:nth-child(4){animation-delay:.12s}

/* текст на синем и на цветных пилюлях: в тёмной теме синий светлый — текст тёмный */
@media (prefers-color-scheme:dark){.pill[style*="var(--bad)"],.pill[style*="var(--warn)"],.pill[style*="var(--ok)"],.pill[style*="var(--accent)"]{color:#0b1220}}

/* Вес · тренд — по референсу */
.whead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}

/* микроанимации графиков — только при входе в раздел и переключении периода/недели (main.enter), ≤ 1 с */
@keyframes drawLine{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes popIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}

}

.heat-row.mrow2{grid-template-columns:130px 150px 1fr}.mrow2__med{line-height:1.35}@media(max-width:700px){.heat-row.mrow2{grid-template-columns:110px 1fr}.mrow2__med{grid-column:1/-1;order:3}}

/* карточки анализа и исследования: свёрнутые секции (ТЗ-010 блоки 12–13) */
.fold{border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:0;margin:2px 0 0;box-shadow:none}.fold:last-of-type{border-bottom:1px solid var(--line)}
.fold>summary{cursor:pointer;padding:11px 0;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:10px}
.fold>summary::-webkit-details-marker{display:none}.fold>summary::after{content:"＋";color:var(--muted);flex:none}.fold[open]>summary::after{content:"−"}
.fold-b{padding:0 0 12px;font-size:14px;line-height:1.5}

/*КОМП-НАЧАЛО*/
:root {
  /* ── Шрифт ── */
  --font: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;

  /* ── Текст ── */
  --text-primary:   #101518;
  --text-paragraph: #29343d;
  --text-secondary: #5c7384;
  --text-tertiary:  #9db0be;
  --text-accent:    #118cdf;
  --text-accent-2:  #ff1f78;
  --text-positive:  #1a9e32;
  --text-warning:   #fa5f05;
  --text-negative:  #ff293e;
  --text-on-dark:   #f6f8f9;

  /* ── Поверхности ── */
  --page:           #f3f5f7;   /* фон страницы */
  --card:           #ffffff;
  --surface-1:      #f3f5f7;   /* плитки внутри карточки, поля ввода */
  --surface-2:      #e7ebef;   /* вторичные кнопки, разделители */
  --surface-3:      #dae1e7;
  --surface-dark:   #080a0c;   /* чёрные кнопки и активная вкладка */
  --on-surface-dark:#f6f8f9;   /* текст на них */
  --accent:         #199af0;
  --accent-2:       #ff4791;
  --positive:       #1a9e32;
  --warning:        #fa5f05;
  --negative:       #ff293e;

  /* Мягкие фоны статусов (для плашек «норма / выше / ниже») */
  --positive-soft:  #e6f6e9;
  --warning-soft:   #fff0e5;
  --negative-soft:  #ffe9ec;
  --accent-soft:    #e5f3fd;

  /* ── Градиенты ── */
  --grad-accent: linear-gradient(75deg, #12c2f3, #2b8ced);
  --grad-pink:   linear-gradient(75deg, #fc95da, #ff1f78);
  /* фон шапки-«героя»: тёмно-синий → малиновый → розовый */
  --grad-hero:
    radial-gradient(60% 120% at 100% 100%, #ff4791 0%, transparent 60%),
    radial-gradient(50% 100% at 0% 100%, #1c2a8c 0%, transparent 60%),
    radial-gradient(40% 90% at 60% 0%, #d65bd9 0%, transparent 60%),
    linear-gradient(120deg, #2a2f8f, #b23fc4 55%, #ff6fa8);

  /* ── Радиусы ── */
  --r-xs: 6px;    /* мелкие метки */
  --r-s:  8px;    /* маленькая кнопка */
  --r-m:  10px;   /* обычная кнопка */
  --r-l:  12px;   /* поле, кнопка в шапке */
  --r-xl: 16px;   /* карточка-строка */
  --r-2xl: 20px;  /* карточка, плитка, окно */
  --r-pill: 9999px; /* вкладки, чипы */

  /* ── Тени: почти нет, только у всплывающих окон ── */
  --shadow-s: 0 4px 16px rgba(0,0,0,.06), 0 1px 4px rgba(0,0,0,.04);
  --shadow-m: 0 20px 48px rgba(0,0,0,.08);
  --shadow-popup: 0 16px 32px -8px rgba(0,0,0,.24);

  /* ── Отступы (шаг 4) ── */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  /* ── Ширина контента ── */
  --content: 700px;   /* колонка карточек на сайте-образце */
  --content-wide: 1100px;

  /* ── Движение ── */
  --ease-out: cubic-bezier(.22,1,.36,1);     /* появление, «мягкая посадка» */
  --ease-std: cubic-bezier(.4,0,.2,1);       /* наведение, смена цвета */
  --t-fast: 120ms;   /* нажатие */
  --t-base: 200ms;   /* наведение, вкладки */
  --t-slow: 500ms;   /* появление блоков */
  --t-data: 800ms;   /* шкала показателя, счётчик */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --text-primary:#f6f8f9; --text-paragraph:#ced7de; --text-secondary:#9db0be; --text-tertiary:#5c7384; --text-accent:#52baff; --text-positive:#24b23e; --text-warning:#fe7024; --text-negative:#ff3d51;
    --page:#101518; --card:#181f25; --surface-1:#212a31; --surface-2:#2b363f; --surface-3:#36434d;
    --surface-dark:#f6f8f9; --on-surface-dark:#101518;
    --positive-soft:#12331b; --warning-soft:#3a2410; --negative-soft:#3d1a1f; --accent-soft:#0f2d44;
    --shadow-popup: 0 16px 32px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  --text-primary:#f6f8f9; --text-paragraph:#ced7de; --text-secondary:#9db0be; --text-tertiary:#5c7384; --text-accent:#52baff; --text-positive:#24b23e; --text-warning:#fe7024; --text-negative:#ff3d51;
  --page:#101518; --card:#181f25; --surface-1:#212a31; --surface-2:#2b363f; --surface-3:#36434d;
  --surface-dark:#f6f8f9; --on-surface-dark:#101518;
  --positive-soft:#12331b; --warning-soft:#3a2410; --negative-soft:#3d1a1f; --accent-soft:#0f2d44;
}


.t-h2  { font: 600 20px/26px var(--font); }
.t-h3  { font: 600 16px/22px var(--font); }
.t-text-m  { font: 400 16px/24px var(--font); letter-spacing: -.3px; }
.t-text-s  { font: 400 14px/20px var(--font); letter-spacing: -.3px; }
.t-text-xs { font: 400 12px/16px var(--font); letter-spacing: -.25px; }
.t-bold    { font-weight: 600; }
.t-muted   { color: var(--text-secondary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  height: 40px; padding: 0 16px; border: 0; cursor: pointer;
  font: 600 14px/18px var(--font); letter-spacing: -.3px;
  border-radius: var(--r-m); transition: filter var(--t-base) var(--ease-std), transform var(--t-fast) var(--ease-std);
  text-decoration: none;
}
.btn:hover { filter: brightness(.94); }
.btn:active { transform: scale(.96); }
.btn-primary   { background: var(--accent); color: var(--text-on-dark); }
.btn-secondary { background: var(--surface-2); color: var(--text-primary); }
.btn-lg        { height: 48px; font-size: 16px; line-height: 20px; border-radius: var(--r-l); }
.tabs { display: flex; gap: var(--sp-1); }
.tab {
  height: 28px; padding: 0 10px; border: 0; cursor: pointer; background: transparent;
  font: 600 12px/14px var(--font); letter-spacing: -.25px; color: var(--text-primary);
  border-radius: var(--r-pill);
  transition: background var(--t-base) var(--ease-std), color var(--t-base) var(--ease-std);
}

.indet::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: var(--grad-accent); animation: indet 1.1s var(--ease-std) infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.stepper { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stepi { display: flex; align-items: center; gap: 8px; font: 600 13px/18px var(--font); color: var(--text-tertiary); transition: color var(--t-base); }
.stepi__n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font: 700 12px/1 var(--font); transition: background var(--t-base), color var(--t-base); }
.stepi.is-now { color: var(--text-primary); }
.stepi.is-now .stepi__n { background: var(--accent); color: var(--text-on-dark); animation: pulse-ring 1.4s ease-out infinite; }
.stepi.is-done { color: var(--text-positive); }
.stepi.is-done .stepi__n { background: var(--positive); color: #fff; animation: pop-in var(--t-base) var(--ease-out); }
.stepper__line { flex: 0 0 24px; height: 2px; border-radius: 1px; background: var(--surface-2); transition: background var(--t-slow); }
.stepper__line.is-done { background: var(--positive); }
@keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(25,154,240,.5); } 100% { box-shadow: 0 0 0 8px rgba(25,154,240,0); } }
.btn.is-done { background: var(--positive); color: #fff; animation: pop-in var(--t-base) var(--ease-out); }
.saved-card { display: grid; justify-items: center; gap: 4px; padding: 24px 16px; border-radius: var(--r-2xl); background: var(--positive-soft); text-align: center; color: var(--text-positive); animation: pop-in var(--t-slow) var(--ease-out) both; }
.saved-card b { font: 600 18px/24px var(--font); color: var(--text-primary); }
.saved-card span { font: 400 13px/18px var(--font); color: var(--text-secondary); }
.saved-card[hidden] { display: none; }
.loader { display: grid; justify-items: center; align-content: center; gap: 14px; padding: 32px 16px; text-align: center; }
.loader__ring { position: relative; width: 1em; height: 1em; font-size: 48px; }
.loader--sm .loader__ring { font-size: 30px; }
.loader__ring i { position: absolute; left: 50%; top: 0; width: .09em; height: .26em; margin-left: -.045em; border-radius: .05em; background: var(--positive); transform-origin: 50% .5em; transform: rotate(calc(var(--n) * 30deg)); opacity: .15; animation: seg-chase 1.2s linear infinite; animation-delay: calc(var(--n) * -.1s); }
@keyframes seg-chase { 0% { opacity: 1; } 100% { opacity: .15; } }
.loader__title { margin: 0; font: 600 16px/22px var(--font); color: var(--text-primary); }
.loader__hint { margin: -8px 0 0; font: 400 13px/18px var(--font); color: var(--text-secondary); }
.loader--page { position: fixed; inset: 0; z-index: 100; background: var(--page); transition: opacity var(--t-slow); }
.loader--page.is-hidden { opacity: 0; pointer-events: none; }
.loader--block { position: absolute; inset: 0; z-index: 5; background: color-mix(in srgb, var(--card) 80%, transparent); border-radius: inherit; }
.loader-host { position: relative; }
.dots span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--positive); animation: dots 1.1s ease-in-out infinite; }
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dots { 0%,80%,100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1.15); } }
@media (prefers-reduced-motion: reduce) {
.loader__ring i { animation: none; opacity: .6; }
.dots span { animation: none; opacity: .6; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

const SYNIDX=(()=>{const m=new Map();

  SYN.forEach(g=>g.forEach(v=>{const k=norm(v);put(k,g);const st=stem(k);if(st!==k)put(st,g)}));

// каждое слово запроса → [само слово, его основа, синонимы]; достаточно совпадения любого варианта
const toks=()=>{const q=query?norm(query).trim():"";
  if(!q)return[];
  // весь запрос целиком совпал с известным написанием — берём всю группу (ловит «общий анализ крови» → ОАК)
  if(SYNIDX.has(q))return[[...SYNIDX.get(q)]];
  return q.split(/\s+/).filter(Boolean).map(x=>{
    const st=stem(x),out=new Set([x]);
    if(st!==x)out.add(st);
    (SYNIDX.get(x)||SYNIDX.get(st)||[]).forEach(v=>out.add(v));

const inHay=(h,x)=>x.length>2?h.includes(x)

// границы совпадений; хвост слова дотягиваем, чтобы подсветка не рвала слово пополам
function marksOf(s){
  const t=toks();if(!t.length)return[];
  const h=norm(s),raw=[];
  t.forEach(v=>{const x=v.find(y=>inHay(h,y));if(!x)return;
    let i=h.indexOf(x);
    while(i>=0){let e=i+x.length;
      if(LET.test(h[e-1]||""))while(e<h.length&&LET.test(h[e]))e++;
      raw.push([i,e]);i=h.indexOf(x,i+x.length)}});
  if(!raw.length)return[];
  raw.sort((a,b)=>a[0]-b[0]);
  const m=[];
  for(const p of raw){const last=m[m.length-1];
    if(last&&p[0]<=last[1])last[1]=Math.max(last[1],p[1]);else m.push([p[0],p[1]])}
  return m;
}
const hl=(s)=>{s=String(s);const m=marksOf(s);if(!m.length)return esc(s);

function rich(t){
  if(!t) return "";
  const bold=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const out=[]; let ul=[];
  const flush=()=>{ if(ul.length){out.push(`<ul style="margin:8px 0;padding-left:20px">${ul.map(x=>`<li style="margin-bottom:5px">${x}</li>`).join("")}</ul>`); ul=[];} };
  String(t).split("\n").map(x=>x.trim()).filter(Boolean).forEach(line=>{
    const m=line.match(/^(?:•|—|-)\s+(.*)$/);
    if(m){ ul.push(bold(m[1])); return; }
    flush(); out.push(`<p style="margin:8px 0 0;font-size:15px">${bold(line)}</p>`);
  });
  flush();
  return out.join("");
}

// ── График
function chart(s){
  const W=620,H=190,P={l:44,r:14,t:14,b:26};
  const vals=s.pts.map(p=>p[1]);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(s.hi!=null){max=Math.max(max,s.hi);min=Math.min(min,s.hi)}
  if(s.lo!=null){min=Math.min(min,s.lo);max=Math.max(max,s.lo)}
  const pad=(max-min)*0.15||Math.abs(max*0.1)||1; min-=pad; max+=pad;
  const X=i=>P.l+i*(W-P.l-P.r)/Math.max(1,s.pts.length-1);
  const Y=v=>P.t+(max-v)*(H-P.t-P.b)/(max-min||1);
  let g="";
  // зона нормы (компонент chart__band / chart__ref из Компоненты.html)
  if(s.hi!=null){const y=Y(s.hi);g+=`<rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${Math.max(0,y-P.t)}" fill="var(--negative-soft)"/>
    <line class="chart__ref" x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" style="stroke:var(--negative)"/>
    <text class="chart__ref-label" x="${W-P.r}" y="${y-4}" text-anchor="end">порог ${String(s.hi).replace(".",",")}</text>`}
  if(s.lo!=null){const y=Y(s.lo);g+=`<line class="chart__ref" x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" style="stroke:var(--warning)"/>
    <text class="chart__ref-label" x="${W-P.r}" y="${y-4}" text-anchor="end">мин ${String(s.lo).replace(".",",")}</text>`}
  [min,(min+max)/2,max].forEach(v=>{g+=`<line class="chart__grid" x1="${P.l}" y1="${Y(v)}" x2="${W-P.r}" y2="${Y(v)}"/>
    <text class="chart__label" x="${P.l-6}" y="${Y(v)+3}" text-anchor="end">${(Math.round(v*100)/100).toString().replace(".",",")}</text>`});
  const line=s.pts.map((p,i)=>`${i?"L":"M"}${X(i)},${Y(p[1])}`).join(" ");
  g+=`<path class="chart__line" pathLength="1" d="${line}"/>`;
  s.pts.forEach((p,i)=>{
    const bad=(s.hi!=null&&p[1]>s.hi)||(s.lo!=null&&p[1]<s.lo);
    g+=`<circle class="chart__pt${bad?" bad":""}" style="animation-delay:${(.5+i*.06).toFixed(2)}s" cx="${X(i)}" cy="${Y(p[1])}" r="5"><title>${p[0]}: ${p[1]} ${s.unit}</title></circle>
    <text class="chart__label" x="${X(i)}" y="${Y(p[1])-11}" text-anchor="middle" style="font-weight:600;fill:var(--text-primary)">${String(p[1]).replace(".",",")}</text>
    <text class="chart__label" x="${X(i)}" y="${H-8}" text-anchor="middle">${p[0].slice(3)}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg></div>`;
}

// ── Силуэт с выносками
function silhouette(){
  const d=DATA[cur], W=560, BODY=520, GAP=68, LX=64, RX=496;
  const items=d.organs.slice().sort((a,b)=>a.y-b.y);

  // точка на теле: x 0–100 → поперёк корпуса, y 0–100 → от макушки до стоп
  const PX=o=>280+(o.x-50)*2.4;
  // голова и шея занимают мало места по вертикали — растягиваем их, иначе зубы уезжают в грудь
  const PYraw=o=>o.y<=22 ? 24+o.y*3.1 : 92+(o.y-22)*5.3;

  // сторону берём по самой анатомии, а не через одну — тогда линии не пересекаются
  const L=[],R=[];
  items.forEach(o=>(o.x<50?L:R).push(o));
  // выравниваем колонки: лишние отдаём с той стороны, где точка ближе к середине
  const move=(from,to)=>{
    let k=0,best=1e9;
    from.forEach((o,i)=>{const dist=Math.abs(o.x-50); if(dist<best){best=dist;k=i}});
    to.push(from.splice(k,1)[0]);
    to.sort((a,b)=>a.y-b.y);
  };
  while(L.length-R.length>1) move(L,R);
  while(R.length-L.length>1) move(R,L);

  const n=Math.max(L.length,R.length);
  const H=Math.max(BODY+40, n*GAP+56);
  const dy=Math.max(0,(H-BODY)/2);
  const PY=o=>dy+PYraw(o);

  // подписи ставим против своей точки, потом раздвигаем до минимального зазора
  const layout=(arr)=>{
    const out=arr.map(o=>({o,ly:PY(o)}));
    for(let i=1;i<out.length;i++) out[i].ly=Math.max(out[i].ly,out[i-1].ly+GAP);
    const over=out.length?out[out.length-1].ly-(H-34):0;
    if(over>0) out.forEach(x=>x.ly-=over);
    for(let i=out.length-2;i>=0;i--) out[i].ly=Math.min(out[i].ly,out[i+1].ly-GAP);
    out.forEach(x=>{if(x.ly<38)x.ly=38});
    return out;
  };
  const marks=[...layout(L).map(x=>({...x,lx:LX})),...layout(R).map(x=>({...x,lx:RX}))];

  const body=`<g fill="var(--line)" transform="translate(0,${dy})">
    <circle cx="280" cy="50" r="32"/>
    <rect x="267" y="76" width="26" height="22" rx="10"/>
    <rect x="224" y="92" width="112" height="228" rx="30"/>
    <rect x="199" y="106" width="27" height="142" rx="13"/>
    <rect x="334" y="106" width="27" height="142" rx="13"/>
    <rect x="238" y="306" width="35" height="198" rx="17"/>
    <rect x="287" y="306" width="35" height="198" rx="17"/>
  </g>`;

  const dots=marks.map(({o,lx,ly})=>{
    const c=`var(--${o.st==='none'?'none':o.st})`;
    const bx=PX(o), by=PY(o);
    const mid=lx<280?lx+40:lx-40;   // короткое колено у подписи, дальше прямая к точке
    return `<g class="organ" data-sys="${o.sys}">
      <title>${esc(o.name)} — ${ST[o.st]}. ${esc(o.txt)}</title>
      <path d="M${mid} ${ly} L${(mid+bx)/2} ${ly} L${bx} ${by}" fill="none" stroke="${c}" stroke-width="1.5" opacity=".45"/>
      <circle cx="${bx}" cy="${by}" r="6" fill="${c}"/>
      <circle class="dot" cx="${lx}" cy="${ly}" r="20" fill="var(--card)" stroke="${c}" stroke-width="3"/>
      <text x="${lx}" y="${ly+7}" text-anchor="middle" style="font-size:18px">${o.ic}</text>
      <text x="${lx}" y="${ly+35}" text-anchor="middle" style="font-size:12.5px;fill:var(--ink);font-weight:600">${esc(o.sh||o.name)}</text>
    </g>`}).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">${body}${dots}</svg>`;
}

// ── Карточка записи
// Подсветка числа в строке протокола: сравниваем с нормой, если она указана рядом.
// Норму пишут по-разному, поэтому разбираем несколько привычных форм.
function num(x){ return parseFloat(String(x).replace(",", ".")); }
function markVN(v,n){
  if(v==null||n==null||n==="") return null;
  const val=num(String(v).replace(/^\s*\d{1,2}\.\d{2}(?:\.\d{2,4})?\s*(?:[:,—–-]\s*)?/,"").match(/-?\d+[.,]?\d*/)?.[0]);
  if(isNaN(val)) return null;
  const t=String(n); let lo=null,hi=null;
  let m=t.match(/^\s*(?:до|не более|менее|<)\s*(\d+[.,]?\d*)/i);
  if(m) hi=num(m[1]);
  if(hi===null){ m=t.match(/^\s*(?:от|более|>)\s*(\d+[.,]?\d*)/i); if(m) lo=num(m[1]); }
  if(hi===null&&lo===null){ m=t.match(/(\d+[.,]?\d*)\s*[–—-]\s*(\d+[.,]?\d*)/); if(m){ lo=num(m[1]); hi=num(m[2]); } }
  if(hi===null&&lo===null) return null;
  const okHi=hi===null||val<=hi, okLo=lo===null||val>=lo;
  if(okHi&&okLo){
    const edge=(hi!==null&&val>=hi*0.95)||(lo!==null&&val<=lo*1.05);
    return edge?{c:"var(--warn)",why:"на границе нормы"}:{c:"var(--ok)",why:"в норме"};
  }
  const ref=hi!==null&&val>hi?hi:lo;
  return Math.abs(val-ref)/(Math.abs(ref)||1)<=0.1
    ? {c:"var(--warn)",why:"немного вне нормы"} : {c:"var(--bad)",why:"вне нормы"};
}
function markVal(txt){
  const t=String(txt);
  if(/⚠️|НЕ ВЫПОЛНЕН|не выполнен|НЕТ ДАННЫХ/i.test(t)) return {c:"var(--warn)",why:"требует внимания"};
  // дата в начале — не значение: «28.09.2025: 3,8 %» это про 3,8
  const body=t.replace(/^\s*\d{1,2}\.\d{2}(?:\.\d{2,4})?\s*(?:[:,—–-]\s*)?/,"");
  const cut=body.split(/при норме|норма/i);
  const head=cut[0], tail=cut.slice(1).join(" ");

  // значения до слова «норма»: «7,7 % / 0,40 ×10⁹/л» → [7.7, 0.40].
  // Степени десятки в единицах измерения числами не считаем.
  const clean=head.replace(/[х×xX*]\s*10\s*[\^]?\s*[\d⁰¹²³⁴⁵⁶⁷⁸⁹]*/g," ")
                  .replace(/10\s*[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g," ");
  const vals=(clean.match(/-?\d+[.,]?\d*/g)||[]).map(num).filter(x=>!isNaN(x));
  if(!vals.length) return null;

  // границы после: «0–5 % и 0,02–0,30» → [[0,5],[0.02,0.30]]; «до 0,44» → [[null,0.44]]
  const lims=[];
  if(tail){
    const parts=tail.split(/\s+и\s+|;|\s\/\s/);
    parts.forEach(pt=>{
      let m=pt.match(/(\d+[.,]?\d*)\s*[–—-]\s*(\d+[.,]?\d*)/);
      if(m){ lims.push([num(m[1]),num(m[2])]); return; }
      m=pt.match(/(?:до|не более|менее|<)\s*(\d+[.,]?\d*)/i);
      if(m){ lims.push([null,num(m[1])]); return; }
      m=pt.match(/(?:от|более|>)\s*(\d+[.,]?\d*)/i);
      if(m){ lims.push([num(m[1]),null]); return; }
    });
  }
  if(!lims.length){
    if(/выше нормы|ниже нормы|превыш|снижен|повышен|не соответствует/i.test(t)) return {c:"var(--bad)",why:"вне нормы"};
    if(/соответствует|в пределах (?:возрастной )?нормы|возрастной норме|без отклонений|без патологии|не изменен|не расширен|не увеличен/i.test(t))
      return {c:"var(--ok)",why:"в норме"};
    // «норма» сказана словом, без цифр: «отношение 1,3 — норма»
    if(/норм[аеы](?![а-яё])/i.test(t)&&!/не указан|нет данных|неизвестн|норма в документе/i.test(t))
      return {c:"var(--ok)",why:"в норме"};
    return null;
  }
  // пар должно быть поровну, иначе не угадываем, какое значение к какой норме
  let pairs;
  if(vals.length===lims.length){
    pairs=vals.map((v,i)=>[v,lims[i]]);
  } else if(lims.length===1){
    // одна норма на несколько чисел: берём то, что с ней одного порядка.
    // «3,8 % / 0,230 при норме до 0,440» — норма явно про 0,230, а не про 3,8
    const [lo,hi]=lims[0], ref=(hi!==null?hi:lo)||1;
    const near=vals.slice().sort((a,b)=>
      Math.abs(Math.log10((Math.abs(a)||1e-9)/Math.abs(ref)))-Math.abs(Math.log10((Math.abs(b)||1e-9)/Math.abs(ref))))[0];
    if(Math.abs(Math.log10((Math.abs(near)||1e-9)/Math.abs(ref)))>1.2) return null;  // ничего похожего — не гадаем
    pairs=[[near,lims[0]]];
  } else return null;

  let worst=null;
  for(const [v,[lo,hi]] of pairs){
    const okHi=hi===null||v<=hi, okLo=lo===null||v>=lo;
    let r;
    if(okHi&&okLo){
      const edge=(hi!==null&&v>=hi*0.95)||(lo!==null&&lo!==0&&v<=lo*1.05);
      r=edge?{c:"var(--warn)",why:"на границе нормы",rank:1}:{c:"var(--ok)",why:"в норме",rank:0};
    } else {
      const ref=hi!==null&&v>hi?hi:lo;
      const off=Math.abs(v-ref)/(Math.abs(ref)||1);
      r=off<=0.1?{c:"var(--warn)",why:"немного вне нормы",rank:1}:{c:"var(--bad)",why:"вне нормы",rank:2};
    }
    if(!worst||r.rank>worst.rank) worst=r;
  }
  return worst;
}

// ── Цвет статуса (ТЗ-010 блок 10): норма — зелёным, внимание и проблема — как раньше; без статуса — цвет текста
function statusColor(st){ return st==="ok"?"var(--ok)":st==="warn"?"var(--warn)":st==="bad"?"var(--bad)":"var(--ink)"; }
// первое предложение, не длиннее max; длинное режется по границе слова с «…»
function firstSentence(t,max){
  t=String(t==null?"":t).replace(/\s+/g," ").trim(); if(!t) return "";
  const m=t.match(/^.*?[.!?](?=\s|$)/); let s=m?m[0]:t;
  if(s.length>max){ s=s.slice(0,max+1); const k=s.lastIndexOf(" "); s=(k>0?s.slice(0,k):s.slice(0,max)).replace(/[\s,;:.—-]+$/,"")+"…"; }
  return s;
}
// оригиналы бланков за дату записи (ТЗ-010 блок 11): папка и имена; нет файла — null, блока нет

// ── Карточка анализа (ТЗ-010 блок 12): модель без разметки
function labCardModel(D,r){
  const RANK={bad:3,warn:2,ok:1,none:0};
  const all=(D.rec||[]).filter(x=>x.t==="lab"&&x.d===r.d).sort((a,b)=>(a.st==="ok")-(b.st==="ok")||String(a.title).localeCompare(String(b.title)));
  let same=all.filter(x=>x.sys===r.sys); if(!same.length) same=[r];
  const other=all.filter(x=>x.sys!==r.sys);
  const off=same.filter(x=>x.st!=="ok").length;
  const status=same.reduce((w,x)=>(RANK[x.st]||0)>(RANK[w]||0)?x.st:w,same[0].st||"none");
  const vals=same.map(x=>x.v).filter(Boolean);
  const hist=(D.rec||[]).filter(x=>x.t==="lab"&&x.title===r.title).sort((a,b)=>b.d.localeCompare(a.d));
  const pv=other.slice(0,3).map(x=>`${x.title} ${x.v||""} → ${ST[x.st]||ST.none}`.replace(/\s+→/," →").replace(/\s{2,}/," "));
  return {
    title:r.title, date:r.d, status, values:vals.slice(0,3), moreValues:Math.max(0,vals.length-3),
    summary:`${same.length} ${plural(same.length,"показатель","показателя","показателей")}`+(off?`, ${off} вне нормы`:", все в норме"),
    verdict:firstSentence(r.res,140),
    table:same.map(x=>({title:x.title,v:x.v||"",n:x.n||"",st:x.st||"none",rec:x})),
    related:other.length?{preview:pv.join(", ")+(other.length>3?` +${other.length-3}`:""),rows:other}:null,
    hist:hist.length>1?hist:null, baseline:r.t==="lab"&&hist.length===1,
    details:{place:r.place&&r.place!=="—"?r.place:"",norm:r.n||""}
  };
}
// «ЧСС 81 при норме 0,5–1,2 мс. PQ 150 мс (норма 90–160)» → по строке на цифру; запятая в числах не рвёт строку
function splitFigures(t){
  return String(t||"").split(/\.\s+(?=[A-ZА-ЯЁa-z])/).map(x=>x.trim().replace(/\.$/,"")).filter(Boolean);
}
// ── Карточка исследования (ТЗ-010 блок 13): из уже записанных разделов r.full, ничего не выводится заново
function instrCardModel(r){
  const F=(r.full||[]).filter(f=>Array.isArray(f)&&f[1]);
  const clean=l=>String(l).replace(/^[\s🟢🔴🟡⚠️]+/u,"").trim();
  const low=l=>clean(l).toLowerCase();
  const sentence=l=>{ const c=clean(l).toLowerCase(); return c.charAt(0).toUpperCase()+c.slice(1); };
  const used=new Set(), pick=re=>F.find(f=>!used.has(f)&&re.test(String(f[0]).toLowerCase()));
  const figs=F.find(f=>/^цифры/i.test(clean(f[0]))); if(figs) used.add(figs);
  const main=[]; F.forEach(f=>{ if(main.length<3&&(/^\s*🟢/u.test(f[0])||/^главное/i.test(clean(f[0])))){ used.add(f);
    main.push({title:clean(f[0]).replace(/^главное\s*[—–:-]?\s*/i,"")||"Главное",text:String(f[1])}); } });
  const act=(re,kind)=>{ const f=pick(re); if(!f) return null; used.add(f); return {kind,title:sentence(f[0]),text:String(f[1]),red:/🔴/u.test(f[0])}; };
  const dont=act(/не делать/,"dont"), watch=act(/следить/,"watch"), when=act(/срок|контрол/,"when");
  return {
    header:{title:r.title,date:r.d,st:r.st,verdict:firstSentence(r.res,160)},
    figures:figs?splitFigures(figs[1]):[], main,
    actions:{watch,dont,when},
    more:F.filter(f=>!used.has(f)).map(f=>({title:sentence(f[0]),text:String(f[1])}))
  };
}

// шапка и кнопка «Все записи» карточки (ТЗ-004 блок 4): у приёма с сайта нет статуса и системы — без «undefined» и «null»

function recGoAll(r){ const n=r.sys?sysName(r.sys):""; return n?`<button class="btn btn-primary btn-block" data-f="${r.sys}" data-close="1">Все записи: ${esc(n)} →</button>`:""; }
function openRec(i,showSer){
  const D=DATA[cur], r=D.rec[i]; if(!r)return;

  const rows=[
    ["Дата",ru(r.d)],...(r.t==="visit"?[["Дата следующего посещения",{html:(()=>{ plansLoad(); const cur0=nvDate(r); window.__nvRec={d:r.d,who:r.who||"",title:r.title||"",plan:(nvPlan(r)||{}).id||null};

    ["Врач / источник",r.who],["Учреждение",r.place&&r.place!=="—"?r.place:""],

  ].filter(x=>x[1]);

  // история этого же показателя
  const hist=D.rec.filter(x=>x.t==="lab"&&x.title===r.title).sort((a,b)=>b.d.localeCompare(a.d));
  // все показатели той же сдачи
  const panel=D.rec.filter(x=>x.t==="lab"&&x.d===r.d).sort((a,b)=>
    (a.st==="ok")-(b.st==="ok")||a.title.localeCompare(b.title));
  // в один день сдают кровь, мочу и кал — в таблице показателя это выглядело как «копрограмма в крови».
  // Свои показатели идут первыми, остальные материалы того же дня — отдельным блоком ниже
  const panelSame=panel.filter(x=>x.sys===r.sys), panelOther=panel.filter(x=>x.sys!==r.sys);
  const off=panelSame.filter(x=>x.st!=="ok").length;
  // остальные записи того же дня: приём, исследования, снимки — чтобы не терялся контекст визита
  const sameDay=D.rec.filter(x=>x!==r&&x.d===r.d&&!(r.t==="lab"&&x.t==="lab"));
  // График строим только по этому показателю: явный ряд → авторяд из истории.
  // Для не-лабораторных записей показываем ряды системы.
  const num=v=>{const x=parseFloat(String(v).replace(",",".").replace(/[^\d.\-]/g,""));return isNaN(x)?null:x};
  const sid=showSer||r.ser;
  let ser=[];
  if(sid) ser=D.series.filter(s=>s.id===sid);
  else if(r.t==="lab"){
    const pts=hist.slice().reverse().map(h=>[ru(h.d),num(h.v)]).filter(p=>p[1]!==null);
    if(pts.length>1) ser=[{id:"auto",name:r.title,unit:"",pts}];
  } else ser=D.series.filter(s=>s.sys===r.sys);
  const noSer=r.t==="lab"&&!ser.length;

  // общие куски карточек анализа и исследования (ТЗ-010 блоки 11–13)
  const fold=(sum,body)=>`<details class="fold"><summary>${sum}</summary><div class="fold-b">${body}</div></details>`;
  const fullRows=f=>`<div class="tbl-wrap"><table class="tbl"><tbody>${f.map(x=>Array.isArray(x)
    ?(()=>{const mk=markVal(x[2]?x[1]+" "+x[2]:x[1]);
      return `<tr><td class="muted" style="width:42%">${esc(x[0])}</td><td><b${mk?` style="color:${mk.c}" title="${esc(mk.why)}"`:""}>${esc(x[1])}</b>${x[2]?` <span class="muted" style="font-weight:400">${esc(x[2])}</span>`:""}</td></tr>`;})()
    :`<tr><td colspan="2">${esc(x)}</td></tr>`).join("")}</tbody></table></div>`;
  const origHtml=(()=>{   // оригиналы бланков: с папкой на Диске — ссылки на файлы, иначе только имя для поиска

// ===== карта симптомов =====
const MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function isoOf(dt){return dt.toISOString().slice(0,10)}
function shiftDays(n){const t=new Date();t.setHours(12,0,0,0);t.setDate(t.getDate()-n);return t}
// ── «Месяц» (ТЗ-010 блок 8): последние 30 дней, по строке на симптом, 30 клеток по дням
function dayShift(iso,n){ const x=new Date(iso+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function sevLevel(x){   // терпимо / мешает / сильно: тот же порог, что у кружков силы
  if(x.v!=null&&x.u==="°C") return x.v>=38.9?"bad":x.v>=37.5?"warn":"ok";
  if(x.i==null) return "ok";
  return x.i>=7?"bad":x.i>=4?"warn":"ok";
}
function sevWord(x){ return {ok:"терпимо",warn:"мешает",bad:"сильно"}[sevLevel(x)]; }
function monthRows(log,today,isRed){
  const from=dayShift(today,-29), pf=dayShift(today,-59), pt=dayShift(today,-30), by={};
  (log||[]).forEach(x=>{ if(x.d>=pf&&x.d<=today) (by[x.n]=by[x.n]||[]).push(x); });
  const rank={ok:1,warn:2,bad:3};
  return Object.keys(by).map(n=>{
    const L=by[n], cur=L.filter(x=>x.d>=from), prev=L.filter(x=>x.d>=pf&&x.d<=pt);
    if(!cur.length) return null;
    const cells=Array(30).fill("");
    cur.forEach(x=>{ const k=Math.round((Date.parse(x.d)-Date.parse(from))/864e5), lv=sevLevel(x);
      if(k>=0&&k<30&&(!cells[k]||rank[lv]>rank[cells[k]])) cells[k]=lv; });
    const ii=cur.map(x=>x.i).filter(v=>v!=null), avg=ii.length?Math.round(ii.reduce((a,b)=>a+b,0)/ii.length*10)/10:null;
    const days=new Set(cur.map(x=>x.d)).size;
    const trend=cur.length>prev.length?"up":cur.length<prev.length?"down":"same";
    const last=cur.map(x=>x.d).sort().pop();
    return {n,cells,days,avg,trend,last,red:!!(isRed&&isRed(n)),mid:avg!=null?intColor(avg):null};
  }).filter(Boolean).sort((a,b)=>b.last.localeCompare(a.last)||(b.red-a.red));
}
// симптом в Ленте (ТЗ-010 блок 9): сила словом и цветом, повод, температура, препараты ссылками, комментарий
function symTlLines(r,ep){
  const w=sevOf(r), out=[];
  const head=[ (w.t?`<span class="pill" style="background:${w.c}">${esc(sevWord(r))} · ${esc(w.t)}</span>`:""),
    (r.p?`<span class="muted">повод: ${esc(r.p)}</span>`:"") ].filter(Boolean).join(" ");
  if(head) out.push(head);
  if(ep&&ep.tmax&&r.n!=="Температура") out.push(`<span class="pill" style="background:${sevOf({v:ep.tmax,u:"°C"}).c}" title="максимум за эпизод">🌡 до ${String(ep.tmax).replace(".",",")} °C</span>`);
  if(r.m) out.push("💊 "+r.m.split(/,\s+/).map(t=>{ const one=t.trim().replace(/^(затем|и)\s+/i,""); if(!one) return "";
    const key=one.replace(/\s+[\d(].*$/,"").trim()||one; return `<span class="medlink" data-med="${esc(key)}">${esc(one)}</span>`; }).filter(Boolean).join(", ")+(r.h?` — ${esc(r.h)}`:""));
  if(r.f) out.push(esc(String(r.f).slice(0,140)));
  if(r.pend) out.push('<b style="color:var(--warn)">записано с телефона, ещё не разобрано</b>');
  return out;
}
function tlKindFilter(ev,kind){
  const K={sym:["sym"],visit:["visit"],lab:["lab"],instr:["instr"],med:["med","medend"],event:["event"]}[kind];
  return K?ev.filter(e=>K.includes(e.k)):ev;
}

const TSCALE=[[36.9,"#5b9bd5","норма"],[37.4,"#e0b400","субфебрильная"],[37.9,"#e07b1f","высокая субфебрильная"],

function sevOf(x){
  if(x&&x.v!=null&&x.u==="°C"){
    for(const [lim,c,t] of TSCALE) if(x.v<=lim)

  }

function monthCells(list,from){

// график веса: план, факт и ключевые даты. Пересчитывается при каждой отрисовке

const NUT_START=(DATA.denis&&DATA.denis.nutrition&&DATA.denis.nutrition.start)||"2026-09-03", NUT_GOAL=78, NUT_W0=85.4;

function nutPlan(){const out=[];let w=NUT_W0;
  for(let k=0;k<=20;k++){out.push(w); w-=k<2?0.15:k<4?0.3:0.45}
  return out}

// Сводка (вес, от старта, % к цели, темп, серия) — строкой над графиком, а не отдельными плашками.
const WRANGES=[["1m","Месяц"],["3m","3 мес"],["plan","Весь план"]];
function nutChart(){
  const plan=nutPlan(), F=nutLS("weight",[]).filter(f=>f.v);
  const rng=nutLS("wrange","3m");
  // на телефоне рисуем узкий график, а не ужимаем широкий — иначе подписи в 4 px
  const narrow=typeof innerWidth!=="undefined"&&innerWidth<640, W=narrow?400:900,H=narrow?250:230,L=34,R=12,T=20,B=34;
  const day=d=>Date.parse(String(d).slice(0,10)+"T12:00:00Z")/864e5;
  const wkOf=d=>(day(d)-day(NUT_START))/7, todayWk=wkOf(localDay());
  const lastWk=F.length?wkOf(F[F.length-1].d):todayWk;
  const [a,b]=rng==="1m"?[Math.max(0,lastWk-4.3),Math.max(lastWk,todayWk)+0.5]:rng==="plan"?[0,20]:[0,13];
  const inR=wk=>wk>=a-0.01&&wk<=b+0.01;
  const planPts=plan.map((v,k)=>({wk:k,v})).filter(p=>inR(p.wk));
  const fact=F.map(f=>({wk:wkOf(f.d),v:+f.v,d:f.d})).filter(f=>inR(f.wk));
  // в «Месяце» шкала по замерам и плану — иначе цель растягивает её и линия выглядит плоской
  const vals=[...planPts.map(p=>p.v),...fact.map(f=>f.v),...(rng==="1m"?[]:[NUT_GOAL])];
  const hi=Math.ceil(Math.max(...vals)+0.3), lo=Math.floor(Math.min(...vals)-0.3), goalIn=NUT_GOAL>=lo&&NUT_GOAL<=hi;
  const x=wk=>L+(wk-a)*(W-L-R)/(b-a), y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  const P=pts=>pts.map((p,k)=>`${k?"L":"M"}${x(p.wk).toFixed(1)} ${y(p.v).toFixed(1)}`).join(" ");
  const n=v=>String(v).replace(".",","), dm=d=>{const t=new Date(day(d)*864e5);return String(t.getUTCDate()).padStart(2,"0")+"."+String(t.getUTCMonth()+1).padStart(2,"0")};

    ${ch.length?`<div class="sleep-sum">Последняя неделя, ${wk(a.d)}: ${ch.join(", ")}.</div>`:""}

// F — замеры [{d,v}] по возрастанию даты; серия — дни подряд с замером, если последний сегодня или вчера
function heroData(F,start,w0,goal,today){
  const L=(F||[]).filter(x=>x&&x.v!=null&&x.d).sort((a,b)=>a.d<b.d?-1:1);
  if(!L.length) return null;
  const last=L[L.length-1], r1=v=>Math.round(v*10)/10, day=s=>Date.parse(s+"T12:00:00Z")/864e5;
  const have=new Set(L.map(x=>x.d));
  let streak=0;
  if(day(today)-day(last.d)<=1){ for(let t=day(last.d);have.has(new Date(t*864e5).toISOString().slice(0,10));t--) streak++; }
  const total=w0-goal, lost=w0-last.v, weeks=Math.max(1,day(last.d)-day(start))/7;
  return {last:last.v,date:last.d,fromStart:r1(last.v-w0),streak,
    pct:Math.max(0,Math.min(100,Math.round(lost/total*100))),left:r1(Math.max(0,last.v-goal)),pace:r1(lost/weeks)};
}

const WHOKEY={"Денис":"denis","Аня":"anya","Дима":"dima","Даня":"danya"};   // запасной список; из базы (people_list) перезаписывается
async function nutPullInbox(){
  const rows=await inboxRead(INBOX,false,7000);
  if(!rows||!rows.length) return false;
  const out=[];
  rows.forEach(r=>{
    const c=r.map(x=>String(x==null?"":x).trim());
    const last=[...c].reverse().find(x=>x!=="");
    if(last!=="нет") return;                       // уже перенесено или отменено
    const who=WHOKEY[c[1]]; if(!who) return;
    const d=String(c[3]||c[0]).slice(0,10);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    const n=c[5]||c[4]; if(!n) return;
    const i=parseInt(c[6],10);
    out.push({who,d,n,i:isFinite(i)?i:null,f:c[7]||""});
  });
  const before=JSON.stringify(nutLS("inbox",[]));
  nutSET("inbox",out);
  return JSON.stringify(out)!==before;
}

  });
}

function ovApply(){
  const o=ovLoad(); let dirty=false;
  for(const k of Object.keys(DATA)){
    const S=DATA[k].sym; if(!S) continue;
    (S.ep||[]).forEach(e=>{
      if(e._base){ e.dx=e._base; delete e._base; delete e.pending; }   // откатываем прошлое наложение
      const nm=o.ren[e.id]; if(!nm) return;
      if(e.dx===nm){ delete o.ren[e.id]; dirty=true; return; }   // уже в реестре — наложение не нужно
      if(!e._base) e._base=e.dx;
      e.dx=nm; e.pending=1;
    });
  }
  // Сначала убираем прошлые наложения из данных, иначе они примутся за реестр
  // и наложение сотрёт само себя при следующей перерисовке.
  for(const k of Object.keys(DATA)){
    const S=DATA[k].sym; if(!S) continue;
    // журнал собираем заново из исходного: правки записей (ТЗ-002 блок 5) накладываются поверх него, а не поверх прошлого наложения
    if(S.log){ if(!S._base) S._base=S.log.filter(x=>!x.pending&&!x.edited); S.log=S._base.slice(); }
    if(S.ep){ if(!S._baseEp) S._baseEp=S.ep.filter(x=>!x.pending&&!x.edited); S.ep=S._baseEp.map(x=>Object.assign({},x)); }
  }
  o.eps=(o.eps||[]).filter(e=>{
    const S=(DATA[e.who]||{}).sym; if(!S) return false;
    if((S.ep||[]).some(x=>x.d1===e.d1&&x.dx===e.dx)){ dirty=true; return false; }   // доехало до реестра
    S.ep.push({id:e.id,d1:e.d1,d2:e.d2||"",dx:e.dx,as:"",ab:e.ab?1:0,
      sym:e.sym||"",t:e.t||"",tmax:null,pending:1,rx:[]});
    S.ep.sort((x,y)=>y.d1.localeCompare(x.d1));
    return true;
  });
  o.add=(o.add||[]).filter(a=>{
    const S=(DATA[a.who]||{}).sym; if(!S) return false;
    // запись с таким названием могла быть переименована правкой («Насморк» → «Кашель, сопли» в одной форме): тогда она не дубль
    const renamed=(o.recEdits||[]).some(x=>x.who===a.who&&x.rec&&x.key&&x.key.d===a.d&&x.key.n===a.n&&(x.key.p||"")===(a.p||"")&&x.rec.n!==a.n);
    if(!renamed&&(S.log||[]).some(x=>x.d===a.d&&x.n===a.n&&(x.p||"")===(a.p||""))){ dirty=true; return false; }
    S.log.push({d:a.d,n:a.n,sys:a.sys||"other",i:a.i??null,v:null,u:"",
      f:a.f||"",m:a.m||"",h:"",p:a.p||"",pending:1,aid:addKey(a)});
    S.log.sort((x,y)=>y.d.localeCompare(x.d));
    return true;
  });
  for(const k of Object.keys(DATA)){
    const S=DATA[k].sym; if(!S||!S.ep) continue;
    const AE=autoEps(S,k,localDay()); if(AE.length){ S.ep.push(...AE); S.ep.sort((x,y)=>y.d1.localeCompare(x.d1)); }
    const EE=(o.epEdits||[]).filter(x=>x.who===k).sort((a,b)=>(a.ts||0)-(b.ts||0));
    if(EE.length) S.ep=applyEpEdits(S.ep,EE);
    for(const e of S.ep){ const r=(o.rxSet||{})[k+"|"+e.id]; if(r) e.rx=r.list; }
  }
  for(const k of Object.keys(DATA)){
    const S=DATA[k].sym; if(!S||!S.log) continue;
    const E=(o.recEdits||[]).filter(x=>x.who===k).sort((a,b)=>(a.ts||0)-(b.ts||0));
    if(E.length){ S.log=applyRecEdits(S.log,E); S.log.sort((x,y)=>y.d.localeCompare(x.d)); }
  }
  for(const k of Object.keys(DATA)){   // периоды симптомов — днями до сегодня (открытые продолжаются сами)
    const S=DATA[k].sym; if(!S||!S.log) continue;
    const ps=(PERIODS||[]).filter(x=>x.person===k); if(!ps.length) continue;
    const t=localDay(); ps.forEach(x=>S.log.push(...periodEntries(x,t)));
    S.log.sort((x,y)=>y.d.localeCompare(x.d));
  }
  if(dirty) ovSave(o);
}

const SYMCHAT={};   // ключ темы → {open, rows, busy, loaded}

// ответ врача: **жирное**, таблицы |…|, списки «1.» и «-», номера источников [1] — мелко
function mdLite(text){
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<i>$2</i>").replace(/\[(\d{1,2})\]/g,'<sup class="muted">[$1]</sup>');
  const L=String(text||"").replace(/\r/g,"").replace(/^---[\s\S]*?\n---\n/,"").split("\n"), out=[]; let i=0;
  while(i<L.length){
    const l=L[i];
    if(/^\s*\|/.test(l)){ const rows=[]; while(i<L.length&&/^\s*\|/.test(L[i])){ rows.push(L[i]); i++; }
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const body=rows.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)); if(!body.length) continue;
      out.push(`<div class="tbl-wrap"><table class="tbl"><thead><tr>${cells(body[0]).map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r=>`<tr>${cells(r).map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); continue; }

// Подсказки по любой части слова: «бол» находит и «Головная боль», и «Боль в горле».
// Родной datalist ищет только по началу и на телефоне часто молчит.
// Лекарства для подсказки (ТЗ-002, блок 3): сначала то, что давали этому человеку — чаще давали выше,
// при равенстве свежее выше, — потом справочник по алфавиту без повторов. «пульмикорт» и «Пульмикорт» — одно.
function medGroups(S,ref){
  const key=t=>String(t).toLowerCase().replace(/ё/g,"е").replace(/[\s-]+/g,""), cnt={}, last={}, name={};   // «Аква Марис» = «Аквамарис»
  (S&&S.log||[]).forEach(x=>{ if(!x.m) return;
    x.m.split(/,\s+/).forEach(t=>{const one=t.trim().replace(/^(затем|и)\s+/i,"");
      const k=(one.replace(/\s+[\d(].*$/,"").trim())||one; if(!k) return;
      const id=key(k); if(!name[id]||/^[А-ЯЁA-Z]/.test(k)&&!/^[А-ЯЁA-Z]/.test(name[id])) name[id]=k;
      cnt[id]=(cnt[id]||0)+1; if(!last[id]||String(x.d)>last[id]) last[id]=String(x.d||"");});});
  const ids=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||last[b].localeCompare(last[a])||name[a].localeCompare(name[b],"ru"));
  const other=Object.keys(ref||{}).filter(k=>!cnt[key(k)]).sort((a,b)=>a.localeCompare(b,"ru"));
  return {mine:ids.map(id=>name[id]), other};
}
function medNames(S){ const g=medGroups(S,typeof MEDREF!=="undefined"?MEDREF:{}); return [...g.mine,...g.other]; }
// отбор подсказок: по любой части слова, ё = е, без ограничения числа строк
function sugFilter(items,q){
  const norm=t=>String(t).toLowerCase().replace(/ё/g,"е"), n=norm(String(q||"").trim());
  return n?items.filter(x=>norm(x).includes(n)):items.slice();
}
// разделы подсказки лекарств для человека: «Давали Дане», «Из справочника»

function attachSuggest(inputId,items,opt){
  const inp=document.getElementById(inputId); if(!inp) return;
  inp.removeAttribute("list");
  const wrap=document.createElement("div"); wrap.className="sugwrap";
  inp.parentNode.insertBefore(wrap,inp); wrap.appendChild(inp);
  const box=document.createElement("div"); box.className="sug"; wrap.appendChild(box);
  let idx=-1, shown=[];
  const norm=t=>String(t).toLowerCase().replace(/ё/g,"е");
  const multi=!!(opt&&opt.multi), groups=opt&&opt.groups;
  if(groups){                                  // кнопка ▾ — открыть список целиком
    wrap.classList.add("btn2");
    const b=document.createElement("button"); b.type="button"; b.className="sugbtn"; b.setAttribute("aria-label","Показать весь список");
    b.textContent="▾"; wrap.appendChild(b);
    b.addEventListener("mousedown",e=>e.preventDefault());
    b.addEventListener("click",()=>{ if(box.classList.contains("on")) box.classList.remove("on"); else { inp.focus(); draw(); } });
  }
  const segs=()=>inp.value.split(",");
  const lastSeg=()=>multi?segs()[segs().length-1].trim():inp.value.trim();
  const draw=()=>{
    const q=norm(lastSeg());
    if(opt&&opt.minChars&&q.length<opt.minChars){ box.classList.remove("on"); return; }
    const hl=x=>{const p=norm(x).indexOf(q);
      return (q&&p>=0)?esc(x.slice(0,p))+"<b>"+esc(x.slice(p,p+q.length))+"</b>"+esc(x.slice(p+q.length)):esc(x);};
    if(groups){
      const G=groups.map(g=>({t:g.t,items:sugFilter(g.items,q)})).filter(g=>g.items.length);
      shown=G.flatMap(g=>g.items);
      let i=0;
      box.innerHTML=shown.length?G.map(g=>`<div class="sughd">${esc(g.t)}</div>`
        +g.items.map(x=>{const j=i++; return `<div data-i="${j}" class="${j===idx?"pick":""}">${hl(x)}</div>`;}).join("")).join("")
        :`<div class="sugnone">Нет в списке — впишите как есть</div>${lastSeg().length>=3?`<div class="sugadd" data-newmed="1">＋ Добавить «${esc(lastSeg())}» — нейросеть заполнит справку</div>`:""}`;
      box.classList.add("on"); return;
    }
    shown=sugFilter(items,q);
    if(!shown.length){ box.classList.remove("on"); return; }
    box.innerHTML=shown.map((x,i)=>{
      const p=norm(x).indexOf(q);
      const html=(q&&p>=0)?esc(x.slice(0,p))+"<b>"+esc(x.slice(p,p+q.length))+"</b>"+esc(x.slice(p+q.length)):esc(x);
      return `<div data-i="${i}" class="${i===idx?"pick":""}">${html}</div>`;
    }).join("");
    box.classList.add("on");
  };
  const pick=v=>{
    if(multi){
      const p=segs(); p[p.length-1]=" "+v;
      inp.value=p.join(",").replace(/^\s+/,"")+", ";
    } else inp.value=v;
    inp.dispatchEvent(new Event("input",{bubbles:true}));   // форма узнаёт выбранное: иначе запоминались только набранные буквы («Пу» вместо «Пульмикорт»)
    box.classList.remove("on"); idx=-1; inp.focus();
    if(multi) setTimeout(draw,0);          // сразу предлагаем следующее
  };
  inp.addEventListener("input",()=>{ idx=-1; draw(); });
  inp.addEventListener("focus",draw);
  inp.addEventListener("keydown",e=>{
    if(!box.classList.contains("on")) return;
    if(e.key==="ArrowDown"){ idx=Math.min(idx+1,shown.length-1); draw(); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ idx=Math.max(idx-1,0); draw(); e.preventDefault(); }
    else if(e.key==="Enter"&&idx>=0){ pick(shown[idx]); e.preventDefault(); }
    else if(e.key==="Escape"){ box.classList.remove("on"); }
  });
  box.addEventListener("mousedown",e=>{ const ad=e.target.closest("[data-newmed]");
    if(ad){ e.preventDefault(); const typed=lastSeg(); box.classList.remove("on"); toast(`Ищу справку по «${esc(typed)}»…`);
      medAdd(typed).then(r=>{ if(r.ok){ pick(r.name); toast(`Добавлено: «${esc(r.name)}»`);
          wrap.parentNode.querySelectorAll(".medinfo-new").forEach(x=>x.remove());
          wrap.insertAdjacentHTML("afterend",`<div class="medinfo-new">${r.html||""}</div>`); }
        else toast(r.unknown?`Такого лекарства не нашёл — проверьте название «${esc(typed)}». Можно оставить как есть`:r.offline?"Нужен вход по ссылке с кодом":"Не получилось, попробуйте ещё раз"); });
      return; }
    const d=e.target.closest("[data-i]");
    if(d){ e.preventDefault(); pick(shown[+d.dataset.i]); } });
  document.addEventListener("click",e=>{ if(!wrap.contains(e.target)) box.classList.remove("on"); });
}

const today0=()=>new Date().toISOString().slice(0,10);

// форма: свободный симптом, без привязки к болезни
// «Кашель, сопли» → ["Кашель","Сопли"] (ТЗ-004 блок 2): каждый симптом — своя запись
// синонимы приводятся к названию из справочника симптомов: «Сопли» и «Насморк» — один симптом
const SYM_SYN={"сопли":"Насморк","сопля":"Насморк","течёт из носа":"Насморк","течет из носа":"Насморк"};
function symNames(text){
  const seen=new Set();
  return String(text||"").split(/[,;]+/).map(x=>x.trim()).filter(Boolean)
    .map(x=>x[0].toUpperCase()+x.slice(1)).map(x=>SYM_SYN[x.toLowerCase()]||x).filter(x=>{ const k=x.toLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
}
// ── Болезнь — центр истории (ТЗ-004 блоки 5–8, 11). Болезнь = эпизод sym.ep: начало, конец, симптомы, приёмы, лекарства ──
function plural(n,one,few,many){ const a=n%10,b=n%100; return a===1&&b!==11?one:a>=2&&a<=4&&(b<10||b>=20)?few:many; }
function epSpan(ep,today){
  const days=rxDays(ep.d1,ep.d2||today);
  return ep.d2?{open:false,days,text:`длилась ${days} ${plural(days,"день","дня","дней")}`}:{open:true,days,text:`идёт ${days}-й день`};
}
// «Круп (J05.0, …)» и «круп» — одна болезнь: без регистра, кода МКБ и пояснений в скобках
function sameIll(a,b){
  const k=x=>String(x||"").toLowerCase().replace(/ё/g,"е").replace(/\(.*$/,"").replace(/[^a-zа-я0-9]+/g," ").trim();
  return !!k(a)&&k(a)===k(b);
}
// открытая на эту дату болезнь с таким названием; закрытая раньше — это прошлый случай, новый круп — новая болезнь
function findOpenEp(eps,name,date){
  return (eps||[]).filter(e=>sameIll(e.dx,name)&&e.d1<=date&&(!e.d2||e.d2>=date)).sort((a,b)=>b.d1.localeCompare(a.d1))[0]||null;
}
// что связано с болезнью: симптомы с этим поводом в её датах, приёмы и лекарства, привязанные к ней
function epLinks(P,ep,today){
  const end=ep.d2||today;
  return {
    sym:((P.sym||{}).log||[]).filter(x=>sameIll(x.p,ep.dx)&&x.d>=ep.d1&&x.d<=end).sort((a,b)=>a.d.localeCompare(b.d)),
    visits:(P.rec||[]).filter(r=>r.t==="visit"&&(r.ep===ep.id||(!r.ep&&r.epDx&&sameIll(r.epDx,ep.dx)&&r.d>=ep.d1&&r.d<=end))),
    meds:(P.meds||[]).filter(m=>m.ep===ep.id)
  };
}
// болезни из журнала: симптомы с поводом-болезнью, которых не покрывает ни одна болезнь, — на любом устройстве, не только там,
// где сохраняли форму. Только идущие случаи (последний симптом не старше 15 дней): старые поводы-симптомы не трогаем (Денис 28.09).
// id постоянный (человек, начало, название), чтобы «Закрыть болезнь» и правки находили его и после перезагрузки
function autoEps(S,who,today){
  const covered=x=>(S.ep||[]).some(e=>sameIll(e.dx,x.p)&&e.d1<=x.d&&(!e.d2||e.d2>=x.d));
  const isSym=p=>(S.cat||[]).some(c=>sameIll(c.n,p));   // «Температура» в поводе — симптом, не болезнь
  const out=[];
  const named=p=>/[a-zа-яё]{2}/i.test(p)&&!/^(не установлен|не уточн|без диагноза|нет$)/i.test(String(p).trim());   // «—» и «не установлено» — не болезнь
  for(const x of (S.log||[]).filter(x=>x.p&&x.d&&named(x.p)).sort((a,b)=>a.d.localeCompare(b.d))){
    if(covered(x)||isSym(x.p)) continue;
    const e=out.find(e=>sameIll(e.dx,x.p)&&rxDays(e.last,x.d)<=15);
    if(e){ e.last=x.d; if(!e.sym.includes(x.n)) e.sym.push(x.n); continue; }
    out.push({dx:x.p,d1:x.d,last:x.d,sym:[x.n]});

function medLev(a,b){ const m=a.length,n=b.length, d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
// "" — не знаю; иначе название, каким оно должно быть
function medFix(name,known){
  const low=t=>String(t||"").toLowerCase().replace(/ё/g,"е").trim(), w1=t=>low(t).split(/[\s,(]+/)[0]||"";
  const nm=String(name||"").trim(), first=w1(nm); if(first.length<5) return "";
  const exact=(known||[]).find(k=>low(k)===low(nm)); if(exact) return exact;
  if((known||[]).some(k=>w1(k)===first)) return "";                 // «Гексорал Верде» при «Гексорал» — вариант, не опечатка
  const lim=first.length>=8?2:1, best={};
  for(const k of known||[]){ const kw=String(k).trim().split(/[\s,(]+/)[0], dist=medLev(first,w1(k)); if(dist<=lim) (best[dist]=best[dist]||new Set()).add(kw); }
  const top=Object.keys(best).sort()[0]; if(!top||best[top].size!==1) return "";   // два похожих — не угадываем
  return [...best[top]][0]+nm.slice(nm.split(/[\s,(]/)[0].length);
}

  let m=(d.meds||[]).find(x=>medKeyOf(x.n)===key)||null;
  const log=((d.sym||{}).log||[]), eps=((d.sym||{}).ep||[]);
  const hits=log.filter(x=>x.m&&String(x.m).split(/,\s+/).some(t=>medKeyOf(t.trim().replace(/^(затем|и)\s+/i,""))===key))
    .sort((a,b)=>b.d.localeCompare(a.d));
  const epRx=[]; eps.forEach(e=>(e.rx||[]).forEach(r=>{ if(medKeyOf(r.m)===key) epRx.push({ep:e,r}); }));
  const plan=medPlanOf(cur,name), m0=m;
  const since=plan&&plan.started_on?plan.started_on:(m?medStart(m):null);
  let state="none", stateText="Не в списке «Принимает»", day=null;
  if(m&&plan&&plan.stop_on) m=Object.assign({},m,{to:plan.stop_on});   // дата окончания, выбранная человеком, главнее записи
  if(m){
    if(m.plan&&!(since&&since<=today)) { state="plan"; stateText="Назначено, ещё не начали"; }
    else if(since&&since<=today&&(!m.to||m.to>=today)&&!(m.stopped&&m.stopped<=today)){
      state="on"; day=rxDays(since,today); stateText=`Принимаем сейчас · с ${dd2(since)} · идёт ${day}-й день`; }
    else if(m.stopped&&m.stopped<=today){ state="off"; stateText="Не принимаем · отменено "+dd2(m.stopped); }
    else if(m.to&&m.to<today){ state="off"; stateText="Не принимаем · закончили "+dd2(m.to); }
    else { state="off"; stateText="Не принимаем"; }
  }
  const courses=[];
  if(m){ const st=since?full(since):(m.after?`после ${full(m.after)} (точная дата не известна)`:"дата начала не известна");
    courses.push({kind:"meds",text:`${st}${m.to?" — "+full(m.to):(state==="on"?" — идёт":"")}`,how:m.how||""}); }
  epRx.forEach(({ep,r})=>courses.push({kind:"ep",text:`${r.from?full(r.from):"без даты"}${r.to?" — "+full(r.to):" — идёт"}`,how:r.how||"",ep:ep.id,dx:ep.dx}));
  hits.forEach(x=>courses.push({kind:"log",text:full(x.d),how:`${x.n}${x.h?" · "+x.h:""}`}));
  const conflict=(m&&since&&epRx.length&&!(plan&&plan.started_on))?(()=>{ const r=epRx.find(z=>z.r.from&&z.r.from!==since); return r?{ep:r.r.from,meds:since}:null; })():null;
  const ref=typeof MEDREF!=="undefined"&&Object.keys(MEDREF).some(k=>medKeyOf(k)===key);
  return {name:m?m.n:name,state,stateText,since,day,courses,hits,conflict,plan,till:(m0&&m0.till)||"",hasMed:!!m0,
    needInfo:state==="on"&&!ref,
    journalText:hits.length?"":`У ${genitive(d.short)} в журнале симптомов не встречается`};
}

// ── Болезнь: одна форма на «новую» и «правку» (ТЗ-002 блоки 6, 7) ──
const TREAT="treatment";
function dd2(d){ const t=new Date(d+"T12:00:00Z"); return String(t.getUTCDate()).padStart(2,"0")+"."+String(t.getUTCMonth()+1).padStart(2,"0"); }
// «с» + N дней включительно → «по»; «с», «по» → сколько дней
function rxTo(from,days){ const t=new Date(from+"T12:00:00Z"); t.setUTCDate(t.getUTCDate()+(+days)-1); return t.toISOString().slice(0,10); }
function rxDays(from,to){ return Math.round((Date.parse(to+"T12:00:00Z")-Date.parse(from+"T12:00:00Z"))/864e5)+1; }
function rxCheck(r){ if(r.m&&!r.from) return "Укажите, с какого числа"; return r.from&&r.to&&r.to<r.from?"Дата окончания раньше начала":""; }
function rxText(list,today){
  return (list||[]).filter(r=>r.m).map(r=>r.to?`${r.m} ${dd2(r.from)}–${dd2(r.to)} · ${rxDays(r.from,r.to)} дн.`
    :`${r.m} с ${dd2(r.from)} · идёт ${rxDays(r.from,today)} дн.`).join(", ");
}
function isAntibiotic(name){
  // «Амоксиклав», «амоксиклав 250» и «Амоксиклав 875» из справочника — одно лекарство: сравниваем без дозировки и формы
  const base=t=>String(t||"").toLowerCase().replace(/ё/g,"е").replace(/[\s(,].*$/,"").trim();
  const R=typeof MEDREF!=="undefined"?MEDREF:{}, k=base(name);
  return !!k&&Object.keys(R).some(m=>base(m)===k&&/антибиотик/i.test(R[m].c||""));
}
// правки болезней: rec — новые поля, null — удалена
function applyEpEdits(eps,edits){
  let out=eps.slice();
  for(const e of edits){ const i=out.findIndex(x=>x.id===e.id); if(i<0) continue;
    if(!e.rec){ out.splice(i,1); continue; } out[i]=Object.assign({},out[i],e.rec,{edited:1}); }
  return out;
}

    (P.series||[]).forEach(s=>{ if(!s._base) s._base=(s.pts||[]).slice(); s.pts=s._base.slice(); }); }
  // точка анализа с сайта — сразу в ряд «Динамики» с тем же названием (без скобок, без регистра); дата уже есть — не трогаем

  const addPt=(P,d,it)=>{ const v=parseFloat(String(it.value||"").replace(",",".")); if(!isFinite(v)||!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
    const s=(P.series||[]).find(s=>bare(s.name)===bare(it.name)); if(!s) return;
    const dd=d.split("-").reverse().join("."), key=x=>x.split(".").reverse().join("");

        sys:x.sys||null,st:x.st||"",v:"",n:"",res:[x.concl,q,from].filter(Boolean).join(" · "),from,
        full:[["ЗАКЛЮЧЕНИЕ",x.concl],["ОПИСАНИЕ",x.desc],["ГДЕ И КТО",[x.place,x.doc].filter(Boolean).join(", ")]].filter(f=>f[1]),
        files:e.files||[],entry:e.id,source:e.source_id||null});
      continue;

        to:x.to||"",stopped:st==="отменено"?(x.stopped||x.d||""):"",how:[x.dose,x.how].filter(Boolean).join(" · "),
        why:[vis?`назначил: ${vis.who||"врач"}${vis.d?" "+ru(vis.d):""}${x.epDx?" · по "+x.epDx:""}`:pv?`назначено на приёме: ${pv.who||"врач"}${pv.doc?" "+pv.doc:""} ${pv.d?ru(pv.d):""}`.trim():x.doc?`назначил(а) ${x.doc}${x.d?" "+ru(x.d):""}`:"",q,from].filter(Boolean).join(" · "),entry:e.id,data:x});

      ["НАЗНАЧЕНО НА ЭТОМ ПРИЁМЕ",live.filter(c=>c.parent_id===e.id||(c.kind==="med"&&((c.data||{}).visit||{}).entry===e.id)).map(c=>c.kind==="med"?`💊 ${(c.data||{}).title||""}`:`📌 ${(c.data||{}).what||""}`).join("; ")]]
      .filter(f=>f[1]):[]);
    (P.rec=P.rec||[]).push({t:e.kind==="lab"?"lab":e.kind==="visit"?"visit":"note",d:x.d||String(e.created_at).slice(0,10),
      title:x.title||(e.kind==="visit"?`${x.who||"Врач"}: приём`:"Запись"),who:x.who||"",place:x.place||"",sys:x.sys||null,st:x.st||"",v:x.v||"",n:x.n||"",
      res:[x.res||x.dx||x.text||"",q,from].filter(Boolean).join(" · "),from,full,files:e.files||[],entry:e.id,source:e.source_id||null,
      ep:x.ep||null,epDx:x.epDx||"",data:x});
  }
